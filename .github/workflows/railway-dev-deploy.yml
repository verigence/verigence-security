name: Railway DEV Deployment

on:
  push:
    branches:
      - dev

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: railway-dev-deployment
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/verigence/verigence-security
  RAILWAY_PROJECT_ID: a6808842-2e90-44f8-9172-63a905b24b5c
  RAILWAY_ENVIRONMENT_ID: 09e12bb5-9781-4b01-974b-fde54d01e37c
  RAILWAY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1

jobs:
  deploy-dev:
    name: Build immutable image and deploy to Railway DEV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Wait for successful Security CI on exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"

            ci_run="$(printf '%s' "$response" | jq -c '[.workflow_runs[] | select(.name == "Security CI")] | first // empty')"
            if [ -z "$ci_run" ]; then
              echo "Security CI has not been registered for $GITHUB_SHA yet; waiting 5 seconds."
              sleep 5
              continue
            fi

            status="$(printf '%s' "$ci_run" | jq -r '.status')"
            conclusion="$(printf '%s' "$ci_run" | jq -r '.conclusion // ""')"
            run_id="$(printf '%s' "$ci_run" | jq -r '.id')"
            echo "Security CI run $run_id status=$status conclusion=${conclusion:-pending}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Security CI passed for exact source commit $GITHUB_SHA."
                exit 0
              fi
              echo "::error::Security CI completed with conclusion '$conclusion' for $GITHUB_SHA. Deployment is blocked."
              exit 1
            fi
            sleep 5
          done

          echo "::error::Timed out waiting for Security CI on exact source commit $GITHUB_SHA."
          exit 1

      - name: Check out exact validated DEV commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Record and validate immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "Immutable image: $image_ref"

          docker logout ghcr.io >/dev/null 2>&1 || true
          if ! docker manifest inspect "$image_ref" >/dev/null 2>&1; then
            echo "::error::Published GHCR image is not anonymously pullable by Railway."
            exit 1
          fi
          docker pull "$image_ref" >/dev/null
          docker run --rm "$image_ref" python --version 2>&1 | grep -E '^Python 3\.12\.'

      - name: Verify Railway Project Token and exact DEV project scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN is not configured."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            echo "::error::RAILWAY_TOKEN could not be validated as a Railway Project Token."
            exit 1
          fi

          token_project_id="$(printf '%s' "$response" | jq -r '.data.projectToken.projectId // empty')"
          token_environment_id="$(printf '%s' "$response" | jq -r '.data.projectToken.environmentId // empty')"
          [ "$token_project_id" = "$RAILWAY_PROJECT_ID" ] || { echo "::error::RAILWAY_TOKEN project scope mismatch."; exit 1; }
          [ "$token_environment_id" = "$RAILWAY_ENVIRONMENT_ID" ] || { echo "::error::RAILWAY_TOKEN environment scope mismatch."; exit 1; }
          echo "Railway Project Token scope matches the exact DEV project and environment."

      - name: Snapshot current Railway DEV deployment
        id: before
        shell: bash
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId source { image } latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            echo "::error::Unable to inspect Railway DEV service instance."
            exit 1
          fi

          node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first // {}')"
          if [ "$(printf '%s' "$node" | jq -r '.serviceId // empty')" != "$RAILWAY_SERVICE_ID" ]; then
            echo "::error::Railway DEV service instance is missing."
            exit 1
          fi
          echo "id=$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')" >> "$GITHUB_OUTPUT"

      - name: Attach exact immutable image to Railway DEV instance
        shell: bash
        run: |
          set -euo pipefail
          mutation='mutation EnvironmentPatchCommit($environmentId: String!, $patch: EnvironmentConfig!, $commitMessage: String) { environmentPatchCommit(environmentId: $environmentId, patch: $patch, commitMessage: $commitMessage) }'
          patch="$(jq -cn \
            --arg service "$RAILWAY_SERVICE_ID" \
            --arg image "${{ steps.image.outputs.image_ref }}" \
            '{services:{($service):{source:{image:$image}}}}')"
          variables="$(jq -cn \
            --arg environment "$RAILWAY_ENVIRONMENT_ID" \
            --arg message "Deploy verigence-security DEV ${GITHUB_SHA}" \
            --argjson patch "$patch" \
            '{environmentId:$environment,patch:$patch,commitMessage:$message}')"
          body="$(jq -cn --arg query "$mutation" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            echo "::error::Railway rejected the exact DEV image configuration."
            exit 1
          fi
          echo "Railway accepted the exact immutable image on the DEV service instance."

      - name: Wait for exact Railway DEV deployment to succeed
        id: deployment
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.before.outputs.id }}
          EXPECTED_IMAGE: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId source { image } latestDeployment { id status createdAt deploymentStopped instances { id status } } } } } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"

          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$body")"
            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
              printf '%s\n' "$response" | jq -c '.errors'
              exit 1
            fi

            node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first // {}')"
            source_image="$(printf '%s' "$node" | jq -r '.source.image // empty')"
            deployment_id="$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')"
            status="$(printf '%s' "$node" | jq -r '.latestDeployment.status // empty')"

            if [ "$source_image" != "$EXPECTED_IMAGE" ]; then
              echo "Waiting for Railway DEV source to reflect exact digest."
              sleep 5
              continue
            fi
            if [ -z "$deployment_id" ] || [ "$deployment_id" = "${PREVIOUS_DEPLOYMENT_ID:-}" ]; then
              echo "Waiting for Railway to create the new DEV deployment."
              sleep 5
              continue
            fi

            echo "Railway deployment $deployment_id status=$status"
            case "$status" in
              SUCCESS)
                echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "::error::Railway deployment $deployment_id ended with status $status."
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done

          echo "::error::Timed out waiting for Railway DEV deployment to reach SUCCESS."
          exit 1

      - name: Resolve or create Railway DEV public domain
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { id domain } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Project-Access-Token: $RAILWAY_TOKEN" --header 'Content-Type: application/json' --data "$body")"
          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            exit 1
          fi
          domain="$(printf '%s' "$response" | jq -r '.data.domains.serviceDomains[0].domain // empty')"

          if [ -z "$domain" ]; then
            mutation='mutation serviceDomainCreate($input: ServiceDomainCreateInput!) { serviceDomainCreate(input: $input) { domain } }'
            mutation_variables="$(jq -cn --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{input:{environmentId:$environment,serviceId:$service}}')"
            mutation_body="$(jq -cn --arg query "$mutation" --argjson variables "$mutation_variables" '{query:$query,variables:$variables}')"
            response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Project-Access-Token: $RAILWAY_TOKEN" --header 'Content-Type: application/json' --data "$mutation_body")"
            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
              printf '%s\n' "$response" | jq -c '.errors'
              exit 1
            fi
            domain="$(printf '%s' "$response" | jq -r '.data.serviceDomainCreate.domain // empty')"
          fi

          [ -n "$domain" ] || { echo "::error::Railway did not provide a public DEV domain."; exit 1; }
          echo "base_url=https://$domain" >> "$GITHUB_OUTPUT"
          echo "Railway DEV public domain resolved."

      - name: Verify deployed readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' "$base_url/health/ready" || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/ready.json
              exit 0
            fi
            echo "Readiness attempt $attempt/30 returned HTTP ${code:-000}; waiting 5 seconds."
            sleep 5
          done
          echo "::error::Railway DEV readiness check failed after successful deployment."
          exit 1

      - name: Verify liveness and correlation ID over deployed HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          correlation_id="$(cat /proc/sys/kernel/random/uuid)"
          code="$(curl --silent --show-error --dump-header /tmp/live.headers --output /tmp/live.json --write-out '%{http_code}' \
            -H "X-Correlation-ID: $correlation_id" \
            "$base_url/health/live")"
          [ "$code" = "200" ] || { echo "::error::Railway DEV liveness returned HTTP $code."; exit 1; }
          returned="$(awk 'BEGIN{IGNORECASE=1} /^X-Correlation-ID:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/live.headers)"
          [ "$returned" = "$correlation_id" ] || { echo "::error::X-Correlation-ID was not preserved over deployed HTTPS."; exit 1; }
          cat /tmp/live.json

      - name: Record deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "source_commit=${GITHUB_SHA}"
          echo "image=${{ steps.image.outputs.image_ref }}"
          echo "railway_deployment=${{ steps.deployment.outputs.id }}"
          echo "readiness=PASS"
          echo "liveness=PASS"
          echo "correlation_id=PASS"
