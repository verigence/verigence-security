name: Railway DEV Deployment

on:
  push:
    branches:
      - dev

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: railway-dev-deployment
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/verigence/verigence-security
  RAILWAY_PROJECT_ID: a6808842-2e90-44f8-9172-63a905b24b5c
  RAILWAY_ENVIRONMENT_ID: 09e12bb5-9781-4b01-974b-fde54d01e37c
  RAILWAY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1

jobs:
  deploy-dev:
    name: Build immutable image and deploy to Railway DEV
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Wait for successful Security CI on exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"

            ci_run="$(printf '%s' "$response" | jq -c '[.workflow_runs[] | select(.name == "Security CI")] | first // empty')"
            if [ -z "$ci_run" ]; then
              echo "Security CI has not been registered for $GITHUB_SHA yet; waiting 5 seconds."
              sleep 5
              continue
            fi

            status="$(printf '%s' "$ci_run" | jq -r '.status')"
            conclusion="$(printf '%s' "$ci_run" | jq -r '.conclusion // ""')"
            run_id="$(printf '%s' "$ci_run" | jq -r '.id')"
            echo "Security CI run $run_id status=$status conclusion=${conclusion:-pending}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Security CI passed for exact source commit $GITHUB_SHA."
                exit 0
              fi
              echo "::error::Security CI completed with conclusion '$conclusion' for $GITHUB_SHA. Deployment is blocked."
              exit 1
            fi

            sleep 5
          done

          echo "::error::Timed out waiting for Security CI on exact source commit $GITHUB_SHA."
          exit 1

      - name: Check out exact validated DEV commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Record and validate immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "Immutable image: $image_ref"

          docker logout ghcr.io >/dev/null 2>&1 || true
          if ! docker manifest inspect "$image_ref" >/dev/null 2>&1; then
            echo "::error::Published GHCR image is not anonymously pullable by Railway."
            exit 1
          fi

          docker pull "$image_ref" >/dev/null
          docker run --rm "$image_ref" python --version 2>&1 | grep -E '^Python 3\.12\.'

      - name: Verify Railway token and exact DEV scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN is not configured."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            echo "::error::RAILWAY_TOKEN could not be validated as a Railway Project Token."
            exit 1
          fi

          token_project_id="$(printf '%s' "$response" | jq -r '.data.projectToken.projectId // empty')"
          token_environment_id="$(printf '%s' "$response" | jq -r '.data.projectToken.environmentId // empty')"

          if [ "$token_project_id" != "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::RAILWAY_TOKEN is scoped to a different Railway project."
            exit 1
          fi
          if [ "$token_environment_id" != "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo "::error::RAILWAY_TOKEN is scoped to a different Railway environment."
            exit 1
          fi

          echo "Railway Project Token scope matches the configured DEV project and environment."

      - name: Snapshot existing Railway deployments
        id: before
        shell: bash
        run: |
          set -euo pipefail
          query='query deployments($input: DeploymentListInput!) { deployments(input: $input, first: 10) { edges { node { id status createdAt } } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg service "$RAILWAY_SERVICE_ID" '{input:{projectId:$project,serviceId:$service}}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            echo "::error::Unable to snapshot Railway deployments before deployment."
            exit 1
          fi

          before_ids="$(printf '%s' "$response" | jq -c '[.data.deployments.edges[].node.id]')"
          echo "ids=$before_ids" >> "$GITHUB_OUTPUT"

      - name: Install pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli@5.30.1
          railway --version

      - name: Connect exact immutable image to Railway DEV service
        shell: bash
        run: |
          set -euo pipefail
          railway service source connect \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --image "${{ steps.image.outputs.image_ref }}" \
            --json

      - name: Wait for the new Railway deployment to succeed
        id: deployment
        shell: bash
        env:
          BEFORE_IDS: ${{ steps.before.outputs.ids }}
        run: |
          set -euo pipefail
          query='query deployments($input: DeploymentListInput!) { deployments(input: $input, first: 10) { edges { node { id status createdAt } } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg service "$RAILWAY_SERVICE_ID" '{input:{projectId:$project,serviceId:$service}}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          deployment_id=""

          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$body")"

            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
              printf '%s\n' "$response" | jq -c '.errors'
              echo "::error::Unable to query Railway deployment status."
              exit 1
            fi

            if [ -z "$deployment_id" ]; then
              deployment_id="$(printf '%s' "$response" | jq -r --argjson before "$BEFORE_IDS" '[.data.deployments.edges[].node | select((.id as $id | $before | index($id)) == null)] | sort_by(.createdAt) | reverse | first | .id // empty')"
              if [ -z "$deployment_id" ]; then
                echo "No new Railway deployment visible yet; waiting 5 seconds."
                sleep 5
                continue
              fi
              echo "Detected new Railway deployment: $deployment_id"
            fi

            status="$(printf '%s' "$response" | jq -r --arg id "$deployment_id" '[.data.deployments.edges[].node | select(.id == $id)] | first | .status // empty')"
            echo "Railway deployment $deployment_id status=${status:-unknown}"

            case "$status" in
              SUCCESS)
                echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "::error::Railway deployment $deployment_id ended with status $status."
                exit 1
                ;;
              *)
                sleep 5
                ;;
            esac
          done

          echo "::error::Timed out waiting for Railway deployment $deployment_id to reach SUCCESS."
          exit 1

      - name: Resolve or create Railway DEV public domain
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { id domain } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            echo "::error::Unable to query Railway service domains."
            exit 1
          fi

          domain="$(printf '%s' "$response" | jq -r '.data.domains.serviceDomains[0].domain // empty')"
          if [ -z "$domain" ]; then
            mutation='mutation serviceDomainCreate($input: ServiceDomainCreateInput!) { serviceDomainCreate(input: $input) { domain } }'
            mutation_variables="$(jq -cn --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{input:{environmentId:$environment,serviceId:$service}}')"
            mutation_body="$(jq -cn --arg query "$mutation" --argjson variables "$mutation_variables" '{query:$query,variables:$variables}')"
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$mutation_body")"

            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
              printf '%s\n' "$response" | jq -c '.errors'
              echo "::error::Unable to create Railway-provided domain."
              exit 1
            fi
            domain="$(printf '%s' "$response" | jq -r '.data.serviceDomainCreate.domain // empty')"
          fi

          if [ -z "$domain" ]; then
            echo "::error::Railway did not provide a public service domain."
            exit 1
          fi

          echo "base_url=https://$domain" >> "$GITHUB_OUTPUT"
          echo "Railway DEV base URL: https://$domain"

      - name: Verify deployed readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' "$base_url/health/ready" || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/ready.json
              exit 0
            fi
            echo "Readiness attempt $attempt/30 returned HTTP ${code:-000}; waiting 5 seconds."
            sleep 5
          done
          echo "::error::Railway DEV readiness check failed after successful deployment."
          exit 1

      - name: Verify liveness and correlation ID over deployed HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          correlation_id="$(python -c 'import uuid; print(uuid.uuid4())')"
          curl --fail-with-body --silent --show-error \
            --dump-header /tmp/live.headers \
            --header "X-Correlation-ID: $correlation_id" \
            "$base_url/health/live" > /tmp/live.json
          returned="$(awk 'BEGIN{IGNORECASE=1} /^X-Correlation-ID:/ {gsub("\\r", "", $2); print $2}' /tmp/live.headers | tail -n 1)"
          if [ "$returned" != "$correlation_id" ]; then
            echo "::error::Correlation ID mismatch. Expected $correlation_id, received ${returned:-<missing>}."
            exit 1
          fi
          cat /tmp/live.json

      - name: Record deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "Source commit: $GITHUB_SHA"
          echo "Immutable image: ${{ steps.image.outputs.image_ref }}"
          echo "Railway deployment: ${{ steps.deployment.outputs.id }}"
          echo "Railway project: $RAILWAY_PROJECT_ID"
          echo "Railway environment: $RAILWAY_ENVIRONMENT_ID"
          echo "Railway service: $RAILWAY_SERVICE_ID"
          echo "Base URL: ${{ steps.domain.outputs.base_url }}"
