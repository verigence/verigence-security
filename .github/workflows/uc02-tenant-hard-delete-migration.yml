name: UC02 Tenant Hard Delete Migration

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  migrate-uc02-tenant-delete:
    name: Apply and verify UC02 Tenant delete migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and PostgreSQL client
        id: install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Resolve migration database
        id: database
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || {
            echo "::error::MIGRATION_DATABASE_URL is not configured."
            exit 1
          }
          case "$raw" in
            postgresql+psycopg://*) database_url="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) database_url="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) database_url="$raw" ;;
            *) echo "::error::MIGRATION_DATABASE_URL is not PostgreSQL."; exit 1 ;;
          esac
          echo "::add-mask::$database_url"
          echo "SECURITY_MIGRATION_DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          psql "$database_url" -X -v ON_ERROR_STOP=1 -Atc 'SELECT 1' >/dev/null

      - name: Apply UC02 migration
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f migrations/0024_uc02_tenant_hard_delete.sql

      - name: Verify historical audit Tenant FKs are detached
        id: fkcheck
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM pg_constraint con
            JOIN pg_class tbl ON tbl.oid=con.conrelid
            JOIN pg_namespace ns ON ns.oid=tbl.relnamespace
            WHERE con.contype='f'
              AND con.confrelid='security.tenants'::regclass
              AND ns.nspname='security'
              AND tbl.relname IN ('admin_change_records','security_events');
          ")"
          [ "$remaining" = "0" ] || {
            echo "::error::UC02 audit-history Tenant FK detachment failed."
            exit 1
          }
          echo "UC02_TENANT_DELETE_MIGRATION=PASS"

      - name: Run UC02 Tenant hard-delete PostgreSQL proof
        id: proof
        shell: bash
        run: |
          set +e
          TEST_DATABASE_URL="$SECURITY_MIGRATION_DATABASE_URL" \
            pytest -q --tb=line tests/integration/test_uc02_tenant_hard_delete.py 2>&1 | tee /tmp/uc02-proof.log
          code=${PIPESTATUS[0]}
          summary="$(grep -E 'UC02_(PROOF|CLEANUP)_EXCEPTION=' /tmp/uc02-proof.log | tail -n 1 | tr '\n' ' ' | cut -c1-120)"
          if [ -z "$summary" ]; then
            summary="$(grep -E 'IntegrityError|ForeignKeyViolation|ProgrammingError|AssertionError|RuntimeError|sqlalchemy\.exc|psycopg\.' /tmp/uc02-proof.log | tail -n 1 | tr '\n' ' ' | cut -c1-120)"
          fi
          if [ -z "$summary" ]; then
            summary="$(grep -E 'FAILED|ERROR' /tmp/uc02-proof.log | tail -n 1 | tr '\n' ' ' | cut -c1-120)"
          fi
          if [ -z "$summary" ]; then
            summary="$(tail -n 1 /tmp/uc02-proof.log | tr '\n' ' ' | cut -c1-120)"
          fi
          slug="$(printf '%s' "$summary" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-70)"
          if [ -z "$slug" ]; then
            slug="unknown"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish UC02 stage diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const proofCode = '${{ steps.proof.outputs.code }}';
            const proofState = proofCode === '0' ? 'success' : 'failure';
            const proofSummary = '${{ steps.proof.outputs.summary }}';
            const proofSlug = '${{ steps.proof.outputs.slug }}' || 'unknown';
            const stages = [
              ['install', '${{ steps.install.outcome }}'],
              ['database', '${{ steps.database.outcome }}'],
              ['migration', '${{ steps.migration.outcome }}'],
              ['fkcheck', '${{ steps.fkcheck.outcome }}'],
            ];
            for (const [name, outcome] of stages) {
              const state = outcome === 'success' ? 'success' : 'failure';
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state,
                context: `uc02/security-${name}`,
                description: `${name} ${outcome}`.slice(0, 140)
              });
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: proofState,
              context: proofState === 'success'
                ? 'uc02/security-proof'
                : `uc02/security-proof-error-${proofSlug}`.slice(0, 100),
              description: (proofSummary || `proof ${proofState}`).slice(0, 140)
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: proofState,
              context: 'uc02/security-tenant-delete-proof',
              description: proofState === 'success'
                ? 'Migration and PostgreSQL hard-delete proof passed'
                : (proofSummary || 'PostgreSQL hard-delete proof failed').slice(0, 140)
            });

      - name: Fail job when PostgreSQL proof failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.proof.outputs.code }}" = "0"
