name: DEV Tenant Administration

on:
  workflow_dispatch:
    inputs:
      tenant_code:
        description: Stable DEV Tenant code
        required: true
        default: test-project
        type: string
      tenant_name:
        description: DEV Tenant display name
        required: true
        default: TestProject
        type: string
      activate_after_create:
        description: Activate the Tenant after create/reuse
        required: true
        default: true
        type: boolean
  push:
    branches:
      - integration/security-dev-convergence-v1
    paths:
      - ".github/workflows/dev-tenant-admin.yml"
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/dev-tenant-admin.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: security-dev-tenant-admin
  cancel-in-progress: false

jobs:
  tenant-admin:
    name: Create or reuse DEV Tenant as existing SuperAdmin
    if: github.event_name != 'pull_request' || github.head_ref == 'integration/security-dev-convergence-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TENANT_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.tenant_code || 'test-project' }}
      TENANT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tenant_name || 'TestProject' }}
      ACTIVATE_AFTER_CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_after_create || 'true' }}
      CORRELATION_ID: dev-tenant-admin-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Wait for successful Security CI on exact SHA
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&event=pull_request&per_page=50")"
            ci_run="$(printf '%s' "$response" | jq -c \
              '[.workflow_runs[] | select(.name == "Security CI")] | sort_by(.created_at) | last // empty')"
            if [ -n "$ci_run" ]; then
              status="$(printf '%s' "$ci_run" | jq -r '.status')"
              conclusion="$(printf '%s' "$ci_run" | jq -r '.conclusion // ""')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Security CI passed for ${SOURCE_SHA}"
                  exit 0
                fi
                echo "Security CI did not pass for ${SOURCE_SHA}: ${conclusion}" >&2
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for Security CI on ${SOURCE_SHA}" >&2
          exit 1

      - name: Check out exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Security runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Create or reuse Tenant through Security service as existing SuperAdmin
        id: tenant
        shell: bash
        run: |
          set -euo pipefail
          raw_database_url="${MIGRATION_DATABASE_URL:-${DEV_DATABASE_URL:-}}"
          test -n "$raw_database_url" || { echo "MIGRATION_DATABASE_URL or DEV_DATABASE_URL is required" >&2; exit 1; }
          echo "::add-mask::$raw_database_url"
          echo "TENANT_ADMIN_DATABASE_URL=$raw_database_url" >> "$GITHUB_ENV"
          test -n "${TENANT_CODE:-}" || { echo "tenant_code cannot be blank" >&2; exit 1; }
          test -n "${TENANT_NAME:-}" || { echo "tenant_name cannot be blank" >&2; exit 1; }

          TENANT_ADMIN_DATABASE_URL="$raw_database_url" python - <<'PY'
          from __future__ import annotations

          import os
          from sqlalchemy import text

          from verigence_security.config import Settings
          from verigence_security.db.session import build_session_factory
          from verigence_security.services.platform_admin import PlatformTenantService

          tenant_code = os.environ["TENANT_CODE"].strip()
          tenant_name = os.environ["TENANT_NAME"].strip()
          correlation_id = os.environ["CORRELATION_ID"]
          activate = os.environ.get("ACTIVATE_AFTER_CREATE", "true").lower() == "true"

          if not tenant_code or not tenant_name:
              raise SystemExit("Tenant code and name must be non-blank")

          settings = Settings(database_url=os.environ["TENANT_ADMIN_DATABASE_URL"])
          factory = build_session_factory(settings)
          if factory is None:
              raise SystemExit("Security DEV database is not configured")

          with factory() as session:
              super_admin_rows = list(
                  session.execute(
                      text(
                          """
                          SELECT DISTINCT a.user_id,e.provider_subject
                          FROM security.platform_user_role_assignments a
                          JOIN security.security_principals p
                            ON p.principal_id=a.user_id AND p.status='ACTIVE'
                          JOIN security.users u
                            ON u.user_id=a.user_id AND u.status='ACTIVE'
                          JOIN security.external_identities e
                            ON e.user_id=a.user_id
                           AND e.provider='CLERK'
                           AND e.status='ACTIVE'
                          WHERE a.role_key='platform.super_admin'
                            AND a.status='ACTIVE'
                          ORDER BY a.user_id
                          """
                      )
                  ).mappings()
              )
              if len(super_admin_rows) != 1:
                  raise SystemExit(
                      "Expected exactly one ACTIVE Clerk-backed platform.super_admin; "
                      f"found {len(super_admin_rows)}"
                  )

              actor_user_id = str(super_admin_rows[0]["user_id"])
              existing = session.execute(
                  text(
                      """
                      SELECT tenant_id,tenant_code,tenant_name,status,
                             created_at_utc,updated_at_utc
                      FROM security.tenants
                      WHERE tenant_code=:tenant_code
                      FOR UPDATE
                      """
                  ),
                  {"tenant_code": tenant_code},
              ).mappings().first()

              service = PlatformTenantService(session)
              if existing is None:
                  tenant = service.create_tenant(
                      actor_user_id=actor_user_id,
                      tenant_code=tenant_code,
                      tenant_name=tenant_name,
                      correlation_id=correlation_id,
                  )
                  print(f"Created Tenant {tenant_code} as CONFIGURING")
              else:
                  if str(existing["tenant_name"]) != tenant_name:
                      raise SystemExit(
                          f"Tenant code {tenant_code!r} already exists with a different name; refusing overwrite"
                      )
                  tenant = dict(existing)
                  print(f"Reusing existing Tenant {tenant_code} with status {tenant['status']}")

              tenant_id = str(tenant["tenant_id"])
              current_status = str(tenant["status"])
              if activate:
                  if current_status == "CONFIGURING":
                      activated = service.activate_tenant(
                          actor_user_id=actor_user_id,
                          tenant_id=tenant_id,
                          correlation_id=correlation_id,
                      )
                      if activated is None:
                          raise SystemExit("Tenant disappeared before activation")
                      tenant = activated
                      current_status = str(tenant["status"])
                      print(f"Activated Tenant {tenant_code}")
                  elif current_status == "ACTIVE":
                      print(f"Tenant {tenant_code} is already ACTIVE")
                  else:
                      raise SystemExit(
                          f"Tenant {tenant_code} is {current_status}; refusing automatic activation"
                      )

              verified = session.execute(
                  text(
                      """
                      SELECT tenant_id,tenant_code,tenant_name,status
                      FROM security.tenants
                      WHERE tenant_id=:tenant_id
                      """
                  ),
                  {"tenant_id": tenant_id},
              ).mappings().one()
              if str(verified["tenant_code"]) != tenant_code or str(verified["tenant_name"]) != tenant_name:
                  raise SystemExit("Persisted Tenant identity does not match requested Tenant")
              if activate and str(verified["status"]) != "ACTIVE":
                  raise SystemExit("Tenant activation was requested but persisted status is not ACTIVE")

              output_path = os.environ["GITHUB_OUTPUT"]
              with open(output_path, "a", encoding="utf-8") as handle:
                  handle.write(f"tenant_id={tenant_id}\n")
                  handle.write(f"tenant_status={verified['status']}\n")

              summary_path = os.environ["GITHUB_STEP_SUMMARY"]
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("## DEV Tenant Administration\n\n")
                  handle.write(f"- Tenant code: `{tenant_code}`\n")
                  handle.write(f"- Tenant name: `{tenant_name}`\n")
                  handle.write(f"- Tenant ID: `{tenant_id}`\n")
                  handle.write(f"- Status: `{verified['status']}`\n")
                  handle.write("- Actor: existing ACTIVE Clerk-backed `platform.super_admin`\n")
          PY

      - name: Report Tenant
        shell: bash
        run: |
          set -euo pipefail
          echo "tenant_id=${{ steps.tenant.outputs.tenant_id }}"
          echo "tenant_status=${{ steps.tenant.outputs.tenant_status }}"
