name: Security v2 Ruff Fix

on:
  push:
    branches:
      - ops/security-v2-ci-diagnose
    paths:
      - .github/workflows/security-v2-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/security-v2-ci-diagnose
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.9,<1"
      - name: Apply safe Ruff fixes
        run: ruff check src tests scripts --fix || true
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet; then
            echo "No Ruff changes required"
            exit 0
          fi
          git add src tests scripts
          git commit -m "style: apply safe Ruff fixes"
          git push origin HEAD:ops/security-v2-ci-diagnose
