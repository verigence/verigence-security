name: UC-001 OTP Fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-otp-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore verifiable Clerk email-address flow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/verigence_security/adapters/clerk_backend.py')
          text = path.read_text()
          old_doc = '''        """Create a banned Clerk user with a reserved email and send an email OTP.\n\n        Current Clerk Backend API supports creating email identifiers with status ``reserved``.\n        That keeps the address unverified from the first provider write and removes the previous\n        create-verified-then-patch-back-to-unverified transition. The user is also created banned,\n        so no provider session can become usable before Verigence Security activates the USER.\n        """'''
          new_doc = '''        """Create a banned Clerk user, make its email explicitly unverified, and send OTP.\n\n        Clerk createUser creates supplied email addresses verified by default. The user is created\n        banned first, so that transient provider state cannot create a usable session. Security then\n        immediately sets the exact primary email address to verified=false and prepares email-code\n        verification. This produces a real Clerk EmailAddress verification object for OTP attempts.\n        """'''
          if text.count(old_doc) != 1:
              raise SystemExit('Expected create_pending_email_user doc block was not found exactly once')
          text = text.replace(old_doc, new_doc)

          old_payload = '''                "email_address": [email],\n                "email_address_identification_status": ["reserved"],\n                "password": password,\n                "banned": True,'''
          new_payload = '''                "email_address": [email],\n                "password": password,\n                "banned": True,'''
          if text.count(old_payload) != 1:
              raise SystemExit('Expected reserved Clerk payload was not found exactly once')
          text = text.replace(old_payload, new_payload)

          old_prepare = '''        try:\n            self.prepare_email_verification(email_address_id)'''
          new_prepare = '''        try:\n            self._request_object(\n                "PATCH",\n                f"/email_addresses/{email_address_id}",\n                json={"verified": False},\n            )\n            self.prepare_email_verification(email_address_id)'''
          if text.count(old_prepare) != 1:
              raise SystemExit('Expected prepare block was not found exactly once')
          text = text.replace(old_prepare, new_prepare)
          path.write_text(text)

          test_path = Path('tests/unit/test_clerk_backend_facade_v148.py')
          test = test_path.read_text()
          test = test.replace(
              'def test_pending_user_is_banned_reserved_then_email_code_is_prepared() -> None:',
              'def test_pending_user_is_banned_unverified_then_email_code_is_prepared() -> None:',
          )
          old_asserts = '''    assert calls[0][2]["banned"] is True\n    assert calls[0][2]["email_address"] == ["amit@example.com"]\n    assert calls[0][2]["email_address_identification_status"] == ["reserved"]\n    assert calls[1] == (\n        "POST",\n        "https://api.clerk.test/v1/email_addresses/idn_signup/prepare_verification",\n        {"strategy": "email_code"},\n    )\n    assert len(calls) == 2'''
          new_asserts = '''    assert calls[0][2]["banned"] is True\n    assert calls[0][2]["email_address"] == ["amit@example.com"]\n    assert "email_address_identification_status" not in calls[0][2]\n    assert calls[1] == (\n        "PATCH",\n        "https://api.clerk.test/v1/email_addresses/idn_signup",\n        {"verified": False},\n    )\n    assert calls[2] == (\n        "POST",\n        "https://api.clerk.test/v1/email_addresses/idn_signup/prepare_verification",\n        {"strategy": "email_code"},\n    )\n    assert len(calls) == 3'''
          if test.count(old_asserts) != 1:
              raise SystemExit('Expected Clerk pending-user assertions were not found exactly once')
          test = test.replace(old_asserts, new_asserts)
          test_path.write_text(test)
          PY

      - name: Install Security and test OTP adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q tests/unit/test_clerk_backend_facade_v148.py

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/verigence_security/adapters/clerk_backend.py tests/unit/test_clerk_backend_facade_v148.py
          git diff --cached --check
          git commit -m 'fix(onboarding): create verifiable Clerk email OTP state'
          git push origin HEAD:dev
