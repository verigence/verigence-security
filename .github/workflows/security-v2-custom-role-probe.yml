name: Security v2 Custom Role Probe

on:
  push:
    branches: [dev]
    paths: [.github/workflows/security-v2-custom-role-probe.yml]

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Publish unmapped role-key counts only
        shell: bash
        run: |
          set -Eeuo pipefail
          target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$1" -f context=security-v2-custom-role-probe \
              -f description="$2" -f target_url="$target" >/dev/null
          }
          trap 'post failure "Custom-role classification probe failed"' ERR
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || exit 1
          case "$raw" in
            postgresql+psycopg://*) db="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) db="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) db="$raw" ;;
            *) exit 1 ;;
          esac
          echo "::add-mask::$db"
          result="$(psql "$db" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT string_agg(role_key || '=' || assignment_count, ',' ORDER BY role_key)
            FROM (
              SELECT r.role_key,count(*)::text AS assignment_count
              FROM security.user_role_assignments ura
              JOIN security.roles r ON r.tenant_id=ura.tenant_id AND r.role_id=ura.role_id
              WHERE ura.status='ACTIVE' AND r.status='ACTIVE'
                AND r.role_key NOT IN ('PC','TL','PM','CRM','Executive')
              GROUP BY r.role_key
            ) q;
          ")"
          [ -n "$result" ] || result='none'
          echo "UNMAPPED_ROLE_KEYS=$result"
          post success "$result"
          trap - ERR
