name: Deploy Security DEV

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SECURITY_SERVICE: security
      DEV_TENANT_ID: dev-auth-test
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out tested Security revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify Security Railway target
        shell: bash
        run: |
          set -euo pipefail
          railway status --json >/tmp/status.json
          railway service list --json >/tmp/services.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          project=json.loads(Path('/tmp/status.json').read_text())
          services=json.loads(Path('/tmp/services.json').read_text())
          if project.get('id') != os.environ['PLATFORM_PROJECT_ID']:
              raise SystemExit('RAILWAY_TOKEN does not target the approved shared DEV project')
          if not any(row.get('name') == os.environ['SECURITY_SERVICE'] for row in services):
              raise SystemExit('Security Railway service is missing from the approved shared DEV project')
          print('SECURITY_RAILWAY_TARGET=PASS')
          PY

      - name: Validate persisted Security configuration
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/security-vars.json').read_text())
          if not (data.get('SECURITY_PRIVATE_KEY_PEM') or data.get('SECURITY_JWT_PRIVATE_KEY_PEM')):
              raise SystemExit('Security signing key is missing; refusing implicit key generation or rotation')
          if not data.get('SECURITY_ROLE_DATABASE_URL'):
              raise SystemExit('Security private database configuration is missing')
          print('SECURITY_PERSISTED_CONFIG=PASS')
          PY

      - name: Prepare Security private pre-deploy migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/platform_predeploy.py <<'PY'
          import os
          from pathlib import Path
          import psycopg
          from verigence_security.auth_store import PostgresAuthStore
          from verigence_security.role_templates import PostgresRoleTemplateStore, RoleTemplateService
          from verigence_security.settings import normalize_database_url

          db = normalize_database_url(os.environ['SECURITY_ROLE_DATABASE_URL'])
          with psycopg.connect(db) as conn, conn.cursor() as cur:
              for path in sorted(Path('database').glob('*.sql')):
                  cur.execute(path.read_text(encoding='utf-8'))
              conn.commit()
          roles = RoleTemplateService(PostgresRoleTemplateStore(db))
          roles.seed_platform_defaults()
          roles.seed_tenant(
              tenant_id=os.environ['DEV_TENANT_ID'],
              actor_sub='SECURITY_DEPLOY',
              correlation_id=None,
              replace=False,
          )
          PostgresAuthStore(db).ensure_tenant(os.environ['DEV_TENANT_ID'])
          print('SECURITY_PRIVATE_MIGRATION=PASS', flush=True)
          PY
          cat > railway.toml <<'TOML'
          [build]
          builder = "RAILPACK"

          [deploy]
          preDeployCommand = ["PYTHONPATH=src python scripts/platform_predeploy.py"]
          startCommand = "PYTHONPATH=src uvicorn verigence_security.app:create_app --factory --host 0.0.0.0 --port $PORT"
          healthcheckPath = "/health"
          healthcheckTimeout = 100
          restartPolicyType = "ON_FAILURE"
          restartPolicyMaxRetries = 3
          TOML

      - name: Deploy Security only
        shell: bash
        run: |
          set -euo pipefail
          railway up . --path-as-root --service "$SECURITY_SERVICE" --detach --yes \
            --message "Security DEV ${DEPLOY_SHA}" >/dev/null

      - name: Verify Security deployment and migration
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            railway deployment list --service "$SECURITY_SERVICE" --limit 1 --json >/tmp/security-deployment.json
            status="$(python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/security-deployment.json').read_text())
          print(rows[0].get('status','') if rows else '')
          PY
          )"
            case "$status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED)
                railway logs --service "$SECURITY_SERVICE" --latest --deployment --lines 220 || true
                echo "Security deployment failed: $status" >&2
                exit 1
                ;;
            esac
            if [[ "$attempt" == "10" ]]; then
              railway logs --service "$SECURITY_SERVICE" --latest --deployment --lines 220 || true
              echo "Security deployment did not reach SUCCESS: $status" >&2
              exit 1
            fi
            sleep 15
          done
          railway logs --service "$SECURITY_SERVICE" --latest --deployment --lines 220 >/tmp/security.log || true
          grep -q 'SECURITY_PRIVATE_MIGRATION=PASS' /tmp/security.log || {
            echo 'Security private migration marker missing' >&2
            tail -n 160 /tmp/security.log >&2
            exit 1
          }
          echo 'SECURITY_DEPLOYMENT=PASS'
          echo 'SECURITY_PRIVATE_MIGRATION=PASS'

      - name: Smoke test Security health and JWKS when public domain exists
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$SECURITY_SERVICE" --json >/tmp/security-vars.json
          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/security-vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          if [[ -z "$domain" ]]; then
            echo 'SECURITY_PUBLIC_SMOKE=SKIPPED|no public domain configured'
            exit 0
          fi
          case "$domain" in
            http://*|https://*) base="${domain%/}" ;;
            *) base="https://${domain%/}" ;;
          esac
          curl --fail --silent --show-error "$base/health" >/tmp/security-health.json
          curl --fail --silent --show-error "$base/.well-known/jwks.json" >/tmp/security-jwks.json
          echo 'SECURITY_PUBLIC_SMOKE=PASS'
