name: Security v2 DEV RBAC Reset

on:
  push:
    branches: [dev]
    paths: [.github/workflows/security-v2-dev-rbac-reset.yml]

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  reset-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Reset legacy DEV RBAC and seed canonical v2 bundles
        shell: bash
        run: |
          set -Eeuo pipefail
          target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$1" -f context=security-v2-dev-rbac-reset \
              -f description="$2" -f target_url="$target" >/dev/null
          }
          trap 'post failure "DEV RBAC reset failed closed"' ERR
          post pending 'Resetting DEV RBAC to canonical Security v2 roles'

          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || { echo 'MIGRATION_DATABASE_URL is not configured'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) db="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) db="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) db="$raw" ;;
            *) echo 'MIGRATION_DATABASE_URL is not PostgreSQL'; exit 1 ;;
          esac
          echo "::add-mask::$db"

          precheck="$(psql "$db" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT
              (SELECT count(*) FROM security.role_definitions
               WHERE status='ACTIVE' AND role_key IN
               ('PC','TL','PM','CRM','Executive','TenantAdmin','ModuleAdmin','SuperAdmin','TestUser')),
              (SELECT count(*) FROM security.platform_role_permission_defaults d
               JOIN security.permissions p ON p.permission_key=d.permission_key
               WHERE d.status='ACTIVE' AND p.status='ACTIVE'
                 AND d.role_key IN ('PC','TL','PM','CRM','Executive')),
              (SELECT count(*) FROM security.user_admin_role_assignments
               WHERE role_key='SuperAdmin' AND scope_type='PLATFORM'
                 AND scope_id IS NULL AND status='ACTIVE');
          ")"
          [ "$precheck" = '9|156|1' ] || {
            echo "Unexpected v2 foundation state: $precheck"
            exit 1
          }

          psql "$db" -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;

          -- DEV has no legacy production users to preserve. Retire the old authorization
          -- assignments instead of guessing mappings into v2.
          DELETE FROM security.group_role_assignments;
          DELETE FROM security.user_role_assignments;

          -- Canonical Phase-1 Tenant bundles are derived only from the approved v2 defaults.
          DELETE FROM security.tenant_role_permissions
          WHERE role_key IN ('PC','TL','PM','CRM','Executive');

          INSERT INTO security.tenant_role_permissions
            (tenant_id,role_key,permission_key,assigned_by_user_id,assigned_at_utc)
          SELECT t.tenant_id,d.role_key,d.permission_key,sa.user_id,CURRENT_TIMESTAMP
          FROM security.tenants t
          CROSS JOIN LATERAL (
            SELECT user_id
            FROM security.user_admin_role_assignments
            WHERE role_key='SuperAdmin'
              AND scope_type='PLATFORM'
              AND scope_id IS NULL
              AND status='ACTIVE'
            LIMIT 1
          ) sa
          JOIN security.platform_role_permission_defaults d
            ON d.status='ACTIVE'
           AND d.role_key IN ('PC','TL','PM','CRM','Executive')
          JOIN security.permissions p
            ON p.permission_key=d.permission_key AND p.status='ACTIVE'
          ON CONFLICT (tenant_id,role_key,permission_key) DO NOTHING;

          COMMIT;
          SQL

          verification="$(psql "$db" -X -v ON_ERROR_STOP=1 -Atc "
            WITH expected AS (
              SELECT t.tenant_id,d.role_key,d.permission_key
              FROM security.tenants t
              JOIN security.platform_role_permission_defaults d
                ON d.status='ACTIVE'
               AND d.role_key IN ('PC','TL','PM','CRM','Executive')
              JOIN security.permissions p
                ON p.permission_key=d.permission_key AND p.status='ACTIVE'
            ), diff AS (
              (SELECT tenant_id,role_key,permission_key FROM expected
               EXCEPT
               SELECT tenant_id,role_key,permission_key
               FROM security.tenant_role_permissions
               WHERE role_key IN ('PC','TL','PM','CRM','Executive'))
              UNION ALL
              (SELECT tenant_id,role_key,permission_key
               FROM security.tenant_role_permissions
               WHERE role_key IN ('PC','TL','PM','CRM','Executive')
               EXCEPT
               SELECT tenant_id,role_key,permission_key FROM expected)
            )
            SELECT
              (SELECT count(*) FROM security.user_role_assignments) || '|' ||
              (SELECT count(*) FROM security.group_role_assignments) || '|' ||
              (SELECT count(*) FROM diff) || '|' ||
              (SELECT count(*) FROM security.user_admin_role_assignments
               WHERE role_key='SuperAdmin' AND scope_type='PLATFORM'
                 AND scope_id IS NULL AND status='ACTIVE');
          ")"
          [ "$verification" = '0|0|0|1' ] || {
            echo "DEV RBAC reset verification failed: $verification"
            exit 1
          }

          post success 'Legacy RBAC cleared; canonical v2 Tenant bundles verified'
          trap - ERR

      - name: Dispatch canonical Security DEV deploy and readiness verification
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref dev \
            -f operation=deploy-dev \
            -f tenant_code=test-project \
            -f tenant_name=TestProject \
            -f tenant_id=9de3af49-260f-4b15-8263-07c93dcc04d2 \
            -f activate_after_create=true

          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch dev --event workflow_dispatch --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha == env.GITHUB_SHA) | .databaseId' | head -n1)"
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo 'Could not resolve canonical deploy run'; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Publish final status
        if: success()
        run: |
          run_id='${{ steps.deploy.outputs.run_id }}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=security-v2-dev-ready \
            -f description='Security DEV is deployed with canonical v2 RBAC and readiness checks passed' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null
