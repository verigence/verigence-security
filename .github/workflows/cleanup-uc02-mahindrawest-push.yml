name: Run guarded UC02 MahindraWest tenant cleanup

on:
  push:
    branches: [cleanup/uc02-mahindrawest-duplicates]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/cleanup/uc02-mahindrawest-duplicates'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/uc02-mahindrawest-duplicates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Hard-delete exactly six guarded duplicate tenants
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${MIGRATION_DATABASE_URL:-}" ] || { echo 'MIGRATION_DATABASE_URL is not configured'; exit 1; }
          python - <<'PY'
          import os
          from uuid import uuid4
          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session
          from verigence_security.services.platform_admin import PlatformTenantService

          raw=os.environ['MIGRATION_DATABASE_URL']
          if raw.startswith('postgresql+psycopg://') or raw.startswith('postgresql+asyncpg://'):
              raw='postgresql://' + raw.split('://',1)[1]
          engine=create_engine(raw)
          with Session(engine) as session:
              targets=session.execute(text("SELECT tenant_id,status FROM security.tenants WHERE tenant_name=:n ORDER BY created_at_utc,tenant_id"), {'n':'MahindraWest'}).mappings().all()
              if len(targets)!=6:
                  raise SystemExit(f'guard: expected 6 MahindraWest tenants, found {len(targets)}')
              if any(str(r['status'])!='CONFIGURING' for r in targets):
                  raise SystemExit('guard: all six targets must be CONFIGURING')
              actors={}
              for r in targets:
                  tid=str(r['tenant_id'])
                  actor=session.execute(text("SELECT actor_user_id FROM security.admin_changes WHERE operation_key='platform.tenant.create' AND resource_type='tenant' AND resource_id=:tid AND outcome='SUCCESS' ORDER BY occurred_at_utc DESC LIMIT 1"), {'tid':tid}).scalar_one_or_none()
                  if actor is None:
                      raise SystemExit('guard: target missing successful create audit actor')
                  actors[tid]=str(actor)
              for r in targets:
                  tid=str(r['tenant_id'])
                  result=PlatformTenantService(session).hard_delete_tenant(actor_user_id=actors[tid], tenant_id=tid, correlation_id=f'uc02-duplicate-cleanup-{uuid4()}')
                  if result is None:
                      raise SystemExit('supported hard-delete returned not-found')
              remaining=int(session.execute(text("SELECT count(*) FROM security.tenants WHERE tenant_name=:n"), {'n':'MahindraWest'}).scalar_one())
              if remaining!=0:
                  raise SystemExit(f'verification: {remaining} MahindraWest tenants remain')
          engine.dispose()
          print('SECURITY_UC02_DUPLICATE_TENANTS_DELETED=6')
          print('SECURITY_UC02_DUPLICATE_TENANTS_REMAINING=0')
          PY
      - name: Record successful cleanup and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cleanup-uc02-mahindrawest-duplicates.yml .github/workflows/cleanup-uc02-mahindrawest-push.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(dev): completed guarded cleanup of 6 MahindraWest tenants'
          git push origin HEAD:cleanup/uc02-mahindrawest-duplicates
