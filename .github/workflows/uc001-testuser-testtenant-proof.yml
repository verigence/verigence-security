name: UC-001 TestUser TestTenant Proof

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-testuser-testtenant-proof.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  TESTUSER_EMAIL: gigsinopensource@gmail.com
  TESTUSER_CLERK_ID: user_3I7HFuZZiFC9K2muiweXFRoeoud
  TESTUSER_SECURITY_ID: 018a40c1-f946-dc4c-4a52-0766b59ccf2d

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi

      - name: Inspect TestUser and TestTenant state
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || { echo '::error::MIGRATION_DATABASE_URL missing'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) db="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) db="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) db="$raw" ;;
            *) echo '::error::Unsupported database URL'; exit 1 ;;
          esac
          echo "::add-mask::$db"

          psql "$db" -X -v ON_ERROR_STOP=1 -At -F '|' -v email="$TESTUSER_EMAIL" -v clerk="$TESTUSER_CLERK_ID" -v uid="$TESTUSER_SECURITY_ID" <<'SQL' >/tmp/testuser.txt
          SELECT u.user_id,u.primary_email,u.status,p.status,e.provider_subject,e.status
          FROM security.users u
          JOIN security.security_principals p ON p.principal_id=u.user_id
          JOIN security.external_identities e ON e.user_id=u.user_id AND e.provider='CLERK'
          WHERE u.user_id=:'uid'::uuid
            AND lower(u.primary_email)=lower(:'email')
            AND e.provider_subject=:'clerk';
          SQL
          [ "$(wc -l </tmp/testuser.txt | tr -d ' ')" = 1 ] || { echo '::error::Canonical TestUser row not found exactly once'; exit 1; }
          IFS='|' read -r user_id email user_status principal_status clerk_id identity_status </tmp/testuser.txt
          {
            echo "TESTUSER_STATUS=$user_status"
            echo "TESTUSER_PRINCIPAL_STATUS=$principal_status"
            echo "TESTUSER_IDENTITY_STATUS=$identity_status"
          } >> "$GITHUB_ENV"

          psql "$db" -X -v ON_ERROR_STOP=1 -At -F '|' -v uid="$TESTUSER_SECURITY_ID" <<'SQL' >/tmp/binding.txt
          SELECT pti.tenant_id,pti.status,t.tenant_code,t.tenant_name,t.status
          FROM security.phase1_test_identity pti
          JOIN security.tenants t ON t.tenant_id=pti.tenant_id
          WHERE pti.singleton_id=1 AND pti.user_id=:'uid'::uuid;
          SQL
          if [ -s /tmp/binding.txt ]; then
            IFS='|' read -r bound_tenant_id binding_status bound_tenant_code bound_tenant_name bound_tenant_status </tmp/binding.txt
          else
            bound_tenant_id='NONE'; binding_status='MISSING'; bound_tenant_code='NONE'; bound_tenant_name='NONE'; bound_tenant_status='NONE'
          fi

          psql "$db" -X -v ON_ERROR_STOP=1 -At -F '|' -v uid="$TESTUSER_SECURITY_ID" <<'SQL' >/tmp/memberships.txt
          SELECT t.tenant_id,t.tenant_code,t.tenant_name,t.status,m.status
          FROM security.tenant_memberships m
          JOIN security.tenants t ON t.tenant_id=m.tenant_id
          WHERE m.user_id=:'uid'::uuid
          ORDER BY m.updated_at_utc DESC;
          SQL
          membership_count="$(wc -l </tmp/memberships.txt | tr -d ' ')"
          membership_summary="$(tr '\n' ';' </tmp/memberships.txt | sed 's/;*$//')"
          [ -n "$membership_summary" ] || membership_summary='NONE'

          psql "$db" -X -v ON_ERROR_STOP=1 -At -F '|' <<'SQL' >/tmp/testtenants.txt
          SELECT tenant_id,tenant_code,tenant_name,status
          FROM security.tenants
          WHERE lower(tenant_code) LIKE '%test%'
             OR lower(tenant_name) LIKE '%test%'
          ORDER BY created_at_utc;
          SQL
          candidate_count="$(wc -l </tmp/testtenants.txt | tr -d ' ')"
          candidate_summary="$(tr '\n' ';' </tmp/testtenants.txt | sed 's/;*$//')"
          [ -n "$candidate_summary" ] || candidate_summary='NONE'

          psql "$db" -X -v ON_ERROR_STOP=1 -At -F '|' <<'SQL' >/tmp/singleton.txt
          SELECT pti.user_id,pti.tenant_id,pti.status,t.tenant_code,t.tenant_name,t.status
          FROM security.phase1_test_identity pti
          JOIN security.tenants t ON t.tenant_id=pti.tenant_id
          WHERE pti.singleton_id=1;
          SQL
          singleton_summary="$(tr '\n' ';' </tmp/singleton.txt | sed 's/;*$//')"
          [ -n "$singleton_summary" ] || singleton_summary='NONE'

          test_role_status="$(psql "$db" -X -v ON_ERROR_STOP=1 -At -c "SELECT status FROM security.role_definitions WHERE role_key='TestUser';")"
          upload_permission_status="$(psql "$db" -X -v ON_ERROR_STOP=1 -At -c "SELECT status FROM security.permissions WHERE permission_key='di.document.upload';")"

          {
            echo "TEST_BINDING_STATUS=$binding_status"
            echo "BOUND_TENANT_ID=$bound_tenant_id"
            echo "BOUND_TENANT_CODE=$bound_tenant_code"
            echo "BOUND_TENANT_NAME=$bound_tenant_name"
            echo "BOUND_TENANT_STATUS=$bound_tenant_status"
            echo "MEMBERSHIP_COUNT=$membership_count"
            echo "MEMBERSHIP_SUMMARY=$membership_summary"
            echo "TESTTENANT_CANDIDATE_COUNT=$candidate_count"
            echo "TESTTENANT_CANDIDATES=$candidate_summary"
            echo "PHASE1_SINGLETON=$singleton_summary"
            echo "TEST_ROLE_STATUS=${test_role_status:-MISSING}"
            echo "UPLOAD_PERMISSION_STATUS=${upload_permission_status:-MISSING}"
          } >> "$GITHUB_ENV"

      - name: Record proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/UC001_TESTUSER_TESTTENANT_PROOF.md <<EOF
          # UC-001 TestUser / TestTenant DB Proof

          - run_id: $GITHUB_RUN_ID
          - source_sha: $GITHUB_SHA
          - testuser_email: $TESTUSER_EMAIL
          - testuser_clerk_subject: $TESTUSER_CLERK_ID
          - testuser_security_user_id: $TESTUSER_SECURITY_ID
          - testuser_status: ${TESTUSER_STATUS:-not_reached}
          - testuser_principal_status: ${TESTUSER_PRINCIPAL_STATUS:-not_reached}
          - testuser_external_identity_status: ${TESTUSER_IDENTITY_STATUS:-not_reached}
          - phase1_test_binding_status: ${TEST_BINDING_STATUS:-not_reached}
          - bound_testtenant_id: ${BOUND_TENANT_ID:-not_reached}
          - bound_testtenant_code: ${BOUND_TENANT_CODE:-not_reached}
          - bound_testtenant_name: ${BOUND_TENANT_NAME:-not_reached}
          - bound_testtenant_status: ${BOUND_TENANT_STATUS:-not_reached}
          - tenant_membership_count: ${MEMBERSHIP_COUNT:-not_reached}
          - tenant_memberships: ${MEMBERSHIP_SUMMARY:-not_reached}
          - testtenant_candidate_count: ${TESTTENANT_CANDIDATE_COUNT:-not_reached}
          - testtenant_candidates: ${TESTTENANT_CANDIDATES:-not_reached}
          - phase1_singleton_row: ${PHASE1_SINGLETON:-not_reached}
          - TestUser_role_definition: ${TEST_ROLE_STATUS:-not_reached}
          - di.document.upload_permission_catalog_status: ${UPLOAD_PERMISSION_STATUS:-not_reached}
          - job_status: ${{ job.status }}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/UC001_TESTUSER_TESTTENANT_PROOF.md
          git commit -m 'docs(dev): record TestUser/TestTenant proof [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
