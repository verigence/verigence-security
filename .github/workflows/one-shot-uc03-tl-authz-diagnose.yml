name: One-shot diagnose UC03 TL Security authorization

on:
  push:
    branches: [diagnose/uc03-tl-authz-20260828]
    paths:
      - '.github/workflows/one-shot-uc03-tl-authz-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      SERVICE: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: |
          pip install -e .
          npm install --global @railway/cli
      - name: Inspect active TL effective authorization state
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "$PLATFORM_PROJECT_ID" --environment dev --service "$SERVICE" --json >/dev/null
          railway variable list --service "$SERVICE" --environment dev --json >/tmp/security-vars.json
          python - <<'PY'
          import json
          from pathlib import Path

          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session
          from verigence_security.repositories.v2_authorization_repository import V2AuthorizationRepository
          from verigence_security.services.v2_authorization import HumanAuthorizationResolver

          variables = json.loads(Path('/tmp/security-vars.json').read_text())
          database_url = str(variables.get('DATABASE_URL') or '')
          if not database_url:
              raise SystemExit('DATABASE_URL unavailable')

          engine = create_engine(database_url)
          with Session(engine) as session:
              rows = session.execute(text('''
                  SELECT otr.user_id, otr.tenant_id
                  FROM security.user_tenant_operating_roles otr
                  JOIN security.tenants t ON t.tenant_id=otr.tenant_id
                  WHERE otr.role_key='TL'
                    AND otr.status='ACTIVE'
                    AND t.status='ACTIVE'
                    AND (otr.valid_from_utc IS NULL OR otr.valid_from_utc<=CURRENT_TIMESTAMP)
                    AND (otr.valid_to_utc IS NULL OR otr.valid_to_utc>CURRENT_TIMESTAMP)
                  ORDER BY otr.tenant_id, otr.user_id
              ''')).all()
              print('ACTIVE_TL_OPERATING_ROLES=' + str(len(rows)))
              resolver = HumanAuthorizationResolver(V2AuthorizationRepository(session))
              for i,(user_id,tenant_id) in enumerate(rows,1):
                  has_tenant_permission = bool(session.execute(text('''
                      SELECT EXISTS(
                        SELECT 1 FROM security.tenant_role_permissions
                        WHERE tenant_id=:tenant_id AND role_key='TL' AND permission_key='audit.journey.read'
                      )
                  '''), {'tenant_id': tenant_id}).scalar_one())
                  has_default = bool(session.execute(text('''
                      SELECT EXISTS(
                        SELECT 1 FROM security.platform_role_permission_defaults
                        WHERE role_key='TL' AND permission_key='audit.journey.read' AND status='ACTIVE'
                      )
                  ''')).scalar_one())
                  admins = session.execute(text('''
                      SELECT role_key,scope_type
                      FROM security.user_admin_role_assignments
                      WHERE user_id=:user_id AND status='ACTIVE'
                      ORDER BY role_key,scope_type
                  '''), {'user_id': user_id}).all()
                  state = session.execute(text('''
                      SELECT u.status,p.status,e.status
                      FROM security.users u
                      JOIN security.security_principals p ON p.principal_id=u.user_id
                      JOIN security.external_identities e ON e.user_id=u.user_id AND e.provider='CLERK'
                      WHERE u.user_id=:user_id
                  '''), {'user_id': user_id}).first()
                  test_identity = session.execute(text('''
                      SELECT tenant_id
                      FROM security.phase1_test_identity
                      WHERE singleton_id=1 AND user_id=:user_id AND status='ACTIVE'
                  '''), {'user_id': user_id}).scalar_one_or_none()
                  decision = resolver.check(
                      user_id=str(user_id),
                      tenant_id=str(tenant_id),
                      permission_key='audit.journey.read',
                  )
                  print(f'TL_{i}_TENANT_PERMISSION_AUDIT_JOURNEY_READ={has_tenant_permission}')
                  print(f'TL_{i}_PLATFORM_DEFAULT_AUDIT_JOURNEY_READ={has_default}')
                  print(f'TL_{i}_ADMIN_ASSIGNMENT_COUNT={len(admins)}')
                  print(f'TL_{i}_ADMIN_ASSIGNMENT_KINDS=' + (','.join(f'{r}:{s}' for r,s in admins) if admins else 'NONE'))
                  print(f'TL_{i}_IDENTITY_STATES=' + ('/'.join(str(x) for x in state) if state else 'MISSING'))
                  print(f'TL_{i}_TEST_IDENTITY_ACTIVE={test_identity is not None}')
                  print(f'TL_{i}_TEST_IDENTITY_MATCHES_TENANT={test_identity is not None and str(test_identity)==str(tenant_id)}')
                  print(f'TL_{i}_RESOLVER_ALLOWED={decision.allowed}')
                  print(f'TL_{i}_RESOLVER_REASON={decision.reason_code}')
                  print(f'TL_{i}_RESOLVER_CLASSIFICATION={decision.classification}')
                  print(f'TL_{i}_RESOLVER_ROLE={decision.role_key}')
          PY
