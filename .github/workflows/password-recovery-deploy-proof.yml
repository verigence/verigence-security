name: Password Recovery DEV Deploy Proof

on:
  push:
    branches: [dev]
    paths:
      - migrations/0023_password_recovery.sql
      - src/verigence_security/adapters/clerk_password_recovery.py
      - src/verigence_security/services/password_recovery.py
      - src/verigence_security/api/routes/password_recovery.py
      - src/verigence_security/main.py
      - tests/unit/test_password_recovery_clerk.py
      - .github/workflows/password-recovery-deploy-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-password-recovery-dev
  cancel-in-progress: false

env:
  PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
  PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
  SECURITY_SERVICE: security
  SECURITY_PUBLIC_URL: https://security-dev.up.railway.app
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  validate-migrate-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Install validation and deployment tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          npm install --global @railway/cli

      - name: Validate password recovery increment
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests/unit/test_password_recovery_clerk.py
          ruff check \
            src/verigence_security/adapters/clerk_password_recovery.py \
            src/verigence_security/services/password_recovery.py \
            src/verigence_security/api/routes/password_recovery.py \
            src/verigence_security/main.py \
            tests/unit/test_password_recovery_clerk.py
          mypy \
            src/verigence_security/adapters/clerk_password_recovery.py \
            src/verigence_security/services/password_recovery.py \
            src/verigence_security/api/routes/password_recovery.py
          pytest -q tests/unit/test_password_recovery_clerk.py

      - name: Apply password recovery migration
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || { echo '::error::MIGRATION_DATABASE_URL missing'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) database_url="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) database_url="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) database_url="$raw" ;;
            *) echo '::error::Unsupported database URL'; exit 1 ;;
          esac
          echo "::add-mask::$database_url"
          psql "$database_url" -X -v ON_ERROR_STOP=1 -f migrations/0023_password_recovery.sql
          ready="$(psql "$database_url" -X -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('security.password_reset_attempts') IS NOT NULL;")"
          [ "$ready" = "t" ] || { echo '::error::Password recovery table missing'; exit 1; }

      - name: Resolve Railway service and previous deployment
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN missing'; exit 1; }
          [ -n "${RAILWAY_TOKEN:-}" ] || { echo '::error::RAILWAY_TOKEN missing'; exit 1; }
          env -u RAILWAY_TOKEN railway link \
            --project "$PLATFORM_PROJECT_ID" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/railway-link.json
          env -u RAILWAY_TOKEN railway service list --json >/tmp/services.json
          service_id="$(jq -r --arg service "$SECURITY_SERVICE" '[.[] | select(.name==$service)] | first | .id // empty' /tmp/services.json)"
          [ -n "$service_id" ] || { echo '::error::Security Railway service not found'; exit 1; }
          echo "RAILWAY_SERVICE_ID=$service_id" >> "$GITHUB_ENV"

          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' \
            --data "$body" 'https://backboard.railway.com/graphql/v2')"
          previous="$(printf '%s' "$response" | jq -r --arg service "$service_id" '[.data.environment.serviceInstances.edges[].node | select(.serviceId==$service)] | first | .latestDeployment.id // empty')"
          echo "PREVIOUS_DEPLOYMENT_ID=$previous" >> "$GITHUB_ENV"

      - name: Deploy current DEV source
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway up \
            --service "$SECURITY_SERVICE" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --detach

      - name: Wait for successful deployment
        shell: bash
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error -X POST \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' \
              --data "$body" 'https://backboard.railway.com/graphql/v2')"
            node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" '[.data.environment.serviceInstances.edges[].node | select(.serviceId==$service)] | first // {}')"
            deployment_id="$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')"
            deployment_status="$(printf '%s' "$node" | jq -r '.latestDeployment.status // empty')"
            if [ -z "$deployment_id" ] || [ "$deployment_id" = "${PREVIOUS_DEPLOYMENT_ID:-}" ]; then
              sleep 5
              continue
            fi
            echo "Password recovery Security deployment $deployment_id status=$deployment_status"
            case "$deployment_status" in
              SUCCESS) exit 0 ;;
              FAILED|CRASHED|REMOVED|SKIPPED) exit 1 ;;
              *) sleep 5 ;;
            esac
          done
          echo '::error::Timed out waiting for Security deployment'
          exit 1

      - name: Verify Security readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' "$SECURITY_PUBLIC_URL/health/ready" || true)"
            if [ "$code" = 200 ]; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 5
          done
          echo '::error::Security readiness check failed'
          exit 1
