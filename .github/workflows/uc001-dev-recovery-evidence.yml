name: Record UC-001 DEV Recovery Result

on:
  workflow_run:
    workflows:
      - UC-001 DEV Recovery Deploy
    types:
      - completed
    branches:
      - dev

permissions:
  contents: write

jobs:
  record:
    name: Record recovery conclusion
    runs-on: ubuntu-24.04
    steps:
      - name: Check out DEV
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Write recovery evidence
        shell: bash
        env:
          RECOVERY_RUN_ID: ${{ github.event.workflow_run.id }}
          RECOVERY_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RECOVERY_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RECOVERY_SHA: ${{ github.event.workflow_run.head_sha }}
          RECOVERY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RECOVERY_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/UC001_DEV_RECOVERY_LATEST.md <<EOF
          # UC-001 DEV Recovery — Latest Run

          - run_id: ${RECOVERY_RUN_ID}
          - run_number: ${RECOVERY_RUN_NUMBER}
          - run_attempt: ${RECOVERY_ATTEMPT}
          - source_sha: ${RECOVERY_SHA}
          - conclusion: ${RECOVERY_CONCLUSION}
          - workflow_url: ${RECOVERY_URL}
          EOF

      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/deploy-evidence/UC001_DEV_RECOVERY_LATEST.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(dev): record UC-001 recovery result [skip ci]'
          git pull --rebase origin dev
          git push origin HEAD:dev
