name: UC-001 TestUser TestTenant Reconcile

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-testuser-testtenant-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  TESTUSER_EMAIL: gigsinopensource@gmail.com
  TESTUSER_CLERK_ID: user_3I7HFuZZiFC9K2muiweXFRoeoud
  TESTUSER_SECURITY_ID: 018a40c1-f946-dc4c-4a52-0766b59ccf2d
  TESTTENANT_ID: 9de3af49-260f-4b15-8263-07c93dcc04d2
  TESTTENANT_CODE: test-project
  TESTTENANT_NAME: TestProject
  SUPERADMIN_CLERK_ID: user_3I7FdD5Pkmydsp23OfjH9hBMxpN

jobs:
  reconcile-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Install database and runtime tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Resolve and validate canonical DEV identities
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || { echo '::error::MIGRATION_DATABASE_URL missing'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) psql_db="postgresql://${raw#postgresql+psycopg://}"; py_db="$raw" ;;
            postgresql+asyncpg://*) psql_db="postgresql://${raw#postgresql+asyncpg://}"; py_db="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) psql_db="$raw"; py_db="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) psql_db="$raw"; py_db="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::Unsupported database URL'; exit 1 ;;
          esac
          echo "::add-mask::$psql_db"
          echo "::add-mask::$py_db"
          echo "PSQL_DB=$psql_db" >> "$GITHUB_ENV"
          echo "PY_DB=$py_db" >> "$GITHUB_ENV"

          testuser="$(psql "$psql_db" -X -v ON_ERROR_STOP=1 -At -F '|' -v uid="$TESTUSER_SECURITY_ID" -v email="$TESTUSER_EMAIL" -v clerk="$TESTUSER_CLERK_ID" -c "
            SELECT u.status,p.status,e.status
            FROM security.users u
            JOIN security.security_principals p ON p.principal_id=u.user_id
            JOIN security.external_identities e ON e.user_id=u.user_id AND e.provider='CLERK'
            WHERE u.user_id=:'uid'::uuid
              AND lower(u.primary_email)=lower(:'email')
              AND e.provider_subject=:'clerk';")"
          [ "$testuser" = 'ACTIVE|ACTIVE|ACTIVE' ] || { echo "::error::Canonical TestUser not fully ACTIVE: $testuser"; exit 1; }

          testtenant="$(psql "$psql_db" -X -v ON_ERROR_STOP=1 -At -F '|' -v tid="$TESTTENANT_ID" -v code="$TESTTENANT_CODE" -v name="$TESTTENANT_NAME" -c "
            SELECT tenant_code,tenant_name,status
            FROM security.tenants
            WHERE tenant_id=:'tid'::uuid AND tenant_code=:'code' AND tenant_name=:'name';")"
          [ "$testtenant" = "$TESTTENANT_CODE|$TESTTENANT_NAME|ACTIVE" ] || { echo "::error::Canonical TestTenant mismatch: $testtenant"; exit 1; }

          superadmin_user_id="$(psql "$psql_db" -X -v ON_ERROR_STOP=1 -At -v clerk="$SUPERADMIN_CLERK_ID" -c "
            SELECT u.user_id
            FROM security.users u
            JOIN security.external_identities e ON e.user_id=u.user_id AND e.provider='CLERK'
            JOIN security.user_admin_role_assignments a ON a.user_id=u.user_id
            WHERE e.provider_subject=:'clerk'
              AND e.status='ACTIVE' AND u.status='ACTIVE'
              AND a.role_key='SuperAdmin' AND a.scope_type='PLATFORM'
              AND a.scope_id IS NULL AND a.status='ACTIVE'
            LIMIT 1;")"
          [ -n "$superadmin_user_id" ] || { echo '::error::Canonical active SuperAdmin not found'; exit 1; }
          echo "SUPERADMIN_SECURITY_ID=$superadmin_user_id" >> "$GITHUB_ENV"

          pc_default="$(psql "$psql_db" -X -v ON_ERROR_STOP=1 -At -c "
            SELECT count(*)
            FROM security.platform_role_permission_defaults d
            JOIN security.permissions p ON p.permission_key=d.permission_key
            WHERE d.role_key='PC' AND d.permission_key='di.document.upload'
              AND d.status='ACTIVE' AND p.status='ACTIVE';")"
          [ "$pc_default" = 1 ] || { echo '::error::PC default does not include active di.document.upload'; exit 1; }
          echo 'PREFLIGHT=PASS' >> "$GITHUB_ENV"

      - name: Restore TestUser TestTenant canonical binding
        shell: bash
        run: |
          set -euo pipefail
          psql "$PSQL_DB" -X -v ON_ERROR_STOP=1 \
            -v uid="$TESTUSER_SECURITY_ID" \
            -v tid="$TESTTENANT_ID" \
            -v admin="$SUPERADMIN_SECURITY_ID" <<'SQL'
          BEGIN;

          INSERT INTO security.phase1_test_identity
            (singleton_id,user_id,tenant_id,status,created_at_utc)
          VALUES
            (1, :'uid'::uuid, :'tid'::uuid, 'ACTIVE', CURRENT_TIMESTAMP)
          ON CONFLICT (singleton_id) DO UPDATE
          SET user_id=EXCLUDED.user_id,
              tenant_id=EXCLUDED.tenant_id,
              status='ACTIVE';

          INSERT INTO security.tenant_memberships
            (membership_id,tenant_id,user_id,employee_code,status,valid_from_utc,valid_to_utc,
             authorization_version,created_at_utc,updated_at_utc)
          VALUES
            (md5('uc001-canonical-testuser-testtenant-membership')::uuid,
             :'tid'::uuid, :'uid'::uuid, 'TESTUSER', 'ACTIVE', CURRENT_TIMESTAMP, NULL,
             1, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)
          ON CONFLICT (tenant_id,user_id) DO UPDATE
          SET status='ACTIVE',
              valid_from_utc=COALESCE(security.tenant_memberships.valid_from_utc,CURRENT_TIMESTAMP),
              valid_to_utc=NULL,
              authorization_version=security.tenant_memberships.authorization_version + 1,
              updated_at_utc=CURRENT_TIMESTAMP;

          INSERT INTO security.tenant_role_permissions
            (tenant_id,role_key,permission_key,assigned_by_user_id,assigned_at_utc)
          SELECT :'tid'::uuid,'PC','di.document.upload',:'admin'::uuid,CURRENT_TIMESTAMP
          WHERE EXISTS (
            SELECT 1
            FROM security.platform_role_permission_defaults d
            JOIN security.permissions p ON p.permission_key=d.permission_key
            WHERE d.role_key='PC'
              AND d.permission_key='di.document.upload'
              AND d.status='ACTIVE'
              AND p.status='ACTIVE'
          )
          ON CONFLICT (tenant_id,role_key,permission_key) DO NOTHING;

          COMMIT;
          SQL
          echo 'RECONCILE=PASS' >> "$GITHUB_ENV"

      - name: Prove database state and runtime upload authorization
        shell: bash
        run: |
          set -euo pipefail
          binding="$(psql "$PSQL_DB" -X -v ON_ERROR_STOP=1 -At -F '|' -v uid="$TESTUSER_SECURITY_ID" -v tid="$TESTTENANT_ID" -c "
            SELECT pti.status,t.status
            FROM security.phase1_test_identity pti
            JOIN security.tenants t ON t.tenant_id=pti.tenant_id
            WHERE pti.singleton_id=1 AND pti.user_id=:'uid'::uuid AND pti.tenant_id=:'tid'::uuid;")"
          [ "$binding" = 'ACTIVE|ACTIVE' ] || { echo "::error::Test identity binding proof failed: $binding"; exit 1; }

          membership="$(psql "$PSQL_DB" -X -v ON_ERROR_STOP=1 -At -v uid="$TESTUSER_SECURITY_ID" -v tid="$TESTTENANT_ID" -c "
            SELECT status FROM security.tenant_memberships
            WHERE user_id=:'uid'::uuid AND tenant_id=:'tid'::uuid;")"
          [ "$membership" = ACTIVE ] || { echo "::error::TestUser membership proof failed: $membership"; exit 1; }

          upload_bundle="$(psql "$PSQL_DB" -X -v ON_ERROR_STOP=1 -At -v tid="$TESTTENANT_ID" -c "
            SELECT count(*)
            FROM security.tenant_role_permissions rp
            JOIN security.permissions p ON p.permission_key=rp.permission_key AND p.status='ACTIVE'
            WHERE rp.tenant_id=:'tid'::uuid AND rp.role_key='PC' AND rp.permission_key='di.document.upload';")"
          [ "$upload_bundle" = 1 ] || { echo '::error::TestTenant PC upload permission is missing'; exit 1; }

          operating_roles="$(psql "$PSQL_DB" -X -v ON_ERROR_STOP=1 -At -v uid="$TESTUSER_SECURITY_ID" -c "
            SELECT count(*) FROM security.user_tenant_operating_roles
            WHERE user_id=:'uid'::uuid AND status='ACTIVE';")"
          [ "$operating_roles" = 0 ] || { echo "::error::TestUser must not hold a production operating role; found $operating_roles"; exit 1; }

          admin_roles="$(psql "$PSQL_DB" -X -v ON_ERROR_STOP=1 -At -v uid="$TESTUSER_SECURITY_ID" -c "
            SELECT count(*) FROM security.user_admin_role_assignments
            WHERE user_id=:'uid'::uuid AND status='ACTIVE';")"
          [ "$admin_roles" = 0 ] || { echo "::error::TestUser must not hold an admin role; found $admin_roles"; exit 1; }

          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session
          from verigence_security.repositories.v2_authorization_repository import V2AuthorizationRepository
          from verigence_security.services.v2_authorization import HumanAuthorizationResolver

          engine = create_engine(os.environ['PY_DB'])
          with Session(engine) as session:
              decision = HumanAuthorizationResolver(V2AuthorizationRepository(session)).check(
                  user_id=os.environ['TESTUSER_SECURITY_ID'],
                  tenant_id=os.environ['TESTTENANT_ID'],
                  permission_key='di.document.upload',
              )
              assert decision.allowed is True, decision
              assert decision.reason_code == 'ALLOW_TEST_USER_PC', decision
              assert decision.classification == 'TestUser', decision
              assert decision.role_key == 'PC', decision
              print('RUNTIME_AUTHZ=ALLOW_TEST_USER_PC')
          PY

          echo 'BINDING=PASS' >> "$GITHUB_ENV"
          echo 'MEMBERSHIP=PASS' >> "$GITHUB_ENV"
          echo 'PC_UPLOAD_BUNDLE=PASS' >> "$GITHUB_ENV"
          echo 'RUNTIME_AUTHZ=PASS' >> "$GITHUB_ENV"

      - name: Record proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/UC001_TESTUSER_TESTTENANT_RECONCILE_PROOF.md <<EOF
          # UC-001 TestUser / TestTenant Reconcile Proof

          - run_id: $GITHUB_RUN_ID
          - source_sha: $GITHUB_SHA
          - testuser_email: $TESTUSER_EMAIL
          - testuser_clerk_subject: $TESTUSER_CLERK_ID
          - testuser_security_user_id: $TESTUSER_SECURITY_ID
          - testtenant_id: $TESTTENANT_ID
          - testtenant_code: $TESTTENANT_CODE
          - testtenant_name: $TESTTENANT_NAME
          - preflight: ${PREFLIGHT:-not_reached}
          - reconciliation: ${RECONCILE:-not_reached}
          - phase1_test_binding: ${BINDING:-not_reached}
          - tenant_membership: ${MEMBERSHIP:-not_reached}
          - testtenant_pc_di_document_upload: ${PC_UPLOAD_BUNDLE:-not_reached}
          - runtime_authorization: ${RUNTIME_AUTHZ:-not_reached}
          - expected_runtime_reason: ALLOW_TEST_USER_PC
          - job_status: ${{ job.status }}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/UC001_TESTUSER_TESTTENANT_RECONCILE_PROOF.md
          git commit -m 'docs(dev): record TestUser TestTenant reconcile proof [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
