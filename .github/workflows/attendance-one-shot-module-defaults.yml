name: Attendance one-shot module defaults patch

on:
  push:
    branches:
      - feature/attendance-phase1-service

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/attendance-phase1-service
          fetch-depth: 0

      - name: Move Attendance operating defaults out of core platform bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migration = Path('migrations/0027_attendance_module_rbac.sql')
          text = migration.read_text(encoding='utf-8')
          start_marker = '-- Operating-role defaults remain the normal primary role source. HRADMIN is secondary.\n'
          end_marker = 'CREATE TABLE IF NOT EXISTS security.module_roles (\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Attendance migration markers are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker)
          replacement = '''-- Attendance is a separate module. Keep the core platform operating-role bundle stable
-- and register Attendance extensions in a module-specific default catalogue. Tenant
-- authorization still materializes into the canonical tenant_role_permissions table.
CREATE TABLE IF NOT EXISTS security.module_operating_role_permission_defaults (
    module_key              varchar(80) NOT NULL,
    role_key                varchar(120) NOT NULL REFERENCES security.role_definitions(role_key),
    permission_key          varchar(180) NOT NULL REFERENCES security.permissions(permission_key),
    source_catalog_version  varchar(40),
    status                  varchar(20) NOT NULL CHECK (status IN ('ACTIVE','INACTIVE')),
    created_at_utc          timestamptz NOT NULL DEFAULT CURRENT_TIMESTAMP,
    PRIMARY KEY (module_key,role_key,permission_key)
);

WITH operating_defaults(role_key,permission_key) AS (
  VALUES
    ('PC','attendance.self.read'),
    ('PC','attendance.self.checkin'),
    ('PC','attendance.self.checkout'),
    ('TL','attendance.self.read'),
    ('TL','attendance.self.checkin'),
    ('TL','attendance.self.checkout'),
    ('TL','attendance.team.read'),
    ('PM','attendance.self.read'),
    ('PM','attendance.self.checkin'),
    ('PM','attendance.self.checkout'),
    ('PM','attendance.all.read'),
    ('PM','attendance.report.read'),
    ('CRM','attendance.self.read'),
    ('CRM','attendance.self.checkin'),
    ('CRM','attendance.self.checkout'),
    ('Executive','attendance.self.read'),
    ('Executive','attendance.self.checkin'),
    ('Executive','attendance.self.checkout'),
    ('Executive','attendance.all.read'),
    ('Executive','attendance.report.read')
)
INSERT INTO security.module_operating_role_permission_defaults
(module_key,role_key,permission_key,source_catalog_version,status,created_at_utc)
SELECT 'attendance',role_key,permission_key,'attendance-phase1','ACTIVE',CURRENT_TIMESTAMP
FROM operating_defaults
ON CONFLICT (module_key,role_key,permission_key) DO UPDATE
SET source_catalog_version='attendance-phase1',status='ACTIVE';

-- Materialize Attendance grants for existing Tenants. Future Tenant creation reads
-- both the core platform defaults and these active module defaults.
DO $$
DECLARE super_admin_user uuid;
BEGIN
  SELECT user_id INTO super_admin_user
  FROM security.user_admin_role_assignments
  WHERE role_key='SuperAdmin' AND scope_type='PLATFORM' AND status='ACTIVE'
  LIMIT 1;
  IF super_admin_user IS NULL THEN
    RAISE EXCEPTION 'Attendance RBAC migration requires canonical active SuperAdmin';
  END IF;

  INSERT INTO security.tenant_role_permissions
  (tenant_id,role_key,permission_key,assigned_by_user_id,assigned_at_utc)
  SELECT t.tenant_id,d.role_key,d.permission_key,super_admin_user,CURRENT_TIMESTAMP
  FROM security.tenants t
  JOIN security.module_operating_role_permission_defaults d
    ON d.module_key='attendance' AND d.status='ACTIVE'
  JOIN security.permissions p
    ON p.permission_key=d.permission_key AND p.status='ACTIVE'
  WHERE t.status IN ('CONFIGURING','ACTIVE')
  ON CONFLICT (tenant_id,role_key,permission_key) DO NOTHING;
END $$;

'''
          migration.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          service = Path('src/verigence_security/services/platform_admin.py')
          source = service.read_text(encoding='utf-8')
          old = '''                SELECT d.role_key,d.permission_key
                FROM security.platform_role_permission_defaults d
                JOIN security.permissions p
                  ON p.permission_key=d.permission_key
                 AND p.status='ACTIVE'
                WHERE d.status='ACTIVE'
                  AND d.role_key IN ('PC','TL','PM','CRM','Executive')
                ORDER BY d.role_key,d.permission_key
'''
          new = '''                SELECT defaults.role_key,defaults.permission_key
                FROM (
                    SELECT d.role_key,d.permission_key
                    FROM security.platform_role_permission_defaults d
                    WHERE d.status='ACTIVE'
                    UNION
                    SELECT d.role_key,d.permission_key
                    FROM security.module_operating_role_permission_defaults d
                    WHERE d.status='ACTIVE'
                ) defaults
                JOIN security.permissions p
                  ON p.permission_key=defaults.permission_key
                 AND p.status='ACTIVE'
                WHERE defaults.role_key IN ('PC','TL','PM','CRM','Executive')
                ORDER BY defaults.role_key,defaults.permission_key
'''
          if source.count(old) != 1:
              raise SystemExit(f'Expected one Tenant default query, found {source.count(old)}')
          service.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- migrations/0027_attendance_module_rbac.sql src/verigence_security/services/platform_admin.py

      - name: Commit only the module-default changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations/0027_attendance_module_rbac.sql src/verigence_security/services/platform_admin.py
          changed="$(git diff --cached --name-only)"
          expected=$'migrations/0027_attendance_module_rbac.sql\nsrc/verigence_security/services/platform_admin.py'
          test "$changed" = "$expected"
          git commit -m 'refactor: isolate attendance operating-role defaults'
          git push origin HEAD:feature/attendance-phase1-service
