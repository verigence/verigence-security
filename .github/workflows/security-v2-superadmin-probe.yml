name: Security v2 SuperAdmin Probe

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/security-v2-superadmin-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Publish sanitized SuperAdmin classification counts
        shell: bash
        run: |
          set -Eeuo pipefail
          context='security-v2-superadmin-probe'
          target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$1" -f context="$context" -f description="$2" -f target_url="$target" >/dev/null
          }
          trap 'post failure "SuperAdmin DEV probe failed"' ERR
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || exit 1
          case "$raw" in
            postgresql+psycopg://*) db="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) db="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) db="$raw" ;;
            *) exit 1 ;;
          esac
          echo "::add-mask::$db"

          result="$(psql "$db" -X -v ON_ERROR_STOP=1 -Atc "
            WITH ids AS (
              SELECT
                (SELECT user_id FROM security.external_identities
                 WHERE provider='CLERK' AND provider_subject='user_3I7HFuZZiFC9K2muiweXFRoeoud'
                 LIMIT 1) AS approved_id,
                (SELECT user_id FROM security.external_identities
                 WHERE provider='CLERK' AND provider_subject='user_3I7FdD5Pkmydsp23OfjH9hBMxpN'
                 LIMIT 1) AS test_id
            ), conflict AS (
              SELECT p.user_id,p.assignment_source,u.status AS user_status,
                     sp.status AS principal_status,
                     COALESCE(e.provider,'NONE') AS identity_provider
              FROM security.platform_user_role_assignments p
              CROSS JOIN ids i
              JOIN security.users u ON u.user_id=p.user_id
              JOIN security.security_principals sp ON sp.principal_id=p.user_id
              LEFT JOIN LATERAL (
                SELECT provider FROM security.external_identities e
                WHERE e.user_id=p.user_id AND e.status='ACTIVE'
                ORDER BY provider LIMIT 1
              ) e ON true
              WHERE p.role_key='platform.super_admin' AND p.status='ACTIVE'
                AND p.user_id IS DISTINCT FROM i.approved_id
                AND p.user_id IS DISTINCT FROM i.test_id
            )
            SELECT
              'n=' || count(*) ||
              ',src=' || COALESCE(string_agg(DISTINCT assignment_source,','),'NONE') ||
              ',prov=' || COALESCE(string_agg(DISTINCT identity_provider,','),'NONE') ||
              ',user=' || COALESCE(string_agg(DISTINCT user_status,','),'NONE') ||
              ',principal=' || COALESCE(string_agg(DISTINCT principal_status,','),'NONE')
            FROM conflict;
          ")"
          echo "SANITIZED_SUPERADMIN_CONFLICT=$result"
          post success "$result"
          trap - ERR
