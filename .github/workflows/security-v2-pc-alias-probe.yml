name: Security v2 PC Alias Probe

on:
  push:
    branches: [dev]
    paths: [.github/workflows/security-v2-pc-alias-probe.yml]

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Compare legacy Process Consultant aliases with Tenant PC roles
        shell: bash
        run: |
          set -Eeuo pipefail
          target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$1" -f context=security-v2-pc-alias-probe \
              -f description="$2" -f target_url="$target" >/dev/null
          }
          trap 'post failure "PC alias verification probe failed"' ERR
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || exit 1
          case "$raw" in
            postgresql+psycopg://*) db="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) db="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) db="$raw" ;;
            *) exit 1 ;;
          esac
          echo "::add-mask::$db"
          psql "$db" -X -v ON_ERROR_STOP=1 -Atc "
            WITH custom AS (
              SELECT r.tenant_id,r.role_id,r.role_key,r.role_name,
                     count(ura.assignment_id) FILTER (WHERE ura.status='ACTIVE') AS assignments
              FROM security.roles r
              LEFT JOIN security.user_role_assignments ura
                ON ura.tenant_id=r.tenant_id AND ura.role_id=r.role_id
              WHERE r.status='ACTIVE' AND r.role_key IN ('PROCESS_CONSULTANT','PHASE5_PROCESS_CONSULTANT')
              GROUP BY r.tenant_id,r.role_id,r.role_key,r.role_name
            ), pc AS (
              SELECT tenant_id,role_id FROM security.roles WHERE status='ACTIVE' AND role_key='PC'
            )
            SELECT c.role_key || '|name=' || c.role_name || '|assign=' || c.assignments ||
                   '|pc_exists=' || CASE WHEN pc.role_id IS NULL THEN '0' ELSE '1' END ||
                   '|custom_only=' || (
                     SELECT count(*) FROM (
                       SELECT permission_key FROM security.role_permissions WHERE tenant_id=c.tenant_id AND role_id=c.role_id
                       EXCEPT
                       SELECT permission_key FROM security.role_permissions WHERE tenant_id=c.tenant_id AND role_id=pc.role_id
                     ) x
                   ) ||
                   '|pc_only=' || (
                     SELECT count(*) FROM (
                       SELECT permission_key FROM security.role_permissions WHERE tenant_id=c.tenant_id AND role_id=pc.role_id
                       EXCEPT
                       SELECT permission_key FROM security.role_permissions WHERE tenant_id=c.tenant_id AND role_id=c.role_id
                     ) y
                   )
            FROM custom c LEFT JOIN pc ON pc.tenant_id=c.tenant_id
            ORDER BY c.role_key,c.tenant_id;
          " | tee /tmp/pc-alias.txt
          summary="$(tr '\n' ';' </tmp/pc-alias.txt | sed 's/;$//')"
          echo "PC_ALIAS_COMPARISON=$summary"
          post success 'PC alias comparison completed; see sanitized run log'
          trap - ERR
