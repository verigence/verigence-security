name: Phase 3 Railway DEV Runtime Validation

on:
  push:
    branches:
      - feature/phase3-runtime-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-railway-dev-runtime-validation
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: a6808842-2e90-44f8-9172-63a905b24b5c
  RAILWAY_ENVIRONMENT_ID: 09e12bb5-9781-4b01-974b-fde54d01e37c
  RAILWAY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1

jobs:
  configure-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${DEV_DATABASE_URL:-}" ] && [ -z "${MIGRATION_DATABASE_URL:-}" ]; then
            echo "::error::Neither DEV_DATABASE_URL nor MIGRATION_DATABASE_URL is configured."
            exit 1
          fi

      - name: Snapshot current Railway deployment
        id: before
        shell: bash
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            exit 1
          fi
          deployment_id="$(printf '%s' "$response" | jq -r --arg service "$RAILWAY_SERVICE_ID" '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first | .latestDeployment.id // empty')"
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Captured current Railway deployment ID."

      - name: Configure Railway DEV runtime variables
        shell: bash
        run: |
          set -euo pipefail

          raw_db="${DEV_DATABASE_URL:-${MIGRATION_DATABASE_URL:-}}"
          case "$raw_db" in
            postgresql+psycopg://*) runtime_db="$raw_db" ;;
            postgresql+asyncpg://*) runtime_db="postgresql+psycopg://${raw_db#postgresql+asyncpg://}" ;;
            postgresql://*) runtime_db="postgresql+psycopg://${raw_db#postgresql://}" ;;
            postgres://*) runtime_db="postgresql+psycopg://${raw_db#postgres://}" ;;
            *)
              echo "::error::Configured DEV database secret is not a supported PostgreSQL URL."
              exit 1
              ;;
          esac

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/security-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/security-private.pem -pubout -out /tmp/security-public.pem >/dev/null 2>&1
          private_key="$(cat /tmp/security-private.pem)"
          public_key="$(cat /tmp/security-public.pem)"
          mock_secret="$(openssl rand -base64 48)"

          vars="$(jq -cn \
            --arg database_url "$runtime_db" \
            --arg private_key "$private_key" \
            --arg public_key "$public_key" \
            --arg mock_secret "$mock_secret" \
            '{
              APP_ENV:"dev",
              APP_NAME:"verigence-security",
              LOG_LEVEL:"INFO",
              DATABASE_URL:$database_url,
              SECURITY_TOKEN_ISSUER:"verigence-security",
              SECURITY_TOKEN_AUDIENCE:"verigence-platform",
              SECURITY_KEY_ID:"sec-dev-001",
              SECURITY_PRIVATE_KEY_PEM:$private_key,
              SECURITY_PUBLIC_KEY_PEM:$public_key,
              DEV_MOCK_AUTH_ENABLED:"true",
              DEV_MOCK_SIGNING_SECRET:$mock_secret,
              DEV_MOCK_TOKEN_TTL_MINUTES:"10",
              NETWORK_RISK_MODE:"mock",
              MOCK_NETWORK_RISK_STATUS:"NOT_DETECTED",
              TRUSTED_REMOTE_IP_HEADER:"X-Real-IP"
            }')"

          mutation='mutation VariableCollectionUpsert($projectId: String!, $serviceId: String!, $environmentId: String!, $variables: EnvironmentVariables!, $skipDeploys: Boolean) { variableCollectionUpsert(input: {projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId, variables: $variables, skipDeploys: $skipDeploys}) }'
          variables="$(jq -cn \
            --arg project "$RAILWAY_PROJECT_ID" \
            --arg service "$RAILWAY_SERVICE_ID" \
            --arg environment "$RAILWAY_ENVIRONMENT_ID" \
            --argjson vars "$vars" \
            '{projectId:$project,serviceId:$service,environmentId:$environment,variables:$vars,skipDeploys:false}')"
          body="$(jq -cn --arg query "$mutation" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            echo "::error::Railway rejected DEV runtime variable configuration."
            exit 1
          fi
          echo "Railway DEV runtime variables configured without exposing secret values."

      - name: Wait for Railway runtime redeployment
        id: deployment
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.before.outputs.id }}
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId latestDeployment { id status createdAt deploymentStopped instances { id status } } } } } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"

          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$body")"
            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
              printf '%s\n' "$response" | jq -c '.errors'
              exit 1
            fi

            node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first // {}')"
            deployment_id="$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')"
            status="$(printf '%s' "$node" | jq -r '.latestDeployment.status // empty')"

            if [ -z "$deployment_id" ] || [ "$deployment_id" = "${PREVIOUS_DEPLOYMENT_ID:-}" ]; then
              echo "Waiting for Railway to create the runtime-config deployment."
              sleep 5
              continue
            fi

            echo "Railway runtime deployment $deployment_id status=$status"
            case "$status" in
              SUCCESS)
                echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "::error::Railway runtime deployment ended with status $status."
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done

          echo "::error::Timed out waiting for Railway runtime deployment."
          exit 1

      - name: Resolve or create Railway DEV public domain
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { id domain } } }'
          variables="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Project-Access-Token: $RAILWAY_TOKEN" --header 'Content-Type: application/json' --data "$body")"
          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            exit 1
          fi
          domain="$(printf '%s' "$response" | jq -r '.data.domains.serviceDomains[0].domain // empty')"

          if [ -z "$domain" ]; then
            mutation='mutation serviceDomainCreate($input: ServiceDomainCreateInput!) { serviceDomainCreate(input: $input) { domain } }'
            mutation_variables="$(jq -cn --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{input:{environmentId:$environment,serviceId:$service}}')"
            mutation_body="$(jq -cn --arg query "$mutation" --argjson variables "$mutation_variables" '{query:$query,variables:$variables}')"
            response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Project-Access-Token: $RAILWAY_TOKEN" --header 'Content-Type: application/json' --data "$mutation_body")"
            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
              printf '%s\n' "$response" | jq -c '.errors'
              exit 1
            fi
            domain="$(printf '%s' "$response" | jq -r '.data.serviceDomainCreate.domain // empty')"
          fi

          if [ -z "$domain" ]; then
            echo "::error::Railway did not provide a public DEV domain."
            exit 1
          fi
          echo "base_url=https://$domain" >> "$GITHUB_OUTPUT"
          echo "Railway DEV public domain resolved."

      - name: Verify readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' "$base_url/health/ready" || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/ready.json
              exit 0
            fi
            echo "Readiness attempt $attempt/30 returned HTTP ${code:-000}."
            sleep 5
          done
          echo "::error::Railway DEV readiness check failed."
          exit 1

      - name: Verify liveness and X-Correlation-ID
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          correlation_id="$(cat /proc/sys/kernel/random/uuid)"
          code="$(curl --silent --show-error --dump-header /tmp/live.headers --output /tmp/live.json --write-out '%{http_code}' -H "X-Correlation-ID: $correlation_id" "$base_url/health/live")"
          if [ "$code" != "200" ]; then
            echo "::error::Railway DEV liveness returned HTTP $code."
            exit 1
          fi
          returned="$(awk 'BEGIN{IGNORECASE=1} /^X-Correlation-ID:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/live.headers)"
          if [ "$returned" != "$correlation_id" ]; then
            echo "::error::X-Correlation-ID was not preserved over deployed HTTPS."
            exit 1
          fi
          cat /tmp/live.json
          echo "Railway DEV liveness and correlation-ID verification passed."

      - name: Record Phase 3 runtime validation evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "Railway runtime deployment: ${{ steps.deployment.outputs.id }}"
          echo "Readiness: PASS"
          echo "Liveness: PASS"
          echo "X-Correlation-ID: PASS"
