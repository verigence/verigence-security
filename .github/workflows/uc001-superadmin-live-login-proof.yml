name: UC-001 SuperAdmin Live Login Proof

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-superadmin-live-login-proof.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
  PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
  SECURITY_SERVICE: security
  SUPERADMIN_EMAIL: jbrconsulting.it@gmail.com
  SUPERADMIN_CLERK_ID: user_3I7FdD5Pkmydsp23OfjH9hBMxpN
  SECURITY_URL: https://security-dev.up.railway.app
  WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway --version

      - name: Generate final temporary DEV password
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/superadmin-live-password.txt
          import secrets
          import string
          alphabet = string.ascii_letters + string.digits + '!@#%_-'
          while True:
              value = ''.join(secrets.choice(alphabet) for _ in range(22))
              if (any(c.islower() for c in value)
                  and any(c.isupper() for c in value)
                  and any(c.isdigit() for c in value)
                  and any(c in '!@#%_-' for c in value)):
                  print(value)
                  break
          PY
          password="$(cat /tmp/superadmin-live-password.txt)"
          echo "::add-mask::$password"
          echo "TEMP_PASSWORD=$password" >> "$GITHUB_ENV"
          chmod 600 /tmp/superadmin-live-password.txt

      - name: Assign password to canonical Clerk SuperAdmin
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg password "$TEMP_PASSWORD" '{password:$password,sign_out_of_other_sessions:true}')" \
            "https://api.clerk.com/v1/users/$SUPERADMIN_CLERK_ID")"
          [ "$(printf '%s' "$response" | jq -r '.id // empty')" = "$SUPERADMIN_CLERK_ID" ]
          [ "$(printf '%s' "$response" | jq -r '.banned // false')" = false ]
          [ "$(printf '%s' "$response" | jq -r '.locked // false')" = false ]
          verify="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg password "$TEMP_PASSWORD" '{password:$password}')" \
            "https://api.clerk.com/v1/users/$SUPERADMIN_CLERK_ID/verify_password")"
          [ "$(printf '%s' "$verify" | jq -r '.verified // false')" = true ]
          echo 'CLERK_RESET=PASS' >> "$GITHUB_ENV"

      - name: Call direct Security login
        id: security-login
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg identifier "$SUPERADMIN_EMAIL" --arg password "$TEMP_PASSWORD" '{identifier:$identifier,password:$password}')"
          code="$(curl --silent --show-error -D /tmp/security-headers.txt -o /tmp/security-login.txt -w '%{http_code}' \
            -X POST "$SECURITY_URL/security/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          echo "SECURITY_HTTP_CODE=$code" >> "$GITHUB_ENV"
          if [ "$code" = 200 ]; then
            cp /tmp/security-login.txt /tmp/security-login.json
            [ "$(jq -r '.actorType // empty' /tmp/security-login.json)" = USER ]
            [ "$(jq -r '.isSuperAdmin // false' /tmp/security-login.json)" = true ]
            [ -n "$(jq -r '.accessToken // empty' /tmp/security-login.json)" ]
            rm -f /tmp/security-login.json
            echo 'SECURITY_LOGIN=PASS' >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Direct Security login returned HTTP $code"
          cat /tmp/security-login.txt
          exit 1

      - name: Capture Railway runtime logs after failed login
        if: steps.security-login.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN missing'; exit 1; }
          env -u RAILWAY_TOKEN railway link \
            --project "$PLATFORM_PROJECT_ID" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/railway-link.json
          set +e
          env -u RAILWAY_TOKEN railway logs \
            --service "$SECURITY_SERVICE" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --lines 250 \
            --json > /tmp/security-runtime-raw.log 2>&1
          log_rc=$?
          set -e
          if [ "$log_rc" -ne 0 ]; then
            echo "railway logs command failed rc=$log_rc" >> /tmp/security-runtime-raw.log
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('/tmp/security-runtime-raw.log').read_text(errors='replace')
          # Keep exception/traceback/request lines around the login failure while avoiding accidental
          # credential/config disclosure in committed evidence.
          wanted = []
          for line in src.splitlines():
              low = line.lower()
              if any(key in low for key in (
                  'traceback', 'exception', 'error', '/security/v1/auth/login',
                  'clerkcredential', 'humanactor', 'token', 'sqlalchemy', 'psycopg',
                  '500 internal', 'internal server error'
              )):
                  line = re.sub(r'(?i)(authorization|password|secret|token)\s*[:=]\s*[^ ,}]+', r'\1=<redacted>', line)
                  wanted.append(line[:2000])
          Path('/tmp/security-runtime-sanitized.log').write_text('\n'.join(wanted[-120:]) + '\n')
          PY
          echo 'RUNTIME_LOG_CAPTURE=PASS' >> "$GITHUB_ENV"
          cat /tmp/security-runtime-sanitized.log

      - name: Prove Cloudflare Web proxy login
        id: web-login
        if: steps.security-login.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg identifier "$SUPERADMIN_EMAIL" --arg password "$TEMP_PASSWORD" '{identifier:$identifier,password:$password}')"
          code="$(curl --silent --show-error -D /tmp/web-headers.txt -o /tmp/web-login.json -w '%{http_code}' \
            -X POST "$WEB_URL/security/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          echo "WEB_HTTP_CODE=$code" >> "$GITHUB_ENV"
          [ "$code" = 200 ] || { echo "::error::Web proxy login returned HTTP $code"; cat /tmp/web-login.json; exit 1; }
          grep -qi '^x-verigence-proxy: security' /tmp/web-headers.txt
          [ "$(jq -r '.isSuperAdmin // false' /tmp/web-login.json)" = true ]
          rm -f /tmp/web-login.json
          echo 'WEB_PROXY_LOGIN=PASS' >> "$GITHUB_ENV"

      - name: Upload current temporary password
        if: always() && env.CLERK_RESET == 'PASS'
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-live-password-${{ github.run_id }}
          path: /tmp/superadmin-live-password.txt
          retention-days: 1
          if-no-files-found: error

      - name: Record non-secret live proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          runtime_excerpt='not_captured'
          if [ -s /tmp/security-runtime-sanitized.log ]; then
            runtime_excerpt='docs/deploy-evidence/UC001_SUPERADMIN_LOGIN_RUNTIME_ERROR.md'
            {
              echo '# UC-001 SuperAdmin Login Runtime Error'
              echo
              echo '```text'
              cat /tmp/security-runtime-sanitized.log
              echo '```'
            } > "$runtime_excerpt"
          fi
          cat > docs/deploy-evidence/UC001_SUPERADMIN_LIVE_LOGIN_PROOF.md <<EOF
          # UC-001 SuperAdmin Live Login Proof

          - run_id: $GITHUB_RUN_ID
          - source_sha: $GITHUB_SHA
          - superadmin_email: $SUPERADMIN_EMAIL
          - superadmin_clerk_id: $SUPERADMIN_CLERK_ID
          - clerk_password_reset: ${CLERK_RESET:-not_reached}
          - direct_security_http: ${SECURITY_HTTP_CODE:-not_reached}
          - direct_security_login: ${SECURITY_LOGIN:-not_reached}
          - cloudflare_proxy_http: ${WEB_HTTP_CODE:-not_reached}
          - cloudflare_proxy_login: ${WEB_PROXY_LOGIN:-not_reached}
          - runtime_log_capture: ${RUNTIME_LOG_CAPTURE:-not_reached}
          - runtime_error_evidence: $runtime_excerpt
          - password_artifact: superadmin-live-password-$GITHUB_RUN_ID
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/UC001_SUPERADMIN_LIVE_LOGIN_PROOF.md
          if [ -f docs/deploy-evidence/UC001_SUPERADMIN_LOGIN_RUNTIME_ERROR.md ]; then
            git add docs/deploy-evidence/UC001_SUPERADMIN_LOGIN_RUNTIME_ERROR.md
          fi
          git commit -m 'docs(dev): record SuperAdmin live login diagnostic [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev

      - name: Fail proof unless both live login paths pass
        shell: bash
        run: |
          set -euo pipefail
          [ "${SECURITY_LOGIN:-}" = PASS ] || exit 1
          [ "${WEB_PROXY_LOGIN:-}" = PASS ] || exit 1
