name: Security CI Workflow Patch

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch-canonical-workflow:
    if: github.head_ref == 'fix/security-forward-only-migrations'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch canonical Security CI migration stage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          python - <<'PY'
          from pathlib import Path
          import subprocess

          base = subprocess.check_output(
              ['git', 'show', 'origin/dev:.github/workflows/ci.yml'],
              text=True,
          )
          start_marker = '      - name: Apply current Security migrations in approved order\n'
          keep_marker = '          permission_count="$(psql '
          start = base.index(start_marker)
          keep = base.index(keep_marker, start)
          replacement = '''      - name: Apply pending Security migrations only
        shell: bash
        env:
          SECURITY_MIGRATION_BOOTSTRAP_THROUGH: 0024_uc02_tenant_hard_delete.sql
        run: |
          set -euo pipefail
          python scripts/apply_security_migrations.py \\
            --database-url "$SECURITY_MIGRATION_DATABASE_URL" \\
            --revision "$DEPLOY_SHA" \\
            --bootstrap-existing-through "$SECURITY_MIGRATION_BOOTSTRAP_THROUGH"

'''
          patched = base[:start] + replacement + base[keep:]
          Path('.github/workflows/ci.yml').write_text(patched, encoding='utf-8')
          PY

      - name: Commit patched canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Verigence-admin'
          git config user.email 'jbrconsulting.it@gmail.com'
          git add .github/workflows/ci.yml
          git commit -m 'fix(ci): make Security migrations forward-only'
          git push origin HEAD:${{ github.head_ref }}
