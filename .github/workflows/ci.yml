name: Security CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: Deploy the selected main revision to Security DEV after CI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/verigence/verigence-security
  PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
  PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
  SECURITY_SERVICE: security

jobs:
  quality:
    name: Quality, tests, and package build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: security-ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "build>=1.2,<2"

      - name: Verify approved design integrity and static safety
        run: python scripts/ci_static_checks.py

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Verify v1.4.2 runtime route contract
        run: python scripts/check_v142_route_contract.py

      - name: Tests
        run: pytest -q

      - name: Build package
        run: python -m build

      - name: Verify installed dependency consistency
        run: python -m pip check

  deploy-dev:
    name: Migrate and deploy Security DEV
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_dev == true && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: security-dev-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Check out exact validated Security revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install PostgreSQL client and Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          npm install --global @railway/cli
          psql --version
          railway --version

      - name: Resolve proven Security migration database
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || {
            echo "::error::MIGRATION_DATABASE_URL is not configured."
            exit 1
          }
          case "$raw" in
            postgresql+psycopg://*) database_url="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) database_url="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) database_url="$raw" ;;
            *) echo "::error::MIGRATION_DATABASE_URL is not PostgreSQL."; exit 1 ;;
          esac
          echo "::add-mask::$database_url"
          echo "SECURITY_MIGRATION_DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          psql "$database_url" -X -v ON_ERROR_STOP=1 -Atc 'SELECT 1' >/dev/null
          echo "SECURITY_MIGRATION_DATABASE=PASS"

      - name: Apply current Security migrations in approved order
        shell: bash
        run: |
          set -euo pipefail
          table_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='security' AND c.relkind IN ('r','p');
          ")"

          if [ "$table_count" = "0" ]; then
            expected="175d10780659c54f402980b08ea209cd34139c9ad28df6c4a758d521c7ca606d"
            actual="$(sha256sum migrations/0001_security_baseline_v1.3.sql | awk '{print $1}')"
            [ "$actual" = "$expected" ] || {
              echo "::error::Approved Security v1.3 baseline digest mismatch."
              exit 1
            }
            psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -f migrations/0001_security_baseline_v1.3.sql
          else
            tenants_exists="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc \
              "SELECT to_regclass('security.tenants') IS NOT NULL;")"
            [ "$tenants_exists" = "t" ] || {
              echo "::error::Security schema is partially populated or drifted; refusing migration."
              exit 1
            }
          fi

          for migration in \
            migrations/0002_security_admin_control_plane_v1.4.sql \
            migrations/0003_global_user_onboarding_v1.4.2.sql \
            migrations/0004_v142_security_event_outcome_width.sql \
            migrations/0005_super_admin_full_authority.sql \
            migrations/0006_phase1_self_onboarding_v1.4.5.sql \
            migrations/0007_clerk_email_otp_onboarding_v1.4.6.sql \
            migrations/0008_privileged_access_maker_checker_v1.4.7.sql \
            migrations/0009_backend_email_otp_facade_v1.4.8.sql \
            migrations/0010_audit_core_di_permissions.sql
          do
            echo "Applying $(basename "$migration")"
            psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done

          permission_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*) FROM security.permissions
            WHERE status='ACTIVE'
              AND permission_key IN ('di.document.read','di.document.upload');
          ")"
          [ "$permission_count" = "2" ] || {
            echo "::error::Audit Core DI permission migration verification failed."
            exit 1
          }
          echo "SECURITY_MIGRATIONS=PASS"

      - name: Link and verify approved shared Railway DEV target
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || {
            echo "::error::RAILWAY_API_TOKEN is not configured."
            exit 1
          }
          [ -n "${RAILWAY_TOKEN:-}" ] || {
            echo "::error::RAILWAY_TOKEN is not configured."
            exit 1
          }

          env -u RAILWAY_TOKEN railway link \
            --project "$PLATFORM_PROJECT_ID" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/railway-link.json
          env -u RAILWAY_TOKEN railway status --json >/tmp/railway-status.json
          env -u RAILWAY_TOKEN railway service list --json >/tmp/railway-services.json

          token_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')"
          [ "$(printf '%s' "$token_response" | jq -r 'has("errors")')" = "false" ] || {
            echo "::error::RAILWAY_TOKEN could not be validated as a Railway Project Token."
            exit 1
          }

          status_project_id="$(jq -r '.id // empty' /tmp/railway-status.json)"
          token_project_id="$(printf '%s' "$token_response" | jq -r '.data.projectToken.projectId // empty')"
          token_environment_id="$(printf '%s' "$token_response" | jq -r '.data.projectToken.environmentId // empty')"
          service_id="$(jq -r --arg service "$SECURITY_SERVICE" \
            '[.[] | select(.name == $service)] | first | .id // empty' /tmp/railway-services.json)"

          [ "$status_project_id" = "$PLATFORM_PROJECT_ID" ] || {
            echo "::error::Railway account token did not link the approved shared DEV project."
            exit 1
          }
          [ "$token_project_id" = "$PLATFORM_PROJECT_ID" ] || {
            echo "::error::Railway Project Token scope does not match the approved shared DEV project."
            exit 1
          }
          [ "$token_environment_id" = "$PLATFORM_ENVIRONMENT_ID" ] || {
            echo "::error::Railway Project Token does not target the approved DEV environment."
            exit 1
          }
          [ -n "$service_id" ] || {
            echo "::error::Security service is missing from the approved shared DEV project."
            exit 1
          }

          echo "RAILWAY_SERVICE_ID=$service_id" >> "$GITHUB_ENV"
          echo "SECURITY_RAILWAY_TARGET=PASS"

      - name: Validate persisted Security runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway variable list \
            --service "$SECURITY_SERVICE" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/security-vars.json
          python - <<'PY'
          import json
          from pathlib import Path

          values = json.loads(Path('/tmp/security-vars.json').read_text())
          required = {
              'DATABASE_URL',
              'CLERK_SECRET_KEY',
              'SECURITY_USER_ONBOARDING_KEY_ENCRYPTION_KEY',
              'SECURITY_KEY_ID',
              'SECURITY_PRIVATE_KEY_PEM',
              'SECURITY_PUBLIC_KEY_PEM',
          }
          missing = sorted(key for key in required if not values.get(key))
          if missing:
              raise SystemExit('Required persisted Security configuration is missing: ' + ', '.join(missing))
          print('SECURITY_PERSISTED_CONFIG=PASS')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact immutable Security image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Record and validate immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker manifest inspect "$image_ref" >/dev/null 2>&1 || {
            echo "::error::Published Security image is not anonymously pullable by Railway."
            exit 1
          }
          docker pull "$image_ref" >/dev/null
          docker run --rm "$image_ref" python --version 2>&1 | grep -E '^Python 3\.12\.'
          echo "SECURITY_IMMUTABLE_IMAGE=PASS"

      - name: Snapshot current Security deployment
        id: before
        shell: bash
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId source { image } latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || {
            printf '%s\n' "$response" | jq -c '.errors'
            exit 1
          }
          node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" \
            '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first // {}')"
          [ "$(printf '%s' "$node" | jq -r '.serviceId // empty')" = "$RAILWAY_SERVICE_ID" ] || {
            echo "::error::Resolved Security service instance is missing."
            exit 1
          }
          echo "id=$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')" >> "$GITHUB_OUTPUT"

      - name: Attach exact image to Security service only
        shell: bash
        run: |
          set -euo pipefail
          mutation='mutation EnvironmentPatchCommit($environmentId: String!, $patch: EnvironmentConfig!, $commitMessage: String) { environmentPatchCommit(environmentId: $environmentId, patch: $patch, commitMessage: $commitMessage) }'
          patch="$(jq -cn \
            --arg service "$RAILWAY_SERVICE_ID" \
            --arg image "${{ steps.image.outputs.image_ref }}" \
            '{services:{($service):{source:{image:$image}}}}')"
          variables="$(jq -cn \
            --arg environment "$PLATFORM_ENVIRONMENT_ID" \
            --arg message "Deploy verigence-security DEV ${DEPLOY_SHA}" \
            --argjson patch "$patch" \
            '{environmentId:$environment,patch:$patch,commitMessage:$message}')"
          body="$(jq -cn --arg query "$mutation" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || {
            printf '%s\n' "$response" | jq -c '.errors'
            echo "::error::Railway rejected the exact Security DEV image."
            exit 1
          }
          echo "SECURITY_ONLY_IMAGE_MUTATION=PASS"

      - name: Wait for exact Security deployment to succeed
        id: deployment
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.before.outputs.id }}
          EXPECTED_IMAGE: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId source { image } latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"

          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$body")"
            [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || exit 1
            node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" \
              '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first // {}')"
            source_image="$(printf '%s' "$node" | jq -r '.source.image // empty')"
            deployment_id="$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')"
            status="$(printf '%s' "$node" | jq -r '.latestDeployment.status // empty')"

            if [ "$source_image" != "$EXPECTED_IMAGE" ] || [ -z "$deployment_id" ] || \
               [ "$deployment_id" = "${PREVIOUS_DEPLOYMENT_ID:-}" ]; then
              sleep 5
              continue
            fi
            echo "Security Railway deployment $deployment_id status=$status"
            case "$status" in
              SUCCESS)
                echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "::error::Security Railway deployment $deployment_id ended with status $status."
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done
          echo "::error::Timed out waiting for Security DEV deployment to reach SUCCESS."
          exit 1

      - name: Resolve or create Security DEV public domain
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { id domain } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || exit 1
          domain="$(printf '%s' "$response" | jq -r '.data.domains.serviceDomains[0].domain // empty')"
          if [ -z "$domain" ]; then
            mutation='mutation serviceDomainCreate($input: ServiceDomainCreateInput!) { serviceDomainCreate(input: $input) { domain } }'
            mutation_variables="$(jq -cn --arg environment "$PLATFORM_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{input:{environmentId:$environment,serviceId:$service}}')"
            mutation_body="$(jq -cn --arg query "$mutation" --argjson variables "$mutation_variables" '{query:$query,variables:$variables}')"
            response="$(curl --fail-with-body --silent --show-error --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' --data "$mutation_body")"
            [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || exit 1
            domain="$(printf '%s' "$response" | jq -r '.data.serviceDomainCreate.domain // empty')"
          fi
          [ -n "$domain" ] || {
            echo "::error::Railway did not provide a Security DEV domain."
            exit 1
          }
          echo "base_url=https://$domain" >> "$GITHUB_OUTPUT"
          echo "SECURITY_PUBLIC_DOMAIN=PASS"

      - name: Verify Security readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' \
              "$base_url/health/ready" || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/ready.json
              echo "SECURITY_READINESS=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Security readiness failed after successful Railway deployment."
          exit 1

      - name: Verify Security liveness, correlation ID, and JWKS
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          correlation_id="$(cat /proc/sys/kernel/random/uuid)"
          code="$(curl --silent --show-error --dump-header /tmp/live.headers --output /tmp/live.json \
            --write-out '%{http_code}' -H "X-Correlation-ID: $correlation_id" "$base_url/health/live")"
          [ "$code" = "200" ] || {
            echo "::error::Security liveness returned HTTP $code."
            exit 1
          }
          returned="$(awk 'BEGIN{IGNORECASE=1} /^X-Correlation-ID:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/live.headers)"
          [ "$returned" = "$correlation_id" ] || {
            echo "::error::X-Correlation-ID was not preserved over deployed HTTPS."
            exit 1
          }
          curl --fail --silent --show-error "$base_url/.well-known/jwks.json" >/tmp/security-jwks.json
          jq -e '.keys | type == "array" and length > 0' /tmp/security-jwks.json >/dev/null || {
            echo "::error::Security JWKS does not contain an active signing key."
            exit 1
          }
          echo "SECURITY_LIVENESS=PASS"
          echo "SECURITY_CORRELATION_ID=PASS"
          echo "SECURITY_JWKS=PASS"

      - name: Record Security deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "source_commit=$DEPLOY_SHA"
          echo "image=${{ steps.image.outputs.image_ref }}"
          echo "railway_deployment=${{ steps.deployment.outputs.id }}"
          echo "security_only_deployment=PASS"
          echo "migrations=PASS"
          echo "readiness=PASS"
          echo "liveness=PASS"
          echo "jwks=PASS"
          echo "correlation_id=PASS"
