name: Security CI/CD

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Security operation to run after CI
        required: true
        default: ci-only
        type: choice
        options:
          - ci-only
          - deploy-dev
          - tenant-admin
          - readiness-check
          - audit-core-bind
          - integration-bootstrap
      tenant_code:
        description: DEV Tenant code for tenant-admin / integration-bootstrap
        required: true
        default: test-project
        type: string
      tenant_name:
        description: DEV Tenant name for tenant-admin / integration-bootstrap
        required: true
        default: TestProject
        type: string
      tenant_id:
        description: Exact ACTIVE DEV Tenant UUID for Audit Core / integration bootstrap
        required: true
        default: 9de3af49-260f-4b15-8263-07c93dcc04d2
        type: string
      activate_after_create:
        description: Activate Tenant after create/reuse
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/verigence/verigence-security
  PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
  PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
  SECURITY_SERVICE: security
  AUDIT_SERVICE: verigence-audit-core
  AUDIT_CORE_CLIENT_ID: audit-core
  AUDIT_CORE_EXPECTED_SECRET_SHA256: 06fd76dc52d593d232329fc958f148be1757a88e7ecf710a41d7718a9c60be81

jobs:
  quality:
    name: Quality, tests, and package build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: security-ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "build>=1.2,<2"

      - name: Verify approved design integrity and static safety
        run: python scripts/ci_static_checks.py

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Verify v1.4.2 runtime route contract
        run: python scripts/check_v142_route_contract.py

      - name: Tests
        run: pytest -q

      - name: Build package
        run: python -m build

      - name: Verify installed dependency consistency
        run: python -m pip check

  deploy-dev:
    name: Migrate and deploy Security DEV
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-dev' && github.ref == 'refs/heads/dev')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    concurrency:
      group: security-dev-operation
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Check out exact validated Security revision
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install PostgreSQL client and Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          npm install --global @railway/cli
          psql --version
          railway --version

      - name: Resolve proven Security migration database
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || {
            echo "::error::MIGRATION_DATABASE_URL is not configured."
            exit 1
          }
          case "$raw" in
            postgresql+psycopg://*) database_url="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) database_url="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) database_url="$raw" ;;
            *) echo "::error::MIGRATION_DATABASE_URL is not PostgreSQL."; exit 1 ;;
          esac
          echo "::add-mask::$database_url"
          echo "SECURITY_MIGRATION_DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          psql "$database_url" -X -v ON_ERROR_STOP=1 -Atc 'SELECT 1' >/dev/null
          echo "SECURITY_MIGRATION_DATABASE=PASS"

      - name: Apply pending Security migrations only
        shell: bash
        env:
          SECURITY_MIGRATION_BOOTSTRAP_THROUGH: 0024_uc02_tenant_hard_delete.sql
        run: |
          set -euo pipefail
          python scripts/apply_security_migrations.py \
            --database-url "$SECURITY_MIGRATION_DATABASE_URL" \
            --revision "$DEPLOY_SHA" \
            --bootstrap-existing-through "$SECURITY_MIGRATION_BOOTSTRAP_THROUGH"

          permission_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*) FROM security.permissions
            WHERE status='ACTIVE'
              AND permission_key IN ('di.document.read','di.document.upload');
          ")"
          [ "$permission_count" = "2" ] || {
            echo "::error::Audit Core DI permission migration verification failed."
            exit 1
          }

          v2_tables_ready="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT
              to_regclass('security.role_definitions') IS NOT NULL
              AND to_regclass('security.platform_role_permission_defaults') IS NOT NULL
              AND to_regclass('security.tenant_role_permissions') IS NOT NULL
              AND to_regclass('security.user_tenant_operating_roles') IS NOT NULL
              AND to_regclass('security.user_admin_role_assignments') IS NOT NULL
              AND to_regclass('security.phase1_test_identity') IS NOT NULL
              AND to_regclass('security.user_deletion_requests') IS NOT NULL
              AND to_regclass('security.deleted_user_tombstones') IS NOT NULL
              AND to_regclass('security.password_reset_attempts') IS NOT NULL;
          ")"
          [ "$v2_tables_ready" = "t" ] || {
            echo "::error::Security current foundation/lifecycle/recovery migrations are incomplete."
            exit 1
          }

          rejected_status_ready="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT EXISTS (
              SELECT 1
              FROM pg_constraint c
              JOIN pg_class t ON t.oid=c.conrelid
              JOIN pg_namespace n ON n.oid=t.relnamespace
              WHERE n.nspname='security'
                AND t.relname='users'
                AND c.contype='c'
                AND pg_get_constraintdef(c.oid) LIKE '%REJECTED%'
            );
          ")"
          [ "$rejected_status_ready" = "t" ] || {
            echo "::error::Security v2 USER status constraint does not include REJECTED."
            exit 1
          }

          v2_role_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*) FROM security.role_definitions
            WHERE status='ACTIVE'
              AND role_key IN ('PC','TL','PM','CRM','Executive','TenantAdmin','ModuleAdmin','SuperAdmin','TestUser');
          ")"
          [ "$v2_role_count" = "9" ] || {
            echo "::error::Security v2 role-definition seed verification failed."
            exit 1
          }

          v2_default_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM security.platform_role_permission_defaults d
            JOIN security.permissions p ON p.permission_key=d.permission_key
            WHERE d.status='ACTIVE' AND p.status='ACTIVE'
              AND d.role_key IN ('PC','TL','PM','CRM','Executive');
          ")"
          [ "$v2_default_count" = "156" ] || {
            echo "::error::Security v2 operating-role default seed verification failed."
            exit 1
          }

          executive_write_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM security.platform_role_permission_defaults
            WHERE role_key='Executive' AND status='ACTIVE'
              AND permission_key IN ('audit.master.write','audit.customer.write');
          ")"
          [ "$executive_write_count" = "2" ] || {
            echo "::error::Executive approved Audit Core write defaults are missing."
            exit 1
          }

          canonical_super_admin_v2_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM security.external_identities ei
            JOIN security.users u ON u.user_id=ei.user_id
            JOIN security.security_principals sp ON sp.principal_id=u.user_id
            JOIN security.user_admin_role_assignments a ON a.user_id=u.user_id
            WHERE ei.provider='CLERK'
              AND ei.provider_subject='user_3I7FdD5Pkmydsp23OfjH9hBMxpN'
              AND ei.status='ACTIVE'
              AND lower(u.primary_email)='jbrconsulting.it@gmail.com'
              AND u.status='ACTIVE'
              AND sp.actor_type='USER'
              AND sp.status='ACTIVE'
              AND a.role_key='SuperAdmin'
              AND a.scope_type='PLATFORM'
              AND a.scope_id IS NULL
              AND a.status='ACTIVE';
          ")"
          [ "$canonical_super_admin_v2_count" = "1" ] || {
            echo "::error::Canonical DEV SuperAdmin v2 identity/role chain is not exactly one ACTIVE assignment."
            exit 1
          }

          canonical_super_admin_legacy_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM security.external_identities ei
            JOIN security.platform_user_role_assignments a ON a.user_id=ei.user_id
            WHERE ei.provider='CLERK'
              AND ei.provider_subject='user_3I7FdD5Pkmydsp23OfjH9hBMxpN'
              AND ei.status='ACTIVE'
              AND a.role_key='platform.super_admin'
              AND a.status='ACTIVE';
          ")"
          [ "$canonical_super_admin_legacy_count" = "1" ] || {
            echo "::error::Canonical DEV SuperAdmin legacy compatibility assignment is not exactly one ACTIVE assignment."
            exit 1
          }

          canonical_test_user_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM security.external_identities ei
            JOIN security.users u ON u.user_id=ei.user_id
            JOIN security.security_principals sp ON sp.principal_id=u.user_id
            WHERE ei.provider='CLERK'
              AND ei.provider_subject='user_3I7HFuZZiFC9K2muiweXFRoeoud'
              AND ei.status='ACTIVE'
              AND lower(u.primary_email)='gigsinopensource@gmail.com'
              AND u.status='ACTIVE'
              AND sp.actor_type='USER'
              AND sp.status='ACTIVE';
          ")"
          [ "$canonical_test_user_count" = "1" ] || {
            echo "::error::Canonical DEV TestUser identity chain is not exactly one ACTIVE USER."
            exit 1
          }

          test_user_super_admin_count="$(psql "$SECURITY_MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT
              (SELECT count(*)
               FROM security.user_admin_role_assignments a
               JOIN security.external_identities ei ON ei.user_id=a.user_id
               WHERE ei.provider='CLERK'
                 AND ei.provider_subject='user_3I7HFuZZiFC9K2muiweXFRoeoud'
                 AND a.role_key='SuperAdmin'
                 AND a.status='ACTIVE')
              +
              (SELECT count(*)
               FROM security.platform_user_role_assignments a
               JOIN security.external_identities ei ON ei.user_id=a.user_id
               WHERE ei.provider='CLERK'
                 AND ei.provider_subject='user_3I7HFuZZiFC9K2muiweXFRoeoud'
                 AND a.role_key='platform.super_admin'
                 AND a.status='ACTIVE');
          ")"
          [ "$test_user_super_admin_count" = "0" ] || {
            echo "::error::Canonical DEV TestUser must not hold any SuperAdmin assignment."
            exit 1
          }

          echo "SECURITY_V2_MIGRATIONS=PASS"
          echo "SECURITY_CANONICAL_DEV_IDENTITIES=PASS"
          echo "SECURITY_MIGRATIONS=PASS"

      - name: Link and verify approved shared Railway DEV target
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || {
            echo "::error::RAILWAY_API_TOKEN is not configured."
            exit 1
          }
          [ -n "${RAILWAY_TOKEN:-}" ] || {
            echo "::error::RAILWAY_TOKEN is not configured."
            exit 1
          }

          env -u RAILWAY_TOKEN railway link \
            --project "$PLATFORM_PROJECT_ID" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/railway-link.json
          env -u RAILWAY_TOKEN railway status --json >/tmp/railway-status.json
          env -u RAILWAY_TOKEN railway service list --json >/tmp/railway-services.json

          token_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')"
          [ "$(printf '%s' "$token_response" | jq -r 'has("errors")')" = "false" ] || {
            echo "::error::RAILWAY_TOKEN could not be validated as a Railway Project Token."
            exit 1
          }

          status_project_id="$(jq -r '.id // empty' /tmp/railway-status.json)"
          token_project_id="$(printf '%s' "$token_response" | jq -r '.data.projectToken.projectId // empty')"
          token_environment_id="$(printf '%s' "$token_response" | jq -r '.data.projectToken.environmentId // empty')"
          service_id="$(jq -r --arg service "$SECURITY_SERVICE" \
            '[.[] | select(.name == $service)] | first | .id // empty' /tmp/railway-services.json)"

          [ "$status_project_id" = "$PLATFORM_PROJECT_ID" ] || {
            echo "::error::Railway account token did not link the approved shared DEV project."
            exit 1
          }
          [ "$token_project_id" = "$PLATFORM_PROJECT_ID" ] || {
            echo "::error::Railway Project Token scope does not match the approved shared DEV project."
            exit 1
          }
          [ "$token_environment_id" = "$PLATFORM_ENVIRONMENT_ID" ] || {
            echo "::error::Railway Project Token does not target the approved DEV environment."
            exit 1
          }
          [ -n "$service_id" ] || {
            echo "::error::Security service is missing from the approved shared DEV project."
            exit 1
          }

          echo "RAILWAY_SERVICE_ID=$service_id" >> "$GITHUB_ENV"
          echo "SECURITY_RAILWAY_TARGET=PASS"

      - name: Validate persisted Security runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway variable list \
            --service "$SECURITY_SERVICE" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/security-vars.json
          python - <<'PY'
          import json
          from pathlib import Path

          values = json.loads(Path('/tmp/security-vars.json').read_text())
          required = {
              'DATABASE_URL',
              'CLERK_SECRET_KEY',
              'SECURITY_USER_ONBOARDING_KEY_ENCRYPTION_KEY',
              'SECURITY_KEY_ID',
              'SECURITY_PRIVATE_KEY_PEM',
              'SECURITY_PUBLIC_KEY_PEM',
          }
          missing = sorted(key for key in required if not values.get(key))
          if missing:
            raise SystemExit('Required persisted Security configuration is missing: ' + ', '.join(missing))
          print('SECURITY_PERSISTED_CONFIG=PASS')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact immutable Security image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Record and validate immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker manifest inspect "$image_ref" >/dev/null 2>&1 || {
            echo "::error::Published Security image is not anonymously pullable by Railway."
            exit 1
          }
          docker pull "$image_ref" >/dev/null
          docker run --rm "$image_ref" python --version 2>&1 | grep -E '^Python 3\.12\.'
          echo "SECURITY_IMMUTABLE_IMAGE=PASS"

      - name: Snapshot current Security deployment
        id: before
        shell: bash
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId source { image } latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || {
            printf '%s\n' "$response" | jq -c '.errors'
            exit 1
          }
          node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" \
            '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first // {}')"
          [ "$(printf '%s' "$node" | jq -r '.serviceId // empty')" = "$RAILWAY_SERVICE_ID" ] || {
            echo "::error::Resolved Security service instance is missing."
            exit 1
          }
          echo "id=$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')" >> "$GITHUB_OUTPUT"

      - name: Attach exact image to Security service only
        shell: bash
        run: |
          set -euo pipefail
          mutation='mutation EnvironmentPatchCommit($environmentId: String!, $patch: EnvironmentConfig!, $commitMessage: String) { environmentPatchCommit(environmentId: $environmentId, patch: $patch, commitMessage: $commitMessage) }'
          patch="$(jq -cn \
            --arg service "$RAILWAY_SERVICE_ID" \
            --arg image "${{ steps.image.outputs.image_ref }}" \
            '{services:{($service):{source:{image:$image}}}}')"
          variables="$(jq -cn \
            --arg environment "$PLATFORM_ENVIRONMENT_ID" \
            --arg message "Deploy verigence-security DEV ${DEPLOY_SHA}" \
            --argjson patch "$patch" \
            '{environmentId:$environment,patch:$patch,commitMessage:$message}')"
          body="$(jq -cn --arg query "$mutation" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || {
            printf '%s\n' "$response" | jq -c '.errors'
            echo "::error::Railway rejected the exact Security DEV image."
            exit 1
          }
          echo "SECURITY_ONLY_IMAGE_MUTATION=PASS"

      - name: Wait for exact Security deployment to succeed
        id: deployment
        shell: bash
        env:
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.before.outputs.id }}
          EXPECTED_IMAGE: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId source { image } latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"

          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$body")"
            [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || exit 1
            node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" \
              '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first // {}')"
            source_image="$(printf '%s' "$node" | jq -r '.source.image // empty')"
            deployment_id="$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')"
            status="$(printf '%s' "$node" | jq -r '.latestDeployment.status // empty')"

            if [ "$source_image" != "$EXPECTED_IMAGE" ] || [ -z "$deployment_id" ] || \
               [ "$deployment_id" = "${PREVIOUS_DEPLOYMENT_ID:-}" ]; then
              sleep 5
              continue
            fi
            echo "Security Railway deployment $deployment_id status=$status"
            case "$status" in
              SUCCESS)
                echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "::error::Security Railway deployment $deployment_id ended with status $status."
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done
          echo "::error::Timed out waiting for Security DEV deployment to reach SUCCESS."
          exit 1

      - name: Resolve or create Security DEV public domain
        id: domain
        shell: bash
        run: |
          set -euo pipefail
          query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { id domain } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || exit 1
          domain="$(printf '%s' "$response" | jq -r '.data.domains.serviceDomains[0].domain // empty')"
          if [ -z "$domain" ]; then
            mutation='mutation serviceDomainCreate($input: ServiceDomainCreateInput!) { serviceDomainCreate(input: $input) { domain } }'
            mutation_variables="$(jq -cn --arg environment "$PLATFORM_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{input:{environmentId:$environment,serviceId:$service}}')"
            mutation_body="$(jq -cn --arg query "$mutation" --argjson variables "$mutation_variables" '{query:$query,variables:$variables}')"
            response="$(curl --fail-with-body --silent --show-error --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' --data "$mutation_body")"
            [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || exit 1
            domain="$(printf '%s' "$response" | jq -r '.data.serviceDomainCreate.domain // empty')"
          fi
          [ -n "$domain" ] || {
            echo "::error::Railway did not provide a Security DEV domain."
            exit 1
          }
          echo "base_url=https://$domain" >> "$GITHUB_OUTPUT"
          echo "SECURITY_PUBLIC_DOMAIN=PASS"

      - name: Verify Security readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' \
              "$base_url/health/ready" || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/ready.json
              echo "SECURITY_READINESS=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Security readiness failed after successful Railway deployment."
          exit 1

      - name: Verify Security liveness, correlation ID, and JWKS
        shell: bash
        run: |
          set -euo pipefail
          base_url="${{ steps.domain.outputs.base_url }}"
          correlation_id="$(cat /proc/sys/kernel/random/uuid)"
          code="$(curl --silent --show-error --dump-header /tmp/live.headers --output /tmp/live.json \
            --write-out '%{http_code}' -H "X-Correlation-ID: $correlation_id" "$base_url/health/live")"
          [ "$code" = "200" ] || {
            echo "::error::Security liveness returned HTTP $code."
            exit 1
          }
          returned="$(awk 'BEGIN{IGNORECASE=1} /^X-Correlation-ID:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/live.headers)"
          [ "$returned" = "$correlation_id" ] || {
            echo "::error::X-Correlation-ID was not preserved over deployed HTTPS."
            exit 1
          }
          curl --fail --silent --show-error "$base_url/.well-known/jwks.json" >/tmp/security-jwks.json
          jq -e '.keys | type == "array" and length > 0' /tmp/security-jwks.json >/dev/null || {
            echo "::error::Security JWKS does not contain an active signing key."
            exit 1
          }
          echo "SECURITY_LIVENESS=PASS"
          echo "SECURITY_CORRELATION_ID=PASS"
          echo "SECURITY_JWKS=PASS"

      - name: Record Security deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "source_commit=$DEPLOY_SHA"
          echo "image=${{ steps.image.outputs.image_ref }}"
          echo "railway_deployment=${{ steps.deployment.outputs.id }}"
          echo "security_only_deployment=PASS"
          echo "migrations=PASS"
          echo "readiness=PASS"
          echo "liveness=PASS"
          echo "jwks=PASS"
          echo "correlation_id=PASS"

  tenant-admin:
    name: DEV Tenant Administration
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation == 'tenant-admin' || inputs.operation == 'integration-bootstrap')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: security-dev-operation
      cancel-in-progress: false
    outputs:
      tenant_id: ${{ steps.tenant.outputs.tenant_id }}
      tenant_status: ${{ steps.tenant.outputs.tenant_status }}
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      TENANT_CODE: ${{ inputs.tenant_code }}
      TENANT_NAME: ${{ inputs.tenant_name }}
      ACTIVATE_AFTER_CREATE: ${{ inputs.activate_after_create }}
      CORRELATION_ID: dev-tenant-admin-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out exact validated revision
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Security runtime
        run: python -m pip install -e .

      - name: Create or reuse Tenant through existing SuperAdmin
        id: tenant
        shell: bash
        run: |
          set -euo pipefail
          raw_database_url="${MIGRATION_DATABASE_URL:-${DEV_DATABASE_URL:-}}"
          [ -n "$raw_database_url" ] || {
            echo "::error::MIGRATION_DATABASE_URL or DEV_DATABASE_URL is required."
            exit 1
          }
          echo "::add-mask::$raw_database_url"
          TENANT_ADMIN_DATABASE_URL="$raw_database_url" python - <<'PY'
          from __future__ import annotations

          import os
          from sqlalchemy import text

          from verigence_security.config import Settings
          from verigence_security.db.session import build_session_factory
          from verigence_security.services.platform_admin import PlatformTenantService

          tenant_code = os.environ["TENANT_CODE"].strip()
          tenant_name = os.environ["TENANT_NAME"].strip()
          correlation_id = os.environ["CORRELATION_ID"]
          activate = os.environ.get("ACTIVATE_AFTER_CREATE", "true").lower() == "true"

          if not tenant_code or not tenant_name:
              raise SystemExit("Tenant code and name must be non-blank")

          settings = Settings(database_url=os.environ["TENANT_ADMIN_DATABASE_URL"])
          factory = build_session_factory(settings)
          if factory is None:
              raise SystemExit("Security DEV database is not configured")

          with factory() as session:
              super_admin_rows = list(
                  session.execute(
                      text(
                          """
                          SELECT DISTINCT a.user_id,e.provider_subject
                          FROM security.platform_user_role_assignments a
                          JOIN security.security_principals p
                            ON p.principal_id=a.user_id AND p.status='ACTIVE'
                          JOIN security.users u
                            ON u.user_id=a.user_id AND u.status='ACTIVE'
                          JOIN security.external_identities e
                            ON e.user_id=a.user_id
                           AND e.provider='CLERK'
                           AND e.status='ACTIVE'
                          WHERE a.role_key='platform.super_admin'
                            AND a.status='ACTIVE'
                          ORDER BY a.user_id
                          """
                      )
                  ).mappings()
              )
              if len(super_admin_rows) != 1:
                  raise SystemExit(
                      "Expected exactly one ACTIVE Clerk-backed platform.super_admin; "
                      f"found {len(super_admin_rows)}"
                  )

              actor_user_id = str(super_admin_rows[0]["user_id"])
              existing = session.execute(
                  text(
                      """
                      SELECT tenant_id,tenant_code,tenant_name,status,
                             created_at_utc,updated_at_utc
                      FROM security.tenants
                      WHERE tenant_code=:tenant_code
                      FOR UPDATE
                      """
                  ),
                  {"tenant_code": tenant_code},
              ).mappings().first()

              service = PlatformTenantService(session)
              if existing is None:
                  tenant = service.create_tenant(
                      actor_user_id=actor_user_id,
                      tenant_code=tenant_code,
                      tenant_name=tenant_name,
                      correlation_id=correlation_id,
                  )
              else:
                  if str(existing["tenant_name"]) != tenant_name:
                      raise SystemExit(
                          f"Tenant code {tenant_code!r} exists with another name; refusing overwrite"
                      )
                  tenant = dict(existing)

              tenant_id = str(tenant["tenant_id"])
              current_status = str(tenant["status"])
              if activate:
                  if current_status == "CONFIGURING":
                      activated = service.activate_tenant(
                          actor_user_id=actor_user_id,
                          tenant_id=tenant_id,
                          correlation_id=correlation_id,
                      )
                      if activated is None:
                          raise SystemExit("Tenant disappeared before activation")
                      tenant = activated
                      current_status = str(tenant["status"])
                  elif current_status != "ACTIVE":
                      raise SystemExit(
                          f"Tenant {tenant_code} is {current_status}; refusing automatic activation"
                      )

              verified = session.execute(
                  text(
                      """
                      SELECT tenant_id,tenant_code,tenant_name,status
                      FROM security.tenants
                      WHERE tenant_id=:tenant_id
                      """
                  ),
                  {"tenant_id": tenant_id},
              ).mappings().one()
              if str(verified["tenant_code"]) != tenant_code or str(verified["tenant_name"]) != tenant_name:
                  raise SystemExit("Persisted Tenant identity does not match requested Tenant")
              if activate and str(verified["status"]) != "ACTIVE":
                  raise SystemExit("Tenant activation was requested but persisted status is not ACTIVE")

              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"tenant_id={tenant_id}\n")
                  handle.write(f"tenant_status={verified['status']}\n")

              print(
                  f"DEV_TENANT_ADMIN=PASS code={tenant_code} "
                  f"tenant_id={tenant_id} status={verified['status']}"
              )
          PY

  integration-prerequisites:
    name: DEV Integration Prerequisites
    needs:
      - quality
      - tenant-admin
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'integration-bootstrap' &&
      needs.quality.result == 'success' &&
      needs.tenant-admin.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: security-dev-operation
      cancel-in-progress: false
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      TARGET_TENANT_ID: ${{ needs.tenant-admin.outputs.tenant_id }}
      REQUESTED_TENANT_ID: ${{ inputs.tenant_id }}

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Security runtime
        run: python -m pip install -e .

      - name: Configure exact ACTIVE Tenant policy and verify DI catalogue
        shell: bash
        run: |
          set -euo pipefail
          [ "$TARGET_TENANT_ID" = "$REQUESTED_TENANT_ID" ] || {
            echo "::error::Created/reused Tenant UUID does not match requested bootstrap tenant_id."
            exit 1
          }
          raw="${MIGRATION_DATABASE_URL:-${DEV_DATABASE_URL:-}}"
          [ -n "$raw" ] || {
            echo "::error::Security DEV database is not configured."
            exit 1
          }
          case "$raw" in
            postgresql+psycopg://*) db="$raw" ;;
            postgresql+asyncpg://*) db="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) db="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) db="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo "::error::Security DEV database is not PostgreSQL."; exit 1 ;;
          esac
          echo "::add-mask::$db"
          DATABASE_URL="$db" python - <<'PY'
          from __future__ import annotations

          import os
          from datetime import UTC, datetime
          from uuid import UUID

          from sqlalchemy import create_engine, text

          tenant_id = str(UUID(os.environ["TARGET_TENANT_ID"]))
          approved = {
              "max_active_devices_per_user": 2,
              "max_geo_accuracy_meters": 100,
              "max_geo_age_seconds": 300,
              "geo_revalidation_interval_seconds": 300,
              "access_token_ttl_minutes": 10,
              "machine_token_ttl_minutes": 10,
              "session_idle_timeout_minutes": 30,
              "session_max_duration_minutes": 60,
              "vpn_detected_action": "DENY",
              "vpn_unknown_action": "FLAG",
              "configuration_version": 1,
          }
          now = datetime.now(UTC)
          engine = create_engine(os.environ["DATABASE_URL"], pool_pre_ping=True)

          with engine.begin() as conn:
              tenant = conn.execute(
                  text(
                      """
                      SELECT tenant_id,tenant_code,tenant_name,status
                      FROM security.tenants
                      WHERE tenant_id=:tenant_id
                      FOR UPDATE
                      """
                  ),
                  {"tenant_id": tenant_id},
              ).mappings().first()
              if tenant is None or tenant["status"] != "ACTIVE":
                  raise SystemExit("Bootstrap Tenant does not exist as ACTIVE")

              admins = conn.execute(
                  text(
                      """
                      SELECT DISTINCT a.user_id
                      FROM security.platform_user_role_assignments a
                      JOIN security.users u ON u.user_id=a.user_id AND u.status='ACTIVE'
                      JOIN security.security_principals p
                        ON p.principal_id=u.user_id AND p.status='ACTIVE'
                      WHERE a.role_key='platform.super_admin' AND a.status='ACTIVE'
                      """
                  )
              ).all()
              if len(admins) != 1:
                  raise SystemExit(
                      f"Expected exactly one ACTIVE platform.super_admin; found {len(admins)}"
                  )
              admin_user_id = str(admins[0][0])

              policy = conn.execute(
                  text(
                      """
                      SELECT max_active_devices_per_user,max_geo_accuracy_meters,max_geo_age_seconds,
                             geo_revalidation_interval_seconds,access_token_ttl_minutes,
                             machine_token_ttl_minutes,session_idle_timeout_minutes,
                             session_max_duration_minutes,vpn_detected_action,vpn_unknown_action,
                             configuration_version,status
                      FROM security.tenant_security_policies
                      WHERE tenant_id=:tenant_id
                      FOR UPDATE
                      """
                  ),
                  {"tenant_id": tenant_id},
              ).mappings().first()

              if policy is None:
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.tenant_security_policies
                          (tenant_id,max_active_devices_per_user,max_geo_accuracy_meters,max_geo_age_seconds,
                           geo_revalidation_interval_seconds,access_token_ttl_minutes,machine_token_ttl_minutes,
                           session_idle_timeout_minutes,session_max_duration_minutes,vpn_detected_action,
                           vpn_unknown_action,configuration_version,status,updated_by_user_id,updated_at_utc)
                          VALUES
                          (:tenant_id,:max_active_devices_per_user,:max_geo_accuracy_meters,:max_geo_age_seconds,
                           :geo_revalidation_interval_seconds,:access_token_ttl_minutes,:machine_token_ttl_minutes,
                           :session_idle_timeout_minutes,:session_max_duration_minutes,:vpn_detected_action,
                           :vpn_unknown_action,:configuration_version,'ACTIVE',:updated_by_user_id,:updated_at_utc)
                          """
                      ),
                      {
                          "tenant_id": tenant_id,
                          **approved,
                          "updated_by_user_id": admin_user_id,
                          "updated_at_utc": now,
                      },
                  )
              else:
                  observed = {key: policy[key] for key in approved}
                  if policy["status"] != "ACTIVE":
                      raise SystemExit(
                          f"Existing Tenant Security policy is {policy['status']}; refusing auto-activation"
                      )
                  if observed != approved:
                      raise SystemExit(
                          "Existing ACTIVE Tenant Security policy differs from approved DEV policy; "
                          "refusing overwrite"
                      )

              rows = conn.execute(
                  text(
                      """
                      SELECT permission_key,status,module_key,resource_key,action_key
                      FROM security.permissions
                      WHERE permission_key IN ('di.document.read','di.document.upload')
                      ORDER BY permission_key
                      """
                  )
              ).mappings().all()

          expected = {
              "di.document.read": ("ACTIVE", "di", "document", "read"),
              "di.document.upload": ("ACTIVE", "di", "document", "upload"),
          }
          observed = {
              str(row["permission_key"]): (
                  str(row["status"]),
                  str(row["module_key"]),
                  str(row["resource_key"]),
                  str(row["action_key"]),
              )
              for row in rows
          }
          if observed != expected:
              raise SystemExit(
                  "DI permission catalogue is not ready; deploy current main migrations before bootstrap"
              )
          print(f"DEV_INTEGRATION_PREREQUISITES=PASS tenant_id={tenant_id}")
          PY

  readiness-check:
    name: DEV Security Readiness Check
    needs:
      - quality
      - integration-prerequisites
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.quality.result == 'success' &&
      (
        inputs.operation == 'readiness-check' ||
        (inputs.operation == 'integration-bootstrap' && needs.integration-prerequisites.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: security-dev-operation
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Security runtime and Railway CLI
        run: |
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Link approved shared DEV project
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || {
            echo "::error::RAILWAY_API_TOKEN is not configured."
            exit 1
          }
          env -u RAILWAY_TOKEN railway link \
            --project "$PLATFORM_PROJECT_ID" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/railway-link.json
          env -u RAILWAY_TOKEN railway status --json >/tmp/railway-status.json
          [ "$(jq -r '.id // empty' /tmp/railway-status.json)" = "$PLATFORM_PROJECT_ID" ] || {
            echo "::error::Linked Railway project is not approved DEV."
            exit 1
          }

      - name: Verify runtime variables, DB, and signing key pair
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway variable list \
            --service "$SECURITY_SERVICE" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/security-vars.json
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.rsa import RSAPrivateKey, RSAPublicKey
          from sqlalchemy import create_engine, text

          values = json.loads(Path('/tmp/security-vars.json').read_text())
          required = {
              'DATABASE_URL',
              'CLERK_SECRET_KEY',
              'SECURITY_USER_ONBOARDING_KEY_ENCRYPTION_KEY',
              'SECURITY_KEY_ID',
              'SECURITY_PRIVATE_KEY_PEM',
              'SECURITY_PUBLIC_KEY_PEM',
          }
          missing = sorted(key for key in required if not values.get(key))
          if missing:
              raise SystemExit('Required Security runtime variables are missing: ' + ', '.join(missing))

          database_url = str(values['DATABASE_URL'])
          engine = create_engine(database_url, pool_pre_ping=True)
          with engine.connect() as connection:
              connection.execute(text('SELECT 1'))

          private_pem = str(values['SECURITY_PRIVATE_KEY_PEM']).replace('\\n', '\n')
          public_pem = str(values['SECURITY_PUBLIC_KEY_PEM']).replace('\\n', '\n')
          private_key = serialization.load_pem_private_key(private_pem.encode(), password=None)
          public_key = serialization.load_pem_public_key(public_pem.encode())
          if not isinstance(private_key, RSAPrivateKey) or not isinstance(public_key, RSAPublicKey):
              raise SystemExit('Configured Security signing keys are not RSA')
          if private_key.public_key().public_numbers() != public_key.public_numbers():
              raise SystemExit('Configured Security signing key pair does not match')

          print('SECURITY_RUNTIME_DATABASE=PASS')
          print('SECURITY_SIGNING_KEY_PAIR=PASS')
          PY

      - name: Resolve Security public domain and verify live endpoints
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_TOKEN:-}" ] || {
            echo "::error::RAILWAY_TOKEN is not configured."
            exit 1
          }
          token_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')"
          [ "$(printf '%s' "$token_response" | jq -r '.data.projectToken.projectId // empty')" = "$PLATFORM_PROJECT_ID" ] || {
            echo "::error::Railway Project Token is not scoped to approved DEV project."
            exit 1
          }
          services_json="$(env -u RAILWAY_TOKEN railway service list --json)"
          service_id="$(printf '%s' "$services_json" | jq -r --arg service "$SECURITY_SERVICE" \
            '[.[] | select(.name == $service)] | first | .id // empty')"
          [ -n "$service_id" ] || {
            echo "::error::Security service is missing."
            exit 1
          }

          query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { id domain } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" --arg service "$service_id" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' --data "$body")"
          domain="$(printf '%s' "$response" | jq -r '.data.domains.serviceDomains[0].domain // empty')"
          [ -n "$domain" ] || {
            echo "::error::Security DEV public domain is missing."
            exit 1
          }
          base="https://$domain"
          curl --fail --silent --show-error "$base/health/ready" >/tmp/ready.json
          curl --fail --silent --show-error "$base/health/live" >/tmp/live.json
          curl --fail --silent --show-error "$base/.well-known/jwks.json" >/tmp/jwks.json
          jq -e '.keys | type == "array" and length > 0' /tmp/jwks.json >/dev/null
          echo "SECURITY_READINESS=PASS"
          echo "SECURITY_LIVENESS=PASS"
          echo "SECURITY_JWKS=PASS"

  audit-core-bind:
    name: DEV Audit Core Bind and OAuth Verify
    needs:
      - quality
      - tenant-admin
      - integration-prerequisites
      - readiness-check
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.quality.result == 'success' &&
      (
        inputs.operation == 'audit-core-bind' ||
        (
          inputs.operation == 'integration-bootstrap' &&
          needs.tenant-admin.result == 'success' &&
          needs.integration-prerequisites.result == 'success' &&
          needs.readiness-check.result == 'success'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: security-dev-operation
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      INPUT_TENANT_ID: ${{ inputs.tenant_id }}

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Security runtime and Railway CLI
        run: |
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Link and verify shared DEV services
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || {
            echo "::error::RAILWAY_API_TOKEN is not configured."
            exit 1
          }
          env -u RAILWAY_TOKEN railway link \
            --project "$PLATFORM_PROJECT_ID" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/railway-link.json
          env -u RAILWAY_TOKEN railway status --json >/tmp/railway-status.json
          env -u RAILWAY_TOKEN railway service list --json >/tmp/railway-services.json
          [ "$(jq -r '.id // empty' /tmp/railway-status.json)" = "$PLATFORM_PROJECT_ID" ] || {
            echo "::error::Linked Railway project is not approved DEV."
            exit 1
          }
          names="$(jq -r '.[].name' /tmp/railway-services.json)"
          grep -Fxq "$SECURITY_SERVICE" <<<"$names"
          grep -Fxq "$AUDIT_SERVICE" <<<"$names"
          echo "SHARED_DEV_TARGET=PASS"

      - name: Read real Audit Core credential and verify approved digest
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway variable list \
            --service "$AUDIT_SERVICE" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/audit-vars.json
          client_id="$(jq -r '.SECURITY_CLIENT_ID // "audit-core"' /tmp/audit-vars.json)"
          [ "$client_id" = "$AUDIT_CORE_CLIENT_ID" ] || {
            echo "::error::Audit Core SECURITY_CLIENT_ID is not audit-core."
            exit 1
          }
          client_secret="$(jq -r '.SECURITY_CLIENT_SECRET // empty' /tmp/audit-vars.json)"
          [ -n "$client_secret" ] || {
            echo "::error::Audit Core SECURITY_CLIENT_SECRET is missing."
            exit 1
          }
          echo "::add-mask::$client_secret"
          digest="$(CLIENT_SECRET="$client_secret" python -c \
            'import hashlib,os; print(hashlib.sha256(os.environ["CLIENT_SECRET"].encode()).hexdigest())')"
          [ "$digest" = "$AUDIT_CORE_EXPECTED_SECRET_SHA256" ] || {
            echo "::error::Live Audit Core credential does not match approved PR #60 verifier."
            exit 1
          }
          echo "AUDIT_CORE_CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"
          echo "AUDIT_CORE_CLIENT_SECRET_SHA256=$digest" >> "$GITHUB_ENV"
          echo "AUDIT_CORE_CREDENTIAL_SOURCE=PASS"

      - name: Resolve Security DEV database and target Tenant
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-${DEV_DATABASE_URL:-}}"
          [ -n "$raw" ] || {
            echo "::error::Security DEV database is not configured."
            exit 1
          }
          case "$raw" in
            postgresql+psycopg://*) db="$raw" ;;
            postgresql+asyncpg://*) db="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) db="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) db="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo "::error::Security DEV database is not PostgreSQL."; exit 1 ;;
          esac
          echo "::add-mask::$db"
          echo "DATABASE_URL=$db" >> "$GITHUB_ENV"
          if [ "${{ inputs.operation }}" = "integration-bootstrap" ]; then
            expected="${{ needs.tenant-admin.outputs.tenant_id }}"
            [ "$INPUT_TENANT_ID" = "$expected" ] || {
              echo "::error::Bootstrap Tenant UUID changed between steps."
              exit 1
            }
          fi

      - name: Bind exact Audit Core principal, credential, Tenant scope, and DI grants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          from datetime import UTC, datetime
          from uuid import UUID, uuid4

          from sqlalchemy import create_engine, text

          tenant_id = str(UUID(os.environ["INPUT_TENANT_ID"]))
          required_permissions = {"di.document.read", "di.document.upload"}
          expected_hash = os.environ["AUDIT_CORE_CLIENT_SECRET_SHA256"]
          now = datetime.now(UTC)
          engine = create_engine(os.environ["DATABASE_URL"], pool_pre_ping=True)

          with engine.begin() as conn:
              tenant = conn.execute(
                  text(
                      """
                      SELECT t.tenant_id,t.tenant_code,t.tenant_name,t.status,p.status AS policy_status
                      FROM security.tenants t
                      JOIN security.tenant_security_policies p ON p.tenant_id=t.tenant_id
                      WHERE t.tenant_id=:tenant_id
                      FOR UPDATE
                      """
                  ),
                  {"tenant_id": tenant_id},
              ).mappings().first()
              if tenant is None or tenant["status"] != "ACTIVE" or tenant["policy_status"] != "ACTIVE":
                  raise SystemExit("Exact Audit Core Tenant must be ACTIVE with ACTIVE policy")

              admins = conn.execute(
                  text(
                      """
                      SELECT DISTINCT a.user_id
                      FROM security.platform_user_role_assignments a
                      JOIN security.users u ON u.user_id=a.user_id AND u.status='ACTIVE'
                      JOIN security.security_principals p
                        ON p.principal_id=u.user_id AND p.status='ACTIVE'
                      WHERE a.role_key='platform.super_admin' AND a.status='ACTIVE'
                      """
                  )
              ).all()
              if len(admins) != 1:
                  raise SystemExit(
                      f"Expected exactly one ACTIVE platform.super_admin; found {len(admins)}"
                  )
              admin_user_id = str(admins[0][0])

              permissions = {
                  str(row[0])
                  for row in conn.execute(
                      text(
                          """
                          SELECT permission_key FROM security.permissions
                          WHERE status='ACTIVE'
                            AND permission_key IN ('di.document.read','di.document.upload')
                          """
                      )
                  ).all()
              }
              if permissions != required_permissions:
                  raise SystemExit("Required ACTIVE Audit Core DI permissions are not present")

              existing = conn.execute(
                  text(
                      """
                      SELECT si.principal_id,p.actor_type,p.status
                      FROM security.service_integrations si
                      JOIN security.security_principals p ON p.principal_id=si.principal_id
                      WHERE si.integration_key='audit-core'
                      """
                  )
              ).mappings().first()

              if existing is None:
                  principal_id = str(uuid4())
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.security_principals
                          (principal_id,actor_type,principal_name,status,created_at_utc,updated_at_utc)
                          VALUES (:principal_id,'SERVICE_INTEGRATION','Audit Core','ACTIVE',:now,:now)
                          """
                      ),
                      {"principal_id": principal_id, "now": now},
                  )
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.service_integrations
                          (principal_id,integration_key,description,created_at_utc)
                          VALUES (:principal_id,'audit-core','Audit Core confidential OAuth client',:now)
                          """
                      ),
                      {"principal_id": principal_id, "now": now},
                  )
              else:
                  if existing["actor_type"] != "SERVICE_INTEGRATION" or existing["status"] != "ACTIVE":
                      raise SystemExit("Existing audit-core principal is not ACTIVE SERVICE_INTEGRATION")
                  principal_id = str(existing["principal_id"])

              credential = conn.execute(
                  text(
                      """
                      SELECT credential_id,principal_id,secret_hash,status
                      FROM security.principal_credentials
                      WHERE client_id='audit-core'
                      FOR UPDATE
                      """
                  )
              ).mappings().first()

              if credential is None:
                  credential_id = str(uuid4())
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.principal_credentials
                          (credential_id,principal_id,client_id,secret_hash,status,valid_from_utc,valid_to_utc,
                           created_by_user_id,created_at_utc,last_used_at_utc)
                          VALUES
                          (:credential_id,:principal_id,'audit-core',:secret_hash,'ACTIVE',:now,NULL,
                           :admin_user_id,:now,NULL)
                          """
                      ),
                      {
                          "credential_id": credential_id,
                          "principal_id": principal_id,
                          "secret_hash": expected_hash,
                          "admin_user_id": admin_user_id,
                          "now": now,
                      },
                  )
              else:
                  if str(credential["principal_id"]) != principal_id:
                      raise SystemExit("Existing audit-core client_id belongs to another principal")
                  if credential["status"] == "REVOKED":
                      raise SystemExit("Existing audit-core credential is REVOKED")
                  credential_id = str(credential["credential_id"])
                  if credential["secret_hash"] != expected_hash or credential["status"] != "ACTIVE":
                      conn.execute(
                          text(
                              """
                              UPDATE security.principal_credentials
                              SET secret_hash=:secret_hash,status='ACTIVE',valid_from_utc=:now,
                                  valid_to_utc=NULL,last_used_at_utc=NULL
                              WHERE credential_id=:credential_id
                              """
                          ),
                          {
                              "secret_hash": expected_hash,
                              "now": now,
                              "credential_id": credential_id,
                          },
                      )

              scopes = conn.execute(
                  text(
                      """
                      SELECT tenant_id FROM security.principal_tenant_scopes
                      WHERE principal_id=:principal_id AND status='ACTIVE'
                        AND (valid_to_utc IS NULL OR valid_to_utc>:now)
                      """
                  ),
                  {"principal_id": principal_id, "now": now},
              ).all()
              unexpected_scopes = {
                  str(row[0]) for row in scopes if str(row[0]) != tenant_id
              }
              if unexpected_scopes:
                  raise SystemExit(
                      "audit-core has unexpected ACTIVE Tenant scopes: "
                      + ",".join(sorted(unexpected_scopes))
                  )
              if not any(str(row[0]) == tenant_id for row in scopes):
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.principal_tenant_scopes
                          (scope_id,principal_id,tenant_id,status,valid_from_utc,valid_to_utc,created_at_utc)
                          VALUES (:scope_id,:principal_id,:tenant_id,'ACTIVE',:now,NULL,:now)
                          """
                      ),
                      {
                          "scope_id": str(uuid4()),
                          "principal_id": principal_id,
                          "tenant_id": tenant_id,
                          "now": now,
                      },
                  )

              grants = conn.execute(
                  text(
                      """
                      SELECT tenant_id,permission_key
                      FROM security.principal_permission_grants
                      WHERE principal_id=:principal_id AND status='ACTIVE'
                      """
                  ),
                  {"principal_id": principal_id},
              ).mappings().all()
              unexpected_grants = {
                  f"{row['tenant_id']}:{row['permission_key']}"
                  for row in grants
                  if str(row["tenant_id"]) != tenant_id
                  or str(row["permission_key"]) not in required_permissions
              }
              if unexpected_grants:
                  raise SystemExit(
                      "audit-core has unexpected ACTIVE grants: "
                      + ",".join(sorted(unexpected_grants))
                  )
              observed = {
                  str(row["permission_key"])
                  for row in grants
                  if str(row["tenant_id"]) == tenant_id
              }
              for permission in sorted(required_permissions - observed):
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.principal_permission_grants
                          (grant_id,principal_id,tenant_id,permission_key,status,granted_by_user_id,granted_at_utc)
                          VALUES (:grant_id,:principal_id,:tenant_id,:permission,'ACTIVE',:admin_user_id,:now)
                          """
                      ),
                      {
                          "grant_id": str(uuid4()),
                          "principal_id": principal_id,
                          "tenant_id": tenant_id,
                          "permission": permission,
                          "admin_user_id": admin_user_id,
                          "now": now,
                      },
                  )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"TARGET_TENANT_ID={tenant_id}\n")
              handle.write(f"AUDIT_CORE_PRINCIPAL_ID={principal_id}\n")
              handle.write(f"AUDIT_CORE_CREDENTIAL_ID={credential_id}\n")
          print(
              f"AUDIT_CORE_SECURITY_BINDING=PASS tenant_id={tenant_id} principal_id={principal_id}"
          )
          PY

      - name: Resolve deployed Security public domain
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_TOKEN:-}" ] || {
            echo "::error::RAILWAY_TOKEN is not configured."
            exit 1
          }
          service_id="$(jq -r --arg service "$SECURITY_SERVICE" \
            '[.[] | select(.name == $service)] | first | .id // empty' /tmp/railway-services.json)"
          [ -n "$service_id" ] || exit 1
          query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { id domain } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" --arg service "$service_id" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' --data "$body")"
          domain="$(printf '%s' "$response" | jq -r '.data.domains.serviceDomains[0].domain // empty')"
          [ -n "$domain" ] || {
            echo "::error::Security DEV public domain is missing."
            exit 1
          }
          echo "SECURITY_BASE_URL=https://$domain" >> "$GITHUB_ENV"
          curl --fail --silent --show-error "https://$domain/health/ready" >/tmp/ready.json
          echo "SECURITY_BIND_READINESS=PASS"

      - name: Prove real Audit Core client_credentials token and least privilege
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import secrets

          import httpx
          import jwt

          base = os.environ["SECURITY_BASE_URL"].rstrip("/")
          client_id = os.environ["AUDIT_CORE_CLIENT_ID"]
          secret = os.environ["AUDIT_CORE_CLIENT_SECRET"]
          tenant_id = os.environ["TARGET_TENANT_ID"]
          required = {"di.document.read", "di.document.upload"}

          with httpx.Client(timeout=20.0) as client:
              response = client.post(
                  base + "/oauth/token",
                  auth=(client_id, secret),
                  data={
                      "grant_type": "client_credentials",
                      "tenant_id": tenant_id,
                      "scope": "di.document.read di.document.upload",
                  },
              )
              if response.status_code != 200:
                  raise SystemExit(
                      f"Live Audit Core token issuance failed HTTP {response.status_code}"
                  )
              body = response.json()
              token = body.get("access_token")
              if not isinstance(token, str) or not token:
                  raise SystemExit("Live token response has no access_token")
              if body.get("token_type") != "Bearer":
                  raise SystemExit("Live token response has invalid token_type")
              if set(str(body.get("scope", "")).split()) != required:
                  raise SystemExit("Live token response scope is not exact approved DI grant set")

              jwks = jwt.PyJWKClient(base + "/.well-known/jwks.json")
              signing_key = jwks.get_signing_key_from_jwt(token)
              claims = jwt.decode(
                  token,
                  signing_key.key,
                  algorithms=["RS256"],
                  issuer="verigence-security",
                  audience="verigence-platform",
              )
              if claims.get("sub") != client_id:
                  raise SystemExit("Live SERVICE token subject is not audit-core")
              if claims.get("actor_type") != "SERVICE_INTEGRATION":
                  raise SystemExit("Live machine token actor_type is not SERVICE_INTEGRATION")
              if claims.get("tenant_id") != tenant_id:
                  raise SystemExit("Live machine token Tenant does not match bound Tenant")
              if set(claims.get("permissions", [])) != required:
                  raise SystemExit("Live machine token permissions are not exact approved DI grant set")
              if claims.get("roles") or claims.get("device_id") or claims.get("location_id"):
                  raise SystemExit("Live machine token contains USER-only claims")

              wrong = client.post(
                  base + "/oauth/token",
                  auth=(client_id, "wrong-" + secrets.token_urlsafe(18)),
                  data={
                      "grant_type": "client_credentials",
                      "tenant_id": tenant_id,
                      "scope": "di.document.read",
                  },
              )
              if wrong.status_code != 401 or wrong.json().get("error") != "invalid_client":
                  raise SystemExit("Wrong Audit Core credential did not fail as invalid_client")

              overgrant = client.post(
                  base + "/oauth/token",
                  auth=(client_id, secret),
                  data={
                      "grant_type": "client_credentials",
                      "tenant_id": tenant_id,
                      "scope": "di.verification.write",
                  },
              )
              if overgrant.status_code != 400 or overgrant.json().get("error") != "invalid_scope":
                  raise SystemExit("Unapproved Audit Core scope did not fail as invalid_scope")

          print("AUDIT_CORE_LIVE_SERVICE_TOKEN=PASS")
          print("AUDIT_CORE_LIVE_WRONG_SECRET_DENIAL=PASS")
          print("AUDIT_CORE_LIVE_OVERGRANT_DENIAL=PASS")
          PY

      - name: Verify persisted Security evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"], pool_pre_ping=True)
          with engine.connect() as conn:
              credential = conn.execute(
                  text(
                      """
                      SELECT last_used_at_utc,status
                      FROM security.principal_credentials
                      WHERE credential_id=:credential_id
                      """
                  ),
                  {"credential_id": os.environ["AUDIT_CORE_CREDENTIAL_ID"]},
              ).mappings().one()
              session = conn.execute(
                  text(
                      """
                      SELECT access_session_id,actor_type,tenant_id,principal_id,credential_id,status
                      FROM security.access_sessions
                      WHERE principal_id=:principal_id AND actor_type='SERVICE_INTEGRATION'
                      ORDER BY started_at_utc DESC
                      LIMIT 1
                      """
                  ),
                  {"principal_id": os.environ["AUDIT_CORE_PRINCIPAL_ID"]},
              ).mappings().one()
              evaluation = conn.execute(
                  text(
                      """
                      SELECT decision,decision_reason_code,actor_type,tenant_id,principal_id
                      FROM security.access_context_evaluations
                      WHERE access_session_id=:session_id
                      ORDER BY evaluated_at_utc DESC
                      LIMIT 1
                      """
                  ),
                  {"session_id": session["access_session_id"]},
              ).mappings().one()

          assert credential["status"] == "ACTIVE"
          assert credential["last_used_at_utc"] is not None
          assert session["actor_type"] == "SERVICE_INTEGRATION"
          assert str(session["tenant_id"]) == os.environ["TARGET_TENANT_ID"]
          assert str(session["principal_id"]) == os.environ["AUDIT_CORE_PRINCIPAL_ID"]
          assert str(session["credential_id"]) == os.environ["AUDIT_CORE_CREDENTIAL_ID"]
          assert session["status"] == "ACTIVE"
          assert evaluation["decision"] == "ALLOW"
          assert evaluation["decision_reason_code"] == "MACHINE_ACCESS_GRANTED"
          assert evaluation["actor_type"] == "SERVICE_INTEGRATION"
          assert str(evaluation["tenant_id"]) == os.environ["TARGET_TENANT_ID"]
          assert str(evaluation["principal_id"]) == os.environ["AUDIT_CORE_PRINCIPAL_ID"]
          print("AUDIT_CORE_LIVE_SECURITY_EVIDENCE=PASS")
          PY

  integration-bootstrap:
    name: DEV Integration Bootstrap
    needs:
      - quality
      - tenant-admin
      - integration-prerequisites
      - readiness-check
      - audit-core-bind
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'integration-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require complete bootstrap chain
        shell: bash
        env:
          QUALITY: ${{ needs.quality.result }}
          TENANT_ADMIN: ${{ needs.tenant-admin.result }}
          PREREQUISITES: ${{ needs.integration-prerequisites.result }}
          READINESS: ${{ needs.readiness-check.result }}
          AUDIT_CORE: ${{ needs.audit-core-bind.result }}
        run: |
          set -euo pipefail
          [ "$QUALITY" = "success" ]
          [ "$TENANT_ADMIN" = "success" ]
          [ "$PREREQUISITES" = "success" ]
          [ "$READINESS" = "success" ]
          [ "$AUDIT_CORE" = "success" ]
          echo "DEV_INTEGRATION_BOOTSTRAP=PASS"
          echo "tenant_id=${{ needs.tenant-admin.outputs.tenant_id }}"
          echo "tenant_status=${{ needs.tenant-admin.outputs.tenant_status }}"
