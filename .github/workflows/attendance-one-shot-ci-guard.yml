name: Attendance one-shot CI guard patch

on:
  push:
    branches:
      - feature/attendance-phase1-service

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/attendance-phase1-service
          fetch-depth: 0

      - name: Replace exact pre-Attendance role-default count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = '[ "$v2_default_count" = "157" ] || {'
          new = '[ "$v2_default_count" = "177" ] || {'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old count guard, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/ci.yml

      - name: Commit only the guarded CI correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml
          test "$(git diff --cached --name-only)" = '.github/workflows/ci.yml'
          git commit -m 'ci: account for attendance operating-role defaults'
          git push origin HEAD:feature/attendance-phase1-service
