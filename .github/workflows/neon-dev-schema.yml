name: Neon DEV Security Schema

on:
  push:
    branches:
      - feature/neon-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-dev-security-schema
  cancel-in-progress: false

jobs:
  validate-security-baseline:
    name: Validate approved Security v1.3 schema and repository behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECURITY_MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SHARED_DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve configured Neon migration secret
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${SECURITY_MIGRATION_DATABASE_URL:-}" ]; then
            resolved="$SECURITY_MIGRATION_DATABASE_URL"
            source_name="MIGRATION_DATABASE_URL"
          elif [ -n "${SHARED_DEV_DATABASE_URL:-}" ]; then
            resolved="$SHARED_DEV_DATABASE_URL"
            source_name="DEV_DATABASE_URL"
          else
            echo "::error::Neither MIGRATION_DATABASE_URL nor DEV_DATABASE_URL is configured or available to this repository."
            exit 1
          fi

          case "$resolved" in
            postgresql+asyncpg://*) resolved="postgresql://${resolved#postgresql+asyncpg://}" ;;
            postgresql+psycopg://*) resolved="postgresql://${resolved#postgresql+psycopg://}" ;;
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::Configured DEV database secret is not a supported PostgreSQL URL."
              exit 1
              ;;
          esac

          echo "::add-mask::$resolved"
          echo "MIGRATION_DATABASE_URL=$resolved" >> "$GITHUB_ENV"
          echo "Using configured Neon DEV connection from secret: $source_name"

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verify approved migration digest
        shell: bash
        run: |
          set -euo pipefail
          expected="175d10780659c54f402980b08ea209cd34139c9ad28df6c4a758d521c7ca606d"
          actual="$(sha256sum migrations/0001_security_baseline_v1.3.sql | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Approved Security v1.3 migration digest mismatch. Refusing database change."
            exit 1
          fi
          echo "Approved Security v1.3 migration digest verified."

      - name: Determine whether approved baseline must be applied
        shell: bash
        run: |
          set -euo pipefail
          expected_tables="$(grep -Ec '^CREATE TABLE security\.' migrations/0001_security_baseline_v1.3.sql)"
          actual_tables="$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'security'
              AND c.relkind IN ('r','p');
          ")"

          if [ "$actual_tables" = "0" ]; then
            echo "APPLY_SECURITY_BASELINE=true" >> "$GITHUB_ENV"
            echo "Security schema is absent or empty; approved baseline will be applied."
          elif [ "$actual_tables" = "$expected_tables" ]; then
            echo "APPLY_SECURITY_BASELINE=false" >> "$GITHUB_ENV"
            echo "Security schema already has the expected table count; validating exact structure without reapplying migration."
          else
            echo "::error::Security schema is partially populated or drifted: expected $expected_tables tables, found $actual_tables. Refusing automatic change."
            exit 1
          fi

      - name: Apply approved v1.3 migration transactionally
        if: env.APPLY_SECURITY_BASELINE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          psql "$MIGRATION_DATABASE_URL" \
            -X \
            -v ON_ERROR_STOP=1 \
            --single-transaction \
            -f migrations/0001_security_baseline_v1.3.sql

      - name: Validate Security schema objects and constraints
        shell: bash
        run: |
          set -euo pipefail

          schema_exists="$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*) FROM pg_namespace WHERE nspname = 'security';
          ")"
          if [ "$schema_exists" != "1" ]; then
            echo "::error::security schema does not exist."
            exit 1
          fi

          grep -E '^CREATE TABLE security\.' migrations/0001_security_baseline_v1.3.sql \
            | sed -E 's/^CREATE TABLE security\.([A-Za-z0-9_]+).*/\1/' \
            | sort > /tmp/expected_security_tables.txt
          psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT tablename FROM pg_tables WHERE schemaname='security' ORDER BY tablename;
          " > /tmp/actual_security_tables.txt
          if ! diff -u /tmp/expected_security_tables.txt /tmp/actual_security_tables.txt; then
            echo "::error::Security table-name set does not match approved v1.3 migration."
            exit 1
          fi

          grep -E '^CREATE (UNIQUE )?INDEX ' migrations/0001_security_baseline_v1.3.sql \
            | sed -E 's/^CREATE (UNIQUE )?INDEX ([A-Za-z0-9_]+).*/\2/' \
            | sort > /tmp/expected_security_indexes.txt
          psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT indexname FROM pg_indexes WHERE schemaname='security' ORDER BY indexname;
          " > /tmp/actual_security_indexes.txt
          while IFS= read -r expected_index; do
            if ! grep -Fxq "$expected_index" /tmp/actual_security_indexes.txt; then
              echo "::error::Expected Security index missing: $expected_index"
              exit 1
            fi
          done < /tmp/expected_security_indexes.txt

          expected_fk="$(grep -Eo 'REFERENCES security\.' migrations/0001_security_baseline_v1.3.sql | wc -l | tr -d ' ')"
          actual_fk="$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM pg_constraint c
            JOIN pg_namespace n ON n.oid=c.connamespace
            WHERE n.nspname='security' AND c.contype='f';
          ")"
          if [ "$actual_fk" != "$expected_fk" ]; then
            echo "::error::Security foreign-key count mismatch: expected $expected_fk, found $actual_fk."
            exit 1
          fi

          expected_checks="$(grep -Eo 'CHECK \(' migrations/0001_security_baseline_v1.3.sql | wc -l | tr -d ' ')"
          actual_checks="$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM pg_constraint c
            JOIN pg_namespace n ON n.oid=c.connamespace
            WHERE n.nspname='security' AND c.contype='c';
          ")"
          if [ "$actual_checks" != "$expected_checks" ]; then
            echo "::error::Security CHECK-constraint count mismatch: expected $expected_checks, found $actual_checks."
            exit 1
          fi

          table_count="$(wc -l < /tmp/actual_security_tables.txt | tr -d ' ')"
          explicit_index_count="$(wc -l < /tmp/expected_security_indexes.txt | tr -d ' ')"
          echo "Neon DEV Security structure validated: schema=security tables=$table_count explicit_indexes=$explicit_index_count foreign_keys=$actual_fk checks=$actual_checks."

      - name: Install project and test tooling
        shell: bash
        run: python -m pip install -e '.[dev]'

      - name: Run real Neon repository integration tests
        shell: bash
        env:
          TEST_DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
        run: pytest -q tests/integration/test_neon_repository.py
