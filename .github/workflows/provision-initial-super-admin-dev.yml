name: Provision Initial Super Admin DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      clerk_user_id:
        description: Immutable Clerk user_ ID for the initial DEV Platform Super Admin
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  provision:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[provision-initial-super-admin]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DEFAULT_CLERK_USER_ID: user_3HtNkIWp32cD9HC7KzDbZdJkr2h

    steps:
      - name: Wait for successful Security CI on exact commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            response="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20")"
            ci_run="$(printf '%s' "$response" | jq -c \
              '[.workflow_runs[] | select(.name == "Security CI")] | first // empty')"
            if [ -z "$ci_run" ]; then
              sleep 5
              continue
            fi
            status="$(printf '%s' "$ci_run" | jq -r '.status')"
            conclusion="$(printf '%s' "$ci_run" | jq -r '.conclusion // ""')"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || {
                echo "::error::Security CI did not pass for exact provisioning commit."
                exit 1
              }
              exit 0
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for Security CI."
          exit 1

      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Security package
        run: python -m pip install .

      - name: Resolve DEV database and selected Clerk user
        id: config
        shell: bash
        env:
          INPUT_CLERK_USER_ID: ${{ inputs.clerk_user_id }}
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-${DEV_DATABASE_URL:-}}"
          [ -n "$raw" ] || { echo "::error::DEV database URL is not configured."; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) sqlalchemy_url="$raw" ;;
            postgresql+asyncpg://*) sqlalchemy_url="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) sqlalchemy_url="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) sqlalchemy_url="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo "::error::Configured DEV database is not PostgreSQL."; exit 1 ;;
          esac
          clerk_user_id="${INPUT_CLERK_USER_ID:-$DEFAULT_CLERK_USER_ID}"
          case "$clerk_user_id" in
            user_*) ;;
            *) echo "::error::Initial administrator must use an immutable Clerk user_ ID."; exit 1 ;;
          esac
          echo "::add-mask::$sqlalchemy_url"
          echo "DATABASE_URL=$sqlalchemy_url" >> "$GITHUB_ENV"
          echo "TARGET_CLERK_USER_ID=$clerk_user_id" >> "$GITHUB_ENV"

      - name: Provision initial Platform Super Admin
        shell: bash
        run: |
          set -euo pipefail
          SECURITY_INITIAL_SUPER_ADMIN_CLERK_USER_ID="$TARGET_CLERK_USER_ID" \
          SECURITY_INITIAL_SUPER_ADMIN_DISPLAY_NAME="superadmin" \
          python -m verigence_security.provision_initial_super_admin

      - name: Verify Security binding and full authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"], pool_pre_ping=True)
          subject = os.environ["TARGET_CLERK_USER_ID"]
          with engine.connect() as conn:
              row = conn.execute(
                  text(
                      """
                      SELECT e.user_id,e.status AS identity_status,u.status AS user_status,
                             p.status AS principal_status,a.status AS role_status
                      FROM security.external_identities e
                      JOIN security.users u ON u.user_id=e.user_id
                      JOIN security.security_principals p ON p.principal_id=e.user_id
                      JOIN security.platform_user_role_assignments a ON a.user_id=e.user_id
                      WHERE e.provider='CLERK' AND e.provider_subject=:subject
                        AND a.role_key='platform.super_admin'
                      """
                  ),
                  {"subject": subject},
              ).mappings().one()
              missing = conn.execute(
                  text(
                      """
                      SELECT count(*)
                      FROM security.permissions p
                      WHERE p.status='ACTIVE'
                        AND NOT EXISTS (
                          SELECT 1 FROM security.platform_role_permissions rp
                          WHERE rp.role_key='platform.super_admin'
                            AND rp.permission_key=p.permission_key
                        )
                      """
                  )
              ).scalar_one()
          assert row["identity_status"] == "ACTIVE"
          assert row["user_status"] == "ACTIVE"
          assert row["principal_status"] == "ACTIVE"
          assert row["role_status"] == "ACTIVE"
          assert int(missing) == 0
          print(f"Initial Platform Super Admin verified; security_user_id={row['user_id']}")
          PY
