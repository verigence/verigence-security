name: Railway DEV Runtime Secret Preflight

on:
  push:
    branches:
      - feature/railway-dev-runtime-config

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - name: Classify existing Neon secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          def classify(name: str) -> None:
              value = os.getenv(name, "")
              if not value:
                  print(f"{name}: absent")
                  return
              normalized = value.replace("postgresql+psycopg://", "postgresql://", 1).replace("postgresql+asyncpg://", "postgresql://", 1)
              parsed = urlparse(normalized)
              host = parsed.hostname or ""
              pooled = "-pooler" in host
              ssl_required = "sslmode=require" in (parsed.query or "")
              print(f"{name}: present pooled={str(pooled).lower()} sslmode_require={str(ssl_required).lower()} scheme={parsed.scheme}")

          classify("DEV_DATABASE_URL")
          classify("MIGRATION_DATABASE_URL")
          PY
