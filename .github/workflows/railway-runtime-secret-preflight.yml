name: Railway DEV Runtime Secret Preflight

on:
  push:
    branches:
      - feature/railway-dev-runtime-config

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - name: Classify existing Neon secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          def classify(name: str) -> None:
              value = os.getenv(name, "")
              if not value:
                  print(f"{name}: absent")
                  return
              normalized = value.replace("postgresql+psycopg://", "postgresql://", 1).replace("postgresql+asyncpg://", "postgresql://", 1)
              parsed = urlparse(normalized)
              host = parsed.hostname or ""
              pooled = "-pooler" in host
              ssl_required = "sslmode=require" in (parsed.query or "")
              print(f"{name}: present pooled={str(pooled).lower()} sslmode_require={str(ssl_required).lower()} scheme={parsed.scheme}")

          classify("DEV_DATABASE_URL")
          classify("MIGRATION_DATABASE_URL")
          PY

      - name: Derive Neon pooled runtime URL from approved migration connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MIGRATION_DATABASE_URL:-}" ]; then
            echo "::error::MIGRATION_DATABASE_URL is required to derive the pooled runtime endpoint."
            exit 1
          fi

          pooled_url="$(python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          raw = os.environ["MIGRATION_DATABASE_URL"]
          raw = raw.replace("postgresql+psycopg://", "postgresql://", 1).replace("postgresql+asyncpg://", "postgresql://", 1)
          parts = urlsplit(raw)
          host = parts.hostname or ""
          if not host:
              raise SystemExit("missing Neon hostname")
          if "-pooler" not in host:
              first, sep, rest = host.partition(".")
              pooled_host = f"{first}-pooler{sep}{rest}" if sep else f"{first}-pooler"
              netloc = parts.netloc.replace(host, pooled_host, 1)
          else:
              netloc = parts.netloc
          print(urlunsplit((parts.scheme, netloc, parts.path, parts.query, parts.fragment)))
          PY
          )"

          echo "::add-mask::$pooled_url"
          echo "POOLED_DATABASE_URL=$pooled_url" >> "$GITHUB_ENV"
          echo "Derived Neon pooled runtime URL without exposing credentials or hostname."

      - name: Validate pooled Neon runtime connection
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          result="$(psql "$POOLED_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc 'SELECT 1;')"
          if [ "$result" != "1" ]; then
            echo "::error::Derived pooled Neon runtime connection did not return SELECT 1."
            exit 1
          fi
          echo "Derived pooled Neon runtime connection validated with SELECT 1."
