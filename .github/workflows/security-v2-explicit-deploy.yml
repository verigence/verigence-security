name: Security v2 Explicit DEV Deploy

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/security-v2-explicit-deploy.yml

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  dispatch-and-wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark deployment pending
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=security-v2-cicd \
            -f description='Running exact-head Security v2 CI, DB migrations and Railway DEV deploy' >/dev/null

      - name: Dispatch canonical Security CI/CD deploy-dev operation
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref dev \
            -f operation=deploy-dev \
            -f tenant_code=test-project \
            -f tenant_name=TestProject \
            -f tenant_id=9de3af49-260f-4b15-8263-07c93dcc04d2 \
            -f activate_after_create=true

      - name: Resolve dispatched exact-head run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch dev --event workflow_dispatch --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha == env.GITHUB_SHA) | .databaseId' | head -n1)"
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo 'Could not resolve dispatched exact-head CI/CD run'; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=security-v2-cicd \
            -f description="Canonical deploy run $run_id is in progress" \
            -f target_url="$run_url" >/dev/null

      - name: Wait for canonical CI/CD result
        shell: bash
        run: gh run watch "${{ steps.resolve.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Mark deployment success
        if: success()
        run: |
          run_id='${{ steps.resolve.outputs.run_id }}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=security-v2-cicd \
            -f description="Security v2 Railway DEV deploy passed in run $run_id" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null

      - name: Mark deployment failure
        if: failure()
        run: |
          run_id='${{ steps.resolve.outputs.run_id }}'
          target=''
          [ -n "$run_id" ] && target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          if [ -n "$target" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure -f context=security-v2-cicd \
              -f description="Security v2 canonical deploy failed in run $run_id" \
              -f target_url="$target" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure -f context=security-v2-cicd \
              -f description='Security v2 deploy dispatch/resolve failed before a run id was available' >/dev/null
          fi
