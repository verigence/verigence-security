name: Security v2 Reconciliation Probe

on:
  push:
    branches: [dev]
    paths: [.github/workflows/security-v2-reconciliation-probe.yml]

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Publish sanitized guard counts
        shell: bash
        run: |
          set -Eeuo pipefail
          target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$1" -f context=security-v2-reconciliation-probe \
              -f description="$2" -f target_url="$target" >/dev/null
          }
          trap 'post failure "Security v2 reconciliation probe failed"' ERR
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || exit 1
          case "$raw" in
            postgresql+psycopg://*) db="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) db="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) db="$raw" ;;
            *) exit 1 ;;
          esac
          echo "::add-mask::$db"
          psql "$db" -X -v ON_ERROR_STOP=1 -Atc "
            WITH
            g1 AS (
              SELECT count(*) c FROM (
                SELECT ura.user_id,ura.tenant_id
                FROM security.user_role_assignments ura
                JOIN security.roles r ON r.tenant_id=ura.tenant_id AND r.role_id=ura.role_id
                WHERE ura.status='ACTIVE' AND r.status='ACTIVE'
                  AND r.role_key IN ('PC','TL','PM','CRM','Executive')
                GROUP BY ura.user_id,ura.tenant_id HAVING count(*)>1
              ) q
            ),
            g2 AS (
              SELECT count(*) c
              FROM security.user_role_assignments ura
              JOIN security.roles r ON r.tenant_id=ura.tenant_id AND r.role_id=ura.role_id
              WHERE ura.status='ACTIVE' AND r.status='ACTIVE'
                AND r.role_key NOT IN ('PC','TL','PM','CRM','Executive')
            ),
            g3 AS (
              SELECT count(*) c FROM (
                SELECT DISTINCT gm.user_id,gm.tenant_id,gra.role_id
                FROM security.group_memberships gm
                JOIN security.groups g ON g.tenant_id=gm.tenant_id AND g.group_id=gm.group_id AND g.status='ACTIVE'
                JOIN security.group_role_assignments gra ON gra.tenant_id=g.tenant_id AND gra.group_id=g.group_id AND gra.status='ACTIVE'
                WHERE gm.status='ACTIVE'
                  AND NOT EXISTS (
                    SELECT 1 FROM security.user_role_assignments ura
                    WHERE ura.tenant_id=gm.tenant_id AND ura.user_id=gm.user_id
                      AND ura.role_id=gra.role_id AND ura.status='ACTIVE'
                  )
              ) q
            ),
            g4 AS (
              SELECT count(*) c FROM (
                SELECT ura.tenant_id
                FROM security.user_role_assignments ura
                JOIN security.roles r ON r.tenant_id=ura.tenant_id AND r.role_id=ura.role_id
                WHERE ura.status='ACTIVE' AND r.status='ACTIVE' AND r.role_key='PM'
                GROUP BY ura.tenant_id HAVING count(DISTINCT ura.user_id)>1
              ) q
            ),
            g5 AS (
              SELECT count(*) c FROM security.platform_user_role_assignments
              WHERE status='ACTIVE' AND role_key<>'platform.super_admin'
            ),
            g6 AS (
              SELECT count(*) c FROM security.users
              WHERE status NOT IN ('PENDING','REJECTED','ACTIVE','SUSPENDED','DISABLED')
            ),
            g7 AS (
              SELECT count(*) c
              FROM security.user_role_assignments ura
              JOIN security.roles r ON r.tenant_id=ura.tenant_id AND r.role_id=ura.role_id
              JOIN security.user_admin_role_assignments a ON a.user_id=ura.user_id AND a.status='ACTIVE'
              WHERE ura.status='ACTIVE' AND r.status='ACTIVE'
                AND r.role_key IN ('PC','TL','PM','CRM','Executive')
            ),
            g8 AS (
              SELECT count(*) c
              FROM security.user_role_assignments ura
              JOIN security.roles r ON r.tenant_id=ura.tenant_id AND r.role_id=ura.role_id
              JOIN security.user_tenant_operating_roles v2 ON v2.user_id=ura.user_id AND v2.tenant_id=ura.tenant_id AND v2.status='ACTIVE'
              WHERE ura.status='ACTIVE' AND r.status='ACTIVE'
                AND r.role_key IN ('PC','TL','PM','CRM','Executive') AND v2.role_key<>r.role_key
            ),
            g9 AS (
              SELECT count(*) c
              FROM security.role_permissions rp
              JOIN security.roles r ON r.tenant_id=rp.tenant_id AND r.role_id=rp.role_id
              JOIN security.permissions p ON p.permission_key=rp.permission_key
              WHERE r.status='ACTIVE' AND r.role_key IN ('PC','TL','PM','CRM','Executive') AND p.status<>'ACTIVE'
            ),
            fixed_roles(role_key) AS (VALUES ('PC'),('TL'),('PM'),('CRM'),('Executive')),
            legacy_roles AS (
              SELECT tenant_id,role_key,role_id FROM security.roles
              WHERE status='ACTIVE' AND role_key IN ('PC','TL','PM','CRM','Executive')
            ),
            expected AS (
              SELECT lr.tenant_id,lr.role_key,rp.permission_key
              FROM legacy_roles lr JOIN security.role_permissions rp ON rp.tenant_id=lr.tenant_id AND rp.role_id=lr.role_id
              UNION ALL
              SELECT t.tenant_id,fr.role_key,d.permission_key
              FROM security.tenants t CROSS JOIN fixed_roles fr
              JOIN security.platform_role_permission_defaults d ON d.role_key=fr.role_key AND d.status='ACTIVE'
              WHERE NOT EXISTS (SELECT 1 FROM legacy_roles lr WHERE lr.tenant_id=t.tenant_id AND lr.role_key=fr.role_key)
            ),
            existing_pairs AS (
              SELECT DISTINCT tenant_id,role_key FROM security.tenant_role_permissions
              WHERE role_key IN ('PC','TL','PM','CRM','Executive')
            ),
            diff AS (
              SELECT ep.tenant_id,ep.role_key FROM existing_pairs ep
              WHERE EXISTS ((SELECT permission_key FROM security.tenant_role_permissions WHERE tenant_id=ep.tenant_id AND role_key=ep.role_key)
                            EXCEPT (SELECT permission_key FROM expected WHERE tenant_id=ep.tenant_id AND role_key=ep.role_key))
                 OR EXISTS ((SELECT permission_key FROM expected WHERE tenant_id=ep.tenant_id AND role_key=ep.role_key)
                            EXCEPT (SELECT permission_key FROM security.tenant_role_permissions WHERE tenant_id=ep.tenant_id AND role_key=ep.role_key))
            ),
            gb AS (SELECT count(*) c FROM diff),
            sa AS (SELECT count(*) c FROM security.user_admin_role_assignments WHERE role_key='SuperAdmin' AND scope_type='PLATFORM' AND status='ACTIVE')
            SELECT 'g1='||g1.c||',g2='||g2.c||',g3='||g3.c||',g4='||g4.c||',g5='||g5.c||',g6='||g6.c||',g7='||g7.c||',g8='||g8.c||',g9='||g9.c||',bundles='||gb.c||',sa='||sa.c
            FROM g1,g2,g3,g4,g5,g6,g7,g8,g9,gb,sa;
          " | tee /tmp/guard-counts.txt
          counts="$(cat /tmp/guard-counts.txt)"
          post success "$counts"
          trap - ERR
