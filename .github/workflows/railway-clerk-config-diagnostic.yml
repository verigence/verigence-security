name: Railway Clerk Config Diagnostic

on:
  push:
    branches:
      - test/live-user-onboarding-e2e-20260814

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: a6808842-2e90-44f8-9172-63a905b24b5c
      RAILWAY_ENVIRONMENT_ID: 09e12bb5-9781-4b01-974b-fde54d01e37c
      RAILWAY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1

    steps:
      - name: Compare variable-key visibility by token scope
        shell: bash
        run: |
          set -euo pipefail
          query='query variables($projectId: String!, $environmentId: String!, $serviceId: String) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }'
          vars="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$vars" '{query:$query,variables:$variables}')"

          workspace_response="$(curl --fail-with-body --silent --show-error --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          project_response="$(curl --fail-with-body --silent --show-error --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"

          [ "$(printf '%s' "$workspace_response" | jq -r 'has("errors")')" = "false" ]
          [ "$(printf '%s' "$project_response" | jq -r 'has("errors")')" = "false" ]

          ws_has="$(printf '%s' "$workspace_response" | jq -r '.data.variables | has("CLERK_SECRET_KEY")')"
          project_has="$(printf '%s' "$project_response" | jq -r '.data.variables | has("CLERK_SECRET_KEY")')"
          ws_count="$(printf '%s' "$workspace_response" | jq -r '.data.variables | keys | length')"
          project_count="$(printf '%s' "$project_response" | jq -r '.data.variables | keys | length')"

          echo "WORKSPACE_TOKEN_VARIABLE_COUNT=$ws_count"
          echo "WORKSPACE_TOKEN_HAS_CLERK=$ws_has"
          echo "PROJECT_TOKEN_VARIABLE_COUNT=$project_count"
          echo "PROJECT_TOKEN_HAS_CLERK=$project_has"

          echo 'Workspace-visible relevant keys:'
          printf '%s' "$workspace_response" | jq -r '.data.variables | keys[]' | grep -E '^(APP_|CLERK_|DATABASE_URL|DEV_MOCK_)' || true
          echo 'Project-token-visible relevant keys:'
          printf '%s' "$project_response" | jq -r '.data.variables | keys[]' | grep -E '^(APP_|CLERK_|DATABASE_URL|DEV_MOCK_)' || true

          if [ "$project_has" != "true" ] && [ "$ws_has" != "true" ]; then
            echo '::error::Neither token sees CLERK_SECRET_KEY on the queried service/environment.'
            exit 1
          fi

      - name: Verify deployed endpoint no longer reports missing Clerk lifecycle configuration
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/body --write-out '%{http_code}' \
            -X POST 'https://verigence-security-dev.up.railway.app/security/v1/onboarding/users' \
            -H 'Content-Type: application/json' \
            -H 'X-Onboarding-Key: VGN-PROBE845' \
            --data '{"firstName":"testUser","lastName":"Probe","email":"gigsinopensource+verigence-config-probe2@gmail.com","mobile":"+919876543218","password":"ProbeOnly9!NotCreated"}')"
          echo "RUNTIME_HTTP_STATUS=$code"
          if grep -q 'Clerk lifecycle integration is not configured' /tmp/body; then
            echo '::error::Running deployment still lacks Clerk configuration.'
            exit 1
          fi
          echo 'Runtime no longer reports missing Clerk lifecycle configuration.'
