name: Railway Clerk Config Diagnostic

on:
  push:
    branches:
      - test/live-user-onboarding-e2e-20260814

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: a6808842-2e90-44f8-9172-63a905b24b5c
      RAILWAY_ENVIRONMENT_ID: 09e12bb5-9781-4b01-974b-fde54d01e37c
      RAILWAY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1
    steps:
      - name: Print relevant Railway variable names only
        shell: bash
        run: |
          set -euo pipefail
          query='query variables($projectId: String!, $environmentId: String!, $serviceId: String) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }'
          vars="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$vars" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || { printf '%s\n' "$response" | jq -c '.errors'; exit 1; }
          printf '%s\n' "$response" | jq -r '.data.variables | keys[]' | grep -E '^(CLERK|SECURITY_USER_ONBOARDING|DATABASE)' || true
