name: Security v2 SuperAdmin Reconcile

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/security-v2-superadmin-reconcile.yml

permissions:
  contents: read
  statuses: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Security runtime
        run: python -m pip install -e .
      - name: Reconcile the one approved SuperAdmin identity
        shell: bash
        run: |
          set -Eeuo pipefail
          context='security-v2-superadmin-reconcile'
          target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$1" -f context="$context" -f description="$2" -f target_url="$target" >/dev/null
          }
          trap 'post failure "Approved SuperAdmin reconciliation failed closed"' ERR
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || exit 1
          echo "::add-mask::$raw"
          SECURITY_RECONCILE_DATABASE_URL="$raw" python - <<'PY'
          from __future__ import annotations

          import os
          from sqlalchemy import text

          from verigence_security.config import Settings
          from verigence_security.db.session import build_session_factory
          from verigence_security.services.initial_super_admin import (
              InitialSuperAdminProvisioningService,
              PHASE1_SUPER_ADMIN_CLERK_USER_ID,
          )

          raw = os.environ["SECURITY_RECONCILE_DATABASE_URL"]
          settings = Settings(database_url=raw)
          factory = build_session_factory(settings)
          if factory is None:
              raise SystemExit("Security DEV database is not configured")

          with factory() as session:
              session.execute(text("SELECT pg_advisory_xact_lock(hashtext('security.v2.superadmin.handover'))"))

              approved = session.execute(
                  text("""
                      SELECT user_id
                      FROM security.external_identities
                      WHERE provider='CLERK'
                        AND provider_subject=:subject
                      LIMIT 1
                  """),
                  {"subject": PHASE1_SUPER_ADMIN_CLERK_USER_ID},
              ).first()
              approved_id = str(approved[0]) if approved is not None else None

              conflicts = list(session.execute(
                  text("""
                      SELECT p.user_id,p.assignment_source,
                             u.status AS user_status,sp.status AS principal_status,
                             EXISTS (
                               SELECT 1 FROM security.external_identities e
                               WHERE e.user_id=p.user_id AND e.provider='CLERK' AND e.status='ACTIVE'
                             ) AS clerk_backed
                      FROM security.platform_user_role_assignments p
                      JOIN security.users u ON u.user_id=p.user_id
                      JOIN security.security_principals sp ON sp.principal_id=p.user_id
                      WHERE p.role_key='platform.super_admin'
                        AND p.status='ACTIVE'
                        AND (CAST(:approved_id AS uuid) IS NULL OR p.user_id<>CAST(:approved_id AS uuid))
                      FOR UPDATE
                  """),
                  {"approved_id": approved_id},
              ).mappings())

              v2_conflicts = list(session.execute(
                  text("""
                      SELECT user_id
                      FROM security.user_admin_role_assignments
                      WHERE role_key='SuperAdmin' AND status='ACTIVE'
                        AND (CAST(:approved_id AS uuid) IS NULL OR user_id<>CAST(:approved_id AS uuid))
                      FOR UPDATE
                  """),
                  {"approved_id": approved_id},
              ).mappings())

              if v2_conflicts:
                  raise SystemExit("Unexpected active v2 SuperAdmin conflict; refusing automatic handover")

              if conflicts:
                  if len(conflicts) != 1:
                      raise SystemExit("Expected at most one legacy SuperAdmin during DEV handover")
                  conflict = conflicts[0]
                  if (
                      str(conflict["assignment_source"]) != "BOOTSTRAP"
                      or str(conflict["user_status"]) != "ACTIVE"
                      or str(conflict["principal_status"]) != "ACTIVE"
                      or not bool(conflict["clerk_backed"])
                  ):
                      raise SystemExit("Legacy SuperAdmin is not the proven ACTIVE Clerk-backed BOOTSTRAP identity")

                  session.execute(
                      text("""
                          DELETE FROM security.platform_user_role_assignments
                          WHERE user_id=:user_id
                            AND role_key='platform.super_admin'
                            AND status='ACTIVE'
                            AND assignment_source='BOOTSTRAP'
                      """),
                      {"user_id": str(conflict["user_id"])},
                  )
                  session.flush()

              result = InitialSuperAdminProvisioningService(session).provision(
                  clerk_user_id=PHASE1_SUPER_ADMIN_CLERK_USER_ID,
                  display_name="superadmin",
              )

              verified = session.execute(
                  text("""
                      SELECT
                        (SELECT count(*)
                         FROM security.platform_user_role_assignments p
                         JOIN security.external_identities e ON e.user_id=p.user_id
                         WHERE p.role_key='platform.super_admin' AND p.status='ACTIVE'
                           AND e.provider='CLERK' AND e.status='ACTIVE'
                           AND e.provider_subject=:subject) AS legacy_ok,
                        (SELECT count(*)
                         FROM security.user_admin_role_assignments a
                         JOIN security.external_identities e ON e.user_id=a.user_id
                         WHERE a.role_key='SuperAdmin' AND a.scope_type='PLATFORM'
                           AND a.scope_id IS NULL AND a.status='ACTIVE'
                           AND e.provider='CLERK' AND e.status='ACTIVE'
                           AND e.provider_subject=:subject) AS v2_ok,
                        (SELECT count(*) FROM security.platform_user_role_assignments
                         WHERE role_key='platform.super_admin' AND status='ACTIVE') AS legacy_total,
                        (SELECT count(*) FROM security.user_admin_role_assignments
                         WHERE role_key='SuperAdmin' AND status='ACTIVE') AS v2_total
                  """),
                  {"subject": PHASE1_SUPER_ADMIN_CLERK_USER_ID},
              ).mappings().one()
              if not (
                  int(verified["legacy_ok"]) == 1
                  and int(verified["v2_ok"]) == 1
                  and int(verified["legacy_total"]) == 1
                  and int(verified["v2_total"]) == 1
              ):
                  raise SystemExit("Canonical SuperAdmin verification failed")

              print(f"SUPERADMIN_RECONCILE=PASS created={result.created}")
          PY
          post success 'Exactly one approved Clerk SuperAdmin is active in legacy + v2 authority'
          trap - ERR
