name: Verify UC02 Railway DEV Release

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/uc02-railway-dev-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
      SERVICE: security
      EXPECTED_DEV_SHA: df2bcec3426c1d04c6dca029e1fdc6e921ae8b3d
      NOT_BEFORE_UTC: '2026-08-22T04:25:00Z'

    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Validate Security Railway project token and service source
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::Security RAILWAY_API_TOKEN missing'; exit 1; }
          [ -n "${RAILWAY_TOKEN:-}" ] || { echo '::error::Security RAILWAY_TOKEN missing'; exit 1; }

          token_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')"
          [ "$(printf '%s' "$token_response" | jq -r 'has("errors")')" = "false" ] || {
            printf '%s\n' "$token_response" | jq -c '.errors' || true
            echo '::error::Security RAILWAY_TOKEN is not a valid Railway project token.'
            exit 1
          }
          [ "$(printf '%s' "$token_response" | jq -r '.data.projectToken.projectId // empty')" = "$PLATFORM_PROJECT_ID" ] || {
            echo '::error::Security project token targets the wrong project.'
            exit 1
          }
          [ "$(printf '%s' "$token_response" | jq -r '.data.projectToken.environmentId // empty')" = "$PLATFORM_ENVIRONMENT_ID" ] || {
            echo '::error::Security project token targets the wrong environment.'
            exit 1
          }
          echo 'SECURITY_PROJECT_TOKEN=PASS'

          env -u RAILWAY_TOKEN railway link \
            --project "$PLATFORM_PROJECT_ID" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/link.json
          env -u RAILWAY_TOKEN railway service list --json >/tmp/services.json
          service_id="$(jq -r --arg service "$SERVICE" '[.[] | select(.name == $service)] | first | .id // empty' /tmp/services.json)"
          [ -n "$service_id" ] || { echo '::error::Security service id missing'; exit 1; }

          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId source { image } latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ] || {
            printf '%s\n' "$response" | jq -c '.errors' || true
            exit 1
          }
          node="$(printf '%s' "$response" | jq -c --arg service "$service_id" '[.data.environment.serviceInstances.edges[].node | select(.serviceId == $service)] | first // {}')"
          echo "SECURITY_SERVICE_SOURCE_IMAGE=$(printf '%s' "$node" | jq -r '.source.image // "NONE"')"
          echo "SECURITY_GRAPHQL_DEPLOYMENT_ID=$(printf '%s' "$node" | jq -r '.latestDeployment.id // "NONE"')"
          echo "SECURITY_GRAPHQL_DEPLOYMENT_STATUS=$(printf '%s' "$node" | jq -r '.latestDeployment.status // "NONE"')"

      - name: Verify latest Security DEV deployment
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway deployment list --service "$SERVICE" --limit 1 --json >/tmp/deploy.json
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path

          rows=json.loads(Path('/tmp/deploy.json').read_text())
          if not rows:
              raise SystemExit('No Security Railway deployment found')
          row=rows[0]
          deployment_id=str(row.get('id',''))
          status=str(row.get('status',''))
          created=row.get('createdAt') or row.get('created_at') or ''
          print(f'SECURITY_DEPLOYMENT_ID={deployment_id}')
          print(f'SECURITY_DEPLOYMENT_STATUS={status}')
          print(f'SECURITY_DEPLOYMENT_CREATED_AT={created or "UNKNOWN"}')
          if status != 'SUCCESS':
              raise SystemExit(f'Latest Security deployment is not SUCCESS: {status}')
          if created:
              when=datetime.fromisoformat(created.replace('Z','+00:00'))
              floor=datetime.fromisoformat(os.environ['NOT_BEFORE_UTC'].replace('Z','+00:00'))
              if when < floor:
                  raise SystemExit(f'Latest Security deployment is stale: {created}')
          text=json.dumps(row, default=str)
          expected=os.environ['EXPECTED_DEV_SHA']
          if expected in text or expected[:12] in text:
              print('SECURITY_DEPLOYED_SHA_MATCH=PASS')
          else:
              print('SECURITY_DEPLOYED_SHA_MATCH=NOT_EXPOSED_BY_RAILWAY_LIST')
          PY

      - name: Smoke Security DEV
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway variable list --service "$SERVICE" --json >/tmp/vars.json
          domain="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/vars.json').read_text())
          print(data.get('RAILWAY_PUBLIC_DOMAIN') or data.get('RAILWAY_STATIC_URL') or '')
          PY
          )"
          [ -n "$domain" ] || { echo '::error::Security DEV public domain missing'; exit 1; }
          case "$domain" in
            http://*|https://*) base="${domain%/}" ;;
            *) base="https://${domain%/}" ;;
          esac
          curl --fail --silent --show-error "$base/health/ready" >/tmp/ready.json
          curl --fail --silent --show-error "$base/health/live" >/tmp/live.json
          curl --fail --silent --show-error "$base/.well-known/jwks.json" >/tmp/jwks.json
          echo "SECURITY_PUBLIC_BASE=$base"
          echo 'SECURITY_RAILWAY_DEV_VERIFY=PASS'
