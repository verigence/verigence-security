name: UC-001 SuperAdmin Temporary Password Reset

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-superadmin-temp-password-reset.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  SUPERADMIN_EMAIL: jbrconsulting.it@gmail.com
  SUPERADMIN_CLERK_ID: user_3I7FdD5Pkmydsp23OfjH9hBMxpN

jobs:
  reset-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Generate one-time DEV password
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/superadmin-temp-password.txt
          import secrets
          import string
          alphabet = string.ascii_letters + string.digits + '!@#$%^&*_-'
          while True:
              value = ''.join(secrets.choice(alphabet) for _ in range(24))
              if (any(c.islower() for c in value)
                  and any(c.isupper() for c in value)
                  and any(c.isdigit() for c in value)
                  and any(c in '!@#$%^&*_- ' for c in value)):
                  print(value)
                  break
          PY
          temp_password="$(cat /tmp/superadmin-temp-password.txt)"
          echo "::add-mask::$temp_password"
          echo "TEMP_PASSWORD=$temp_password" >> "$GITHUB_ENV"
          chmod 600 /tmp/superadmin-temp-password.txt

      - name: Reset exact canonical Clerk user password
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLERK_SECRET_KEY:-}" ] || { echo '::error::CLERK_SECRET_KEY missing'; exit 1; }
          response="$(curl --fail-with-body --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg password "$TEMP_PASSWORD" '{password:$password,sign_out_of_other_sessions:true}')" \
            "https://api.clerk.com/v1/users/$SUPERADMIN_CLERK_ID")"
          [ "$(printf '%s' "$response" | jq -r '.id // empty')" = "$SUPERADMIN_CLERK_ID" ] || {
            echo '::error::Clerk password reset returned unexpected user'; exit 1;
          }
          [ "$(printf '%s' "$response" | jq -r '.banned // false')" = false ] || {
            echo '::error::Canonical SuperAdmin is banned after password reset'; exit 1;
          }
          [ "$(printf '%s' "$response" | jq -r '.locked // false')" = false ] || {
            echo '::error::Canonical SuperAdmin is locked after password reset'; exit 1;
          }
          primary_id="$(printf '%s' "$response" | jq -r '.primary_email_address_id // empty')"
          primary_email="$(printf '%s' "$response" | jq -r --arg id "$primary_id" '[.email_addresses[]? | select(.id==$id) | .email_address] | first // empty')"
          [ "${primary_email,,}" = "${SUPERADMIN_EMAIL,,}" ] || {
            echo '::error::Canonical SuperAdmin Clerk primary email mismatch'; exit 1;
          }
          echo 'RESET=PASS' >> "$GITHUB_ENV"

      - name: Verify newly assigned password through Clerk
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg password "$TEMP_PASSWORD" '{password:$password}')" \
            "https://api.clerk.com/v1/users/$SUPERADMIN_CLERK_ID/verify_password")"
          [ "$(printf '%s' "$response" | jq -r '.verified // false')" = true ] || {
            echo '::error::Clerk did not verify the newly assigned password'; exit 1;
          }
          echo 'PASSWORD_VERIFY=PASS' >> "$GITHUB_ENV"

      - name: Upload temporary password securely
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-temp-password-${{ github.run_id }}
          path: /tmp/superadmin-temp-password.txt
          retention-days: 1
          if-no-files-found: error

      - name: Record non-secret proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/UC001_SUPERADMIN_PASSWORD_RESET.md <<EOF
          # UC-001 SuperAdmin Temporary Password Reset

          - run_id: $GITHUB_RUN_ID
          - source_sha: $GITHUB_SHA
          - superadmin_email: $SUPERADMIN_EMAIL
          - superadmin_clerk_id: $SUPERADMIN_CLERK_ID
          - password_reset: ${RESET:-not_reached}
          - password_verify: ${PASSWORD_VERIFY:-not_reached}
          - job_status: ${{ job.status }}
          - password_artifact: superadmin-temp-password-$GITHUB_RUN_ID
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/UC001_SUPERADMIN_PASSWORD_RESET.md
          git commit -m 'docs(dev): record SuperAdmin password reset proof [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
