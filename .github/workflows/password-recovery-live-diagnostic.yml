name: Password Recovery Live Diagnostic

on:
  push:
    branches:
      - diag/password-recovery-otp-20260821
    paths:
      - .github/workflows/password-recovery-live-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
      SECURITY_SERVICE: security
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diag/password-recovery-otp-20260821

      - name: Install diagnostic tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          npm install --global @railway/cli

      - name: Resolve latest password reset attempt
        shell: bash
        run: |
          set -euo pipefail
          raw="$MIGRATION_DATABASE_URL"
          case "$raw" in
            postgresql+psycopg://*) database_url="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) database_url="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) database_url="$raw" ;;
            *) echo 'Unsupported database URL'; exit 1 ;;
          esac
          echo "::add-mask::$database_url"
          row="$(psql "$database_url" -X -v ON_ERROR_STOP=1 -AtF '|' -c "
            SELECT password_reset_attempt_id,user_id,clerk_user_id,clerk_email_address_id,
                   clerk_email_verification_id,status,created_at_utc,expires_at_utc,
                   coalesce(completed_at_utc::text,''),coalesce(correlation_id,'')
            FROM security.password_reset_attempts
            ORDER BY created_at_utc DESC
            LIMIT 1;
          ")"
          [ -n "$row" ] || { echo 'No password reset attempt found'; exit 1; }
          IFS='|' read -r attempt_id user_id clerk_user_id clerk_email_id stored_verification_id status created_at expires_at completed_at correlation_id <<< "$row"
          echo "ATTEMPT_ID=$attempt_id" >> "$GITHUB_ENV"
          echo "USER_ID=$user_id" >> "$GITHUB_ENV"
          echo "CLERK_USER_ID=$clerk_user_id" >> "$GITHUB_ENV"
          echo "CLERK_EMAIL_ID=$clerk_email_id" >> "$GITHUB_ENV"
          echo "STORED_VERIFICATION_ID=$stored_verification_id" >> "$GITHUB_ENV"
          echo "ATTEMPT_STATUS=$status" >> "$GITHUB_ENV"
          echo "ATTEMPT_CREATED=$created_at" >> "$GITHUB_ENV"
          echo "ATTEMPT_EXPIRES=$expires_at" >> "$GITHUB_ENV"
          echo "ATTEMPT_COMPLETED=$completed_at" >> "$GITHUB_ENV"
          echo "CORRELATION_ID=$correlation_id" >> "$GITHUB_ENV"

          pending_count="$(psql "$database_url" -X -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM security.password_reset_attempts WHERE user_id='$user_id' AND status='PENDING';")"
          recent_statuses="$(psql "$database_url" -X -v ON_ERROR_STOP=1 -Atc "SELECT coalesce(string_agg(status,',' ORDER BY created_at_utc DESC),'') FROM (SELECT status,created_at_utc FROM security.password_reset_attempts WHERE user_id='$user_id' ORDER BY created_at_utc DESC LIMIT 5) s;")"
          echo "PENDING_COUNT=$pending_count" >> "$GITHUB_ENV"
          echo "RECENT_STATUSES=$recent_statuses" >> "$GITHUB_ENV"

      - name: Resolve Clerk secret from Railway runtime
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway link --project "$PLATFORM_PROJECT_ID" --environment "$PLATFORM_ENVIRONMENT_ID" --json >/dev/null
          env -u RAILWAY_TOKEN railway variable list --service "$SECURITY_SERVICE" --environment "$PLATFORM_ENVIRONMENT_ID" --json >/tmp/security-vars.json
          clerk_secret="$(jq -r '.CLERK_SECRET_KEY // empty' /tmp/security-vars.json)"
          [ -n "$clerk_secret" ] || { echo 'Missing Clerk secret'; exit 1; }
          echo "::add-mask::$clerk_secret"
          echo "CLERK_SECRET_KEY=$clerk_secret" >> "$GITHUB_ENV"

      - name: Inspect Clerk verification state safely
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            "https://api.clerk.com/v1/email_addresses/$CLERK_EMAIL_ID" >/tmp/email.json
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            "https://api.clerk.com/v1/users/$CLERK_USER_ID" >/tmp/user.json

          provider_verification_id="$(jq -r '.verification.id // ""' /tmp/email.json)"
          provider_status="$(jq -r '.verification.status // "null"' /tmp/email.json)"
          provider_strategy="$(jq -r '.verification.strategy // "null"' /tmp/email.json)"
          provider_attempts="$(jq -r '.verification.attempts // "null"' /tmp/email.json)"
          provider_expire_at="$(jq -r '.verification.expire_at // .verification.expireAt // "null"' /tmp/email.json)"
          user_email_status="$(jq -r --arg id "$CLERK_EMAIL_ID" '[.email_addresses[] | select(.id == $id) | .verification.status] | first // "missing"' /tmp/user.json)"
          primary_match="$(jq -r --arg id "$CLERK_EMAIL_ID" '(.primary_email_address_id // "") == $id' /tmp/user.json)"
          recovery_placeholder_count="$(jq -r '[.email_addresses[]? | select((.email_address // "") | startswith("verigence-recovery-"))] | length' /tmp/user.json)"
          pending_placeholder_count="$(jq -r '[.email_addresses[]? | select((.email_address // "") | startswith("verigence-pending-"))] | length' /tmp/user.json)"
          banned="$(jq -r '.banned // false' /tmp/user.json)"

          stored_hash="$(printf '%s' "$STORED_VERIFICATION_ID" | sha256sum | awk '{print $1}')"
          provider_hash="none"
          verification_match=false
          if [ -n "$provider_verification_id" ]; then
            provider_hash="$(printf '%s' "$provider_verification_id" | sha256sum | awk '{print $1}')"
            if [ "$provider_verification_id" = "$STORED_VERIFICATION_ID" ]; then verification_match=true; fi
          fi
          attempt_hash="$(printf '%s' "$ATTEMPT_ID" | sha256sum | awk '{print $1}')"
          user_hash="$(printf '%s' "$USER_ID" | sha256sum | awk '{print $1}')"
          clerk_user_hash="$(printf '%s' "$CLERK_USER_ID" | sha256sum | awk '{print $1}')"
          email_id_hash="$(printf '%s' "$CLERK_EMAIL_ID" | sha256sum | awk '{print $1}')"
          correlation_hash="none"
          if [ -n "$CORRELATION_ID" ]; then correlation_hash="$(printf '%s' "$CORRELATION_ID" | sha256sum | awk '{print $1}')"; fi

          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/PASSWORD_RECOVERY_LIVE_DIAGNOSTIC.md <<EOF
          # Password Recovery Live Diagnostic

          - diagnostic_source_sha: $GITHUB_SHA
          - attempt_id_sha256: $attempt_hash
          - user_id_sha256: $user_hash
          - clerk_user_id_sha256: $clerk_user_hash
          - clerk_email_address_id_sha256: $email_id_hash
          - correlation_id_sha256: $correlation_hash
          - attempt_status: $ATTEMPT_STATUS
          - attempt_created_at: $ATTEMPT_CREATED
          - attempt_expires_at: $ATTEMPT_EXPIRES
          - attempt_completed_at: ${ATTEMPT_COMPLETED:-none}
          - pending_attempt_count_for_user: $PENDING_COUNT
          - recent_attempt_statuses: $RECENT_STATUSES
          - stored_verification_id_sha256: $stored_hash
          - provider_verification_id_sha256: $provider_hash
          - stored_provider_verification_id_match: $verification_match
          - provider_email_verification_status: $provider_status
          - provider_email_verification_strategy: $provider_strategy
          - provider_email_verification_attempts: $provider_attempts
          - provider_email_verification_expire_at: $provider_expire_at
          - provider_user_email_verification_status: $user_email_status
          - provider_primary_email_matches_attempt: $primary_match
          - recovery_placeholder_count: $recovery_placeholder_count
          - pending_placeholder_count: $pending_placeholder_count
          - provider_user_banned: $banned
          EOF

      - name: Commit safe diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/PASSWORD_RECOVERY_LIVE_DIAGNOSTIC.md
          git commit -m 'docs(diag): record password recovery OTP state' || exit 0
          git push origin HEAD:diag/password-recovery-otp-20260821
