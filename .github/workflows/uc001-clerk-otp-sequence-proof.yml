name: UC-001 Clerk OTP Sequence Proof

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-clerk-otp-sequence-proof.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

jobs:
  prove-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Prove verified-placeholder plus unverified-signup-email sequence
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLERK_SECRET_KEY:-}" ] || { echo '::error::CLERK_SECRET_KEY missing'; exit 1; }

          marker="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          placeholder="verigence-pending+clerk_test_${marker}@example.com"
          signup_email="verigence-otp+clerk_test_${marker}@example.com"
          password="VgnOtpProof!${marker}Aa9"
          user_id=''

          cleanup() {
            if [ -n "$user_id" ]; then
              curl --silent --show-error -X DELETE \
                -H "Authorization: Bearer $CLERK_SECRET_KEY" \
                "https://api.clerk.com/v1/users/$user_id" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          get_email() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLERK_SECRET_KEY" \
              "https://api.clerk.com/v1/email_addresses/$1"
          }

          create_payload="$(jq -cn \
            --arg placeholder "$placeholder" \
            --arg password "$password" \
            '{first_name:"OTP",last_name:"Proof",email_address:[$placeholder],password:$password,banned:true}')"
          create="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "$create_payload" \
            'https://api.clerk.com/v1/users')"
          user_id="$(printf '%s' "$create" | jq -r '.id // empty')"
          [ -n "$user_id" ] || { echo '::error::Clerk test user creation failed'; exit 1; }
          [ "$(printf '%s' "$create" | jq -r '.banned // false')" = true ] || { echo '::error::Test user was not created banned'; exit 1; }
          placeholder_id="$(printf '%s' "$create" | jq -r --arg e "$placeholder" '.email_addresses[] | select((.email_address|ascii_downcase)==($e|ascii_downcase)) | .id' | head -1)"
          placeholder_verified="$(printf '%s' "$create" | jq -r --arg e "$placeholder" '.email_addresses[] | select((.email_address|ascii_downcase)==($e|ascii_downcase)) | .verification.status // empty' | head -1)"
          [ -n "$placeholder_id" ] || { echo '::error::Placeholder email id missing'; exit 1; }
          [ "$placeholder_verified" = verified ] || { echo "::error::Placeholder was not verified: $placeholder_verified"; exit 1; }
          echo 'CREATE_BANNED_WITH_VERIFIED_PLACEHOLDER=PASS' >> "$GITHUB_ENV"

          add_payload="$(jq -cn --arg user "$user_id" --arg email "$signup_email" '{user_id:$user,email_address:$email,primary:false,verified:false}')"
          added="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "$add_payload" \
            'https://api.clerk.com/v1/email_addresses')"
          signup_email_id="$(printf '%s' "$added" | jq -r '.id // empty')"
          [ -n "$signup_email_id" ] || { echo '::error::Unverified signup email was not created'; exit 1; }
          echo 'CREATE_UNVERIFIED_SIGNUP_EMAIL=PASS' >> "$GITHUB_ENV"

          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"strategy":"email_code"}' \
            "https://api.clerk.com/v1/email_addresses/$signup_email_id/prepare_verification" >/tmp/prepare.json
          prepared_email="$(get_email "$signup_email_id")"
          prepared_status="$(printf '%s' "$prepared_email" | jq -r '.verification.status // empty')"
          prepared_strategy="$(printf '%s' "$prepared_email" | jq -r '.verification.strategy // empty')"
          [ "$prepared_status" = unverified ] || { echo "::error::Prepared email status=$prepared_status"; printf '%s\n' "$prepared_email" | jq -c '{id,email_address,verification}'; exit 1; }
          [ "$prepared_strategy" = email_code ] || { echo "::error::Prepared email strategy=$prepared_strategy"; printf '%s\n' "$prepared_email" | jq -c '{id,email_address,verification}'; exit 1; }
          echo 'PREPARE_EMAIL_CODE=PASS' >> "$GITHUB_ENV"

          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"code":"424242"}' \
            "https://api.clerk.com/v1/email_addresses/$signup_email_id/attempt_verification" >/tmp/attempt.json
          attempted_email="$(get_email "$signup_email_id")"
          [ "$(printf '%s' "$attempted_email" | jq -r '.verification.status // empty')" = verified ] || { echo '::error::Fixed Clerk test OTP did not verify'; printf '%s\n' "$attempted_email" | jq -c '{id,email_address,verification}'; exit 1; }
          echo 'ATTEMPT_EMAIL_CODE=PASS' >> "$GITHUB_ENV"

          curl --fail-with-body --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"primary":true}' \
            "https://api.clerk.com/v1/email_addresses/$signup_email_id" >/tmp/promote.json
          promoted_email="$(get_email "$signup_email_id")"
          [ "$(printf '%s' "$promoted_email" | jq -r '.verification.status // empty')" = verified ] || { echo '::error::Promoted email lost verified state'; exit 1; }
          echo 'PROMOTE_VERIFIED_EMAIL=PASS' >> "$GITHUB_ENV"

          delete_code="$(curl --silent --show-error -o /tmp/delete-placeholder.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            "https://api.clerk.com/v1/email_addresses/$placeholder_id")"
          case "$delete_code" in
            200|204) ;;
            *) echo "::error::Placeholder email delete HTTP $delete_code"; cat /tmp/delete-placeholder.json || true; exit 1 ;;
          esac
          echo 'DELETE_PLACEHOLDER=PASS' >> "$GITHUB_ENV"

          final="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            "https://api.clerk.com/v1/users/$user_id")"
          [ "$(printf '%s' "$final" | jq -r '.banned // false')" = true ] || { echo '::error::User did not remain banned'; exit 1; }
          [ "$(printf '%s' "$final" | jq -r '.email_addresses | length')" = 1 ] || { echo '::error::Unexpected email count after cleanup'; exit 1; }
          [ "$(printf '%s' "$final" | jq -r --arg e "$signup_email" '.email_addresses[0].email_address | ascii_downcase == ($e|ascii_downcase)')" = true ] || { echo '::error::Final user does not contain signup email'; exit 1; }
          [ "$(printf '%s' "$final" | jq -r '.email_addresses[0].verification.status // empty')" = verified ] || { echo '::error::Final signup email is not verified'; exit 1; }
          [ "$(printf '%s' "$final" | jq -r '.primary_email_address_id // empty')" = "$signup_email_id" ] || { echo '::error::Signup email is not primary'; exit 1; }
          echo 'FINAL_BANNED_VERIFIED_PRIMARY_STATE=PASS' >> "$GITHUB_ENV"

      - name: Record proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/UC001_CLERK_OTP_SEQUENCE_PROOF.md <<EOF
          # UC-001 Clerk OTP Sequence Proof

          - run_id: $GITHUB_RUN_ID
          - source_sha: $GITHUB_SHA
          - create_banned_with_verified_placeholder: ${CREATE_BANNED_WITH_VERIFIED_PLACEHOLDER:-not_reached}
          - create_unverified_signup_email: ${CREATE_UNVERIFIED_SIGNUP_EMAIL:-not_reached}
          - prepare_email_code: ${PREPARE_EMAIL_CODE:-not_reached}
          - attempt_email_code_424242: ${ATTEMPT_EMAIL_CODE:-not_reached}
          - promote_verified_signup_email: ${PROMOTE_VERIFIED_EMAIL:-not_reached}
          - delete_placeholder: ${DELETE_PLACEHOLDER:-not_reached}
          - final_banned_verified_primary_state: ${FINAL_BANNED_VERIFIED_PRIMARY_STATE:-not_reached}
          - job_status: ${{ job.status }}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/UC001_CLERK_OTP_SEQUENCE_PROOF.md
          git commit -m 'docs(dev): record Clerk OTP sequence proof [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
