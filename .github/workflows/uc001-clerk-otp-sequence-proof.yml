name: UC-001 Clerk OTP Sequence Proof

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-clerk-otp-sequence-proof.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

jobs:
  prove-sequence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Prove verified-placeholder plus unverified-signup-email sequence
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLERK_SECRET_KEY:-}" ] || { echo '::error::CLERK_SECRET_KEY missing'; exit 1; }

          marker="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          placeholder="verigence-pending+clerk_test_${marker}@example.com"
          signup_email="verigence-otp+clerk_test_${marker}@example.com"
          password="VgnOtpProof!${marker}Aa9"
          user_id=''

          cleanup() {
            if [ -n "$user_id" ]; then
              curl --silent --show-error -X DELETE -H "Authorization: Bearer $CLERK_SECRET_KEY" "https://api.clerk.com/v1/users/$user_id" >/dev/null || true
            fi
          }
          trap cleanup EXIT

          create_payload="$(jq -cn --arg placeholder "$placeholder" --arg password "$password" '{first_name:"OTP",last_name:"Proof",email_address:[$placeholder],password:$password,banned:true}')"
          create="$(curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $CLERK_SECRET_KEY" -H 'Content-Type: application/json' --data "$create_payload" 'https://api.clerk.com/v1/users')"
          user_id="$(printf '%s' "$create" | jq -r '.id // empty')"
          [ -n "$user_id" ] || { echo '::error::Clerk test user creation failed'; exit 1; }
          [ "$(printf '%s' "$create" | jq -r '.banned // false')" = true ] || { echo '::error::Test user was not created banned'; exit 1; }
          placeholder_id="$(printf '%s' "$create" | jq -r --arg e "$placeholder" '.email_addresses[] | select((.email_address|ascii_downcase)==($e|ascii_downcase)) | .id' | head -1)"
          [ "$(printf '%s' "$create" | jq -r --arg e "$placeholder" '.email_addresses[] | select((.email_address|ascii_downcase)==($e|ascii_downcase)) | .verification.status // empty' | head -1)" = verified ] || { echo '::error::Placeholder was not verified'; exit 1; }
          echo 'CREATE_BANNED_WITH_VERIFIED_PLACEHOLDER=PASS' >> "$GITHUB_ENV"

          add_payload="$(jq -cn --arg user "$user_id" --arg email "$signup_email" '{user_id:$user,email_address:$email,primary:false,verified:false}')"
          added="$(curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $CLERK_SECRET_KEY" -H 'Content-Type: application/json' --data "$add_payload" 'https://api.clerk.com/v1/email_addresses')"
          signup_email_id="$(printf '%s' "$added" | jq -r '.id // empty')"
          [ -n "$signup_email_id" ] || { echo '::error::Unverified signup email was not created'; exit 1; }
          echo 'CREATE_UNVERIFIED_SIGNUP_EMAIL=PASS' >> "$GITHUB_ENV"

          prepared="$(curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $CLERK_SECRET_KEY" -H 'Content-Type: application/json' --data '{"strategy":"email_code"}' "https://api.clerk.com/v1/email_addresses/$signup_email_id/prepare_verification")"
          verification_id="$(printf '%s' "$prepared" | jq -r '.id // .verification.id // empty')"
          [ "$verification_id" != '' ] || { echo '::error::Prepare did not return verification id'; printf '%s\n' "$prepared" | jq -c '.'; exit 1; }
          [ "$(printf '%s' "$prepared" | jq -r '.status // .verification.status // empty')" = unverified ] || { echo '::error::Prepare status invalid'; exit 1; }
          [ "$(printf '%s' "$prepared" | jq -r '.strategy // .verification.strategy // empty')" = email_code ] || { echo '::error::Prepare strategy invalid'; exit 1; }
          echo 'PREPARE_EMAIL_CODE=PASS' >> "$GITHUB_ENV"
          echo 'VERIFICATION_ID=PASS' >> "$GITHUB_ENV"

          attempt_payload="$(jq -cn --arg code '424242' --arg verification_id "$verification_id" '{code:$code,verification_id:$verification_id}')"
          attempt_code="$(curl --silent --show-error -o /tmp/attempt.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" -H 'Content-Type: application/json' \
            --data "$attempt_payload" "https://api.clerk.com/v1/email_addresses/$signup_email_id/attempt_verification")"
          if [ "$attempt_code" != 200 ]; then
            provider_code="$(jq -r '.errors[0].code // .code // "unknown"' /tmp/attempt.json 2>/dev/null || echo unknown)"
            provider_detail="$(jq -r '.errors[0].long_message // .errors[0].message // .message // "unknown"' /tmp/attempt.json 2>/dev/null || echo unknown)"
            echo "ATTEMPT_HTTP=$attempt_code" >> "$GITHUB_ENV"
            echo "ATTEMPT_PROVIDER_CODE=$provider_code" >> "$GITHUB_ENV"
            echo "::error::Clerk attempt HTTP $attempt_code code=$provider_code detail=$provider_detail"
            exit 1
          fi
          attempted="$(cat /tmp/attempt.json)"
          attempt_status="$(printf '%s' "$attempted" | jq -r '.status // .verification.status // empty')"
          [ "$attempt_status" = verified ] || { echo "::error::Fixed Clerk test OTP status=$attempt_status"; printf '%s\n' "$attempted" | jq -c '.'; exit 1; }
          echo 'ATTEMPT_HTTP=200' >> "$GITHUB_ENV"
          echo 'ATTEMPT_PROVIDER_CODE=none' >> "$GITHUB_ENV"
          echo 'ATTEMPT_EMAIL_CODE=PASS' >> "$GITHUB_ENV"

          promoted="$(curl --fail-with-body --silent --show-error -X PATCH -H "Authorization: Bearer $CLERK_SECRET_KEY" -H 'Content-Type: application/json' --data '{"primary":true,"verified":true}' "https://api.clerk.com/v1/email_addresses/$signup_email_id")"
          [ "$(printf '%s' "$promoted" | jq -r '.id // empty')" = "$signup_email_id" ] || { echo '::error::Signup email promotion failed'; exit 1; }
          echo 'PROMOTE_VERIFIED_EMAIL=PASS' >> "$GITHUB_ENV"

          delete_code="$(curl --silent --show-error -o /tmp/delete-placeholder.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLERK_SECRET_KEY" "https://api.clerk.com/v1/email_addresses/$placeholder_id")"
          case "$delete_code" in 200|204) ;; *) echo "::error::Placeholder email delete HTTP $delete_code"; cat /tmp/delete-placeholder.json || true; exit 1 ;; esac
          echo 'DELETE_PLACEHOLDER=PASS' >> "$GITHUB_ENV"

          final="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLERK_SECRET_KEY" "https://api.clerk.com/v1/users/$user_id")"
          [ "$(printf '%s' "$final" | jq -r '.banned // false')" = true ] || { echo '::error::User did not remain banned'; exit 1; }
          [ "$(printf '%s' "$final" | jq -r '.email_addresses | length')" = 1 ] || { echo '::error::Unexpected email count after cleanup'; exit 1; }
          [ "$(printf '%s' "$final" | jq -r '.primary_email_address_id // empty')" = "$signup_email_id" ] || { echo '::error::Signup email is not primary'; exit 1; }
          final_verification="$(printf '%s' "$final" | jq -r '.email_addresses[0].verification.status // empty')"
          echo "FINAL_USER_EMAIL_VERIFICATION=${final_verification:-none}" >> "$GITHUB_ENV"
          [ "$final_verification" = verified ] || { echo "::error::Final user email verification=$final_verification"; exit 1; }
          echo 'FINAL_BANNED_VERIFIED_PRIMARY_STATE=PASS' >> "$GITHUB_ENV"

      - name: Record proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/UC001_CLERK_OTP_SEQUENCE_PROOF.md <<EOF
          # UC-001 Clerk OTP Sequence Proof

          - run_id: $GITHUB_RUN_ID
          - source_sha: $GITHUB_SHA
          - create_banned_with_verified_placeholder: ${CREATE_BANNED_WITH_VERIFIED_PLACEHOLDER:-not_reached}
          - create_unverified_signup_email: ${CREATE_UNVERIFIED_SIGNUP_EMAIL:-not_reached}
          - prepare_email_code: ${PREPARE_EMAIL_CODE:-not_reached}
          - verification_id_captured: ${VERIFICATION_ID:-not_reached}
          - attempt_http: ${ATTEMPT_HTTP:-not_reached}
          - attempt_provider_code: ${ATTEMPT_PROVIDER_CODE:-not_reached}
          - attempt_email_code_424242: ${ATTEMPT_EMAIL_CODE:-not_reached}
          - promote_verified_signup_email: ${PROMOTE_VERIFIED_EMAIL:-not_reached}
          - delete_placeholder: ${DELETE_PLACEHOLDER:-not_reached}
          - final_user_email_verification_field: ${FINAL_USER_EMAIL_VERIFICATION:-not_reached}
          - final_banned_verified_primary_state: ${FINAL_BANNED_VERIFIED_PRIMARY_STATE:-not_reached}
          - job_status: ${{ job.status }}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/UC001_CLERK_OTP_SEQUENCE_PROOF.md
          git commit -m 'docs(dev): record Clerk OTP sequence proof [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
