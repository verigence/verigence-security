name: Discover Security Railway target

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/railway-discover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Check managed Railway credential availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_API_TOKEN:-}" ] && [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Neither RAILWAY_API_TOKEN nor RAILWAY_TOKEN is configured for the Security repository."
            exit 1
          fi
          echo "Railway credential(s) are configured; testing them without exposing values"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Try account/workspace Railway token
        if: env.RAILWAY_API_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway list --json > /tmp/projects.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/projects.json').read_text())
          print('Accessible Railway projects matching Verigence/Security:')
          matches = 0
          for item in data:
              name = item.get('name') or item.get('project', {}).get('name') or ''
              project_id = item.get('id') or item.get('project', {}).get('id') or ''
              if 'verigence' in name.lower() or 'security' in name.lower():
                  matches += 1
                  print(f'- {name} | {project_id}')
          if matches == 0:
              print('- no matching project names found')
          PY

      - name: Try project-scoped Railway token
        if: env.RAILWAY_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_API_TOKEN railway status --json > /tmp/status.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/status.json').read_text())
          print('Railway project-token status (safe identifiers only):')

          def emit(prefix, value, depth=0):
              if depth > 5:
                  return
              if isinstance(value, dict):
                  safe = {}
                  for key in ('id', 'name', 'projectId', 'projectName', 'environmentId',
                              'environmentName', 'serviceId', 'serviceName', 'status'):
                      if key in value and isinstance(value[key], (str, int, bool)):
                          safe[key] = value[key]
                  if safe:
                      print(f'{prefix}: {safe}')
                  for key in ('project', 'environment', 'service', 'services', 'resources'):
                      if key in value:
                          emit(f'{prefix}.{key}', value[key], depth + 1)
              elif isinstance(value, list):
                  for index, item in enumerate(value):
                      emit(f'{prefix}[{index}]', item, depth + 1)

          emit('status', data)
          PY
