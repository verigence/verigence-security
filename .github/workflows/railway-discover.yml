name: Discover Security Railway target

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/railway-discover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Check managed Railway credential availability
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            echo "RAILWAY_AUTH_MODE=account" >> "$GITHUB_ENV"
            echo "Railway account/workspace token is configured"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_AUTH_MODE=project" >> "$GITHUB_ENV"
            echo "Railway project token is configured"
          else
            echo "::error::Neither RAILWAY_API_TOKEN nor RAILWAY_TOKEN is configured for the Security repository."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Discover accessible Railway project context
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RAILWAY_AUTH_MODE" = "account" ]; then
            env -u RAILWAY_TOKEN railway list --json > /tmp/projects.json
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/projects.json').read_text())
          print('Accessible Railway projects matching Verigence/Security:')
          matches = 0
          for item in data:
              name = item.get('name') or item.get('project', {}).get('name') or ''
              project_id = item.get('id') or item.get('project', {}).get('id') or ''
              if 'verigence' in name.lower() or 'security' in name.lower():
                  matches += 1
                  print(f'- {name} | {project_id}')
          if matches == 0:
              print('- no matching project names found')
          PY
          else
            echo "Project-scoped Railway token is present but the project ID is not stored in the repository; account-level discovery is unavailable."
          fi
