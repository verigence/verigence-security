name: UC-001 SuperAdmin Login Reconcile

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-superadmin-login-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  SUPERADMIN_EMAIL: jbrconsulting.it@gmail.com
  SUPERADMIN_CLERK_ID: user_3I7FdD5Pkmydsp23OfjH9hBMxpN

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve DEV database
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || { echo '::error::MIGRATION_DATABASE_URL missing'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) db="postgresql://${raw#postgresql+psycopg://}" ;;
            postgresql+asyncpg://*) db="postgresql://${raw#postgresql+asyncpg://}" ;;
            postgresql://*|postgres://*) db="$raw" ;;
            *) echo '::error::Unsupported database URL'; exit 1 ;;
          esac
          echo "::add-mask::$db"
          echo "DB=$db" >> "$GITHUB_ENV"
          psql "$db" -X -v ON_ERROR_STOP=1 -Atc 'SELECT 1' >/dev/null

      - name: Verify canonical Security identity chain
        shell: bash
        run: |
          set -euo pipefail
          row="$(psql "$DB" -X -v ON_ERROR_STOP=1 -AtF '|' -c "
            SELECT u.user_id,u.primary_email,u.status,p.status,e.provider_subject,e.status,
                   count(a.assignment_id) FILTER (
                     WHERE a.role_key='SuperAdmin'
                       AND a.scope_type='PLATFORM'
                       AND a.scope_id IS NULL
                       AND a.status='ACTIVE'
                   )
            FROM security.users u
            JOIN security.security_principals p ON p.principal_id=u.user_id AND p.actor_type='USER'
            JOIN security.external_identities e ON e.user_id=u.user_id AND e.provider='CLERK'
            LEFT JOIN security.user_admin_role_assignments a ON a.user_id=u.user_id
            WHERE lower(u.primary_email)=lower('$SUPERADMIN_EMAIL')
              AND e.provider_subject='$SUPERADMIN_CLERK_ID'
            GROUP BY u.user_id,u.primary_email,u.status,p.status,e.provider_subject,e.status;
          ")"
          [ -n "$row" ] || { echo '::error::Canonical SuperAdmin Security chain not found'; exit 1; }
          IFS='|' read -r user_id email user_status principal_status clerk_id identity_status admin_count <<< "$row"
          [ "$user_status" = ACTIVE ] || { echo "::error::USER status=$user_status"; exit 1; }
          [ "$principal_status" = ACTIVE ] || { echo "::error::principal status=$principal_status"; exit 1; }
          [ "$identity_status" = ACTIVE ] || { echo "::error::identity status=$identity_status"; exit 1; }
          [ "$admin_count" = 1 ] || { echo "::error::SuperAdmin assignment count=$admin_count"; exit 1; }
          echo "SECURITY_USER_ID=$user_id" >> "$GITHUB_ENV"
          echo 'SECURITY_CHAIN=PASS' >> "$GITHUB_ENV"

      - name: Inspect and reconcile Clerk login state
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLERK_SECRET_KEY:-}" ] || { echo '::error::CLERK_SECRET_KEY missing'; exit 1; }
          echo '::add-mask::'$CLERK_SECRET_KEY
          get_user() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLERK_SECRET_KEY" \
              -H 'Content-Type: application/json' \
              "https://api.clerk.com/v1/users/$SUPERADMIN_CLERK_ID"
          }
          body="$(get_user)"
          actual_id="$(printf '%s' "$body" | jq -r '.id // empty')"
          [ "$actual_id" = "$SUPERADMIN_CLERK_ID" ] || { echo '::error::Canonical Clerk user not found'; exit 1; }
          before_banned="$(printf '%s' "$body" | jq -r '.banned // false')"
          before_locked="$(printf '%s' "$body" | jq -r '.locked // false')"
          password_enabled="$(printf '%s' "$body" | jq -r '.password_enabled // false')"
          primary_id="$(printf '%s' "$body" | jq -r '.primary_email_address_id // empty')"
          primary_email="$(printf '%s' "$body" | jq -r --arg id "$primary_id" '[.email_addresses[]? | select(.id==$id) | .email_address] | first // empty')"

          echo "CLERK_BANNED_BEFORE=$before_banned" >> "$GITHUB_ENV"
          echo "CLERK_LOCKED=$before_locked" >> "$GITHUB_ENV"
          echo "CLERK_PASSWORD_ENABLED=$password_enabled" >> "$GITHUB_ENV"
          echo "CLERK_PRIMARY_EMAIL=$primary_email" >> "$GITHUB_ENV"

          if [ "$before_banned" = true ]; then
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $CLERK_SECRET_KEY" \
              -H 'Content-Type: application/json' \
              "https://api.clerk.com/v1/users/$SUPERADMIN_CLERK_ID/unban" >/tmp/unban.json
            body="$(get_user)"
          fi

          after_banned="$(printf '%s' "$body" | jq -r '.banned // false')"
          after_locked="$(printf '%s' "$body" | jq -r '.locked // false')"
          [ "$after_banned" = false ] || { echo '::error::Canonical SuperAdmin remains banned'; exit 1; }
          [ "$after_locked" = false ] || { echo '::error::Canonical SuperAdmin is locked'; exit 1; }
          [ "$password_enabled" = true ] || { echo '::error::Canonical SuperAdmin has no password enabled'; exit 1; }
          echo "CLERK_BANNED_AFTER=$after_banned" >> "$GITHUB_ENV"
          echo 'CLERK_LOGIN_STATE=PASS' >> "$GITHUB_ENV"

      - name: Record proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/UC001_SUPERADMIN_LOGIN_RECONCILE.md <<EOF
          # UC-001 SuperAdmin Login Reconcile

          - run_id: $GITHUB_RUN_ID
          - source_sha: $GITHUB_SHA
          - job_status: ${{ job.status }}
          - superadmin_email: $SUPERADMIN_EMAIL
          - superadmin_clerk_id: $SUPERADMIN_CLERK_ID
          - security_user_id: ${SECURITY_USER_ID:-unknown}
          - security_chain: ${SECURITY_CHAIN:-not_reached}
          - clerk_primary_email: ${CLERK_PRIMARY_EMAIL:-unknown}
          - clerk_password_enabled: ${CLERK_PASSWORD_ENABLED:-unknown}
          - clerk_locked: ${CLERK_LOCKED:-unknown}
          - clerk_banned_before: ${CLERK_BANNED_BEFORE:-unknown}
          - clerk_banned_after: ${CLERK_BANNED_AFTER:-unknown}
          - clerk_login_state: ${CLERK_LOGIN_STATE:-not_reached}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/UC001_SUPERADMIN_LOGIN_RECONCILE.md
          git commit -m 'docs(dev): record SuperAdmin login reconcile proof [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
