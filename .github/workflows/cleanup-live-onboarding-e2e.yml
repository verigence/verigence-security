name: Cleanup Live Onboarding E2E Identity

on:
  push:
    branches:
      - test/cleanup-live-onboarding-e2e-20260814

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: a6808842-2e90-44f8-9172-63a905b24b5c
      RAILWAY_ENVIRONMENT_ID: 09e12bb5-9781-4b01-974b-fde54d01e37c
      RAILWAY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1
      TEST_EMAIL: gigsinopensource+verigence-e2e-20260814081217-9c34f45d@gmail.com
      SECURITY_USER_ID: dbaffcc5-84d4-41c9-874a-1f3740aa7d99
      CLERK_USER_ID: user_3HtlFUlhAfEUGUq4wtgoun31dzB

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cleanup dependencies
        run: python -m pip install 'sqlalchemy>=2,<3' 'psycopg[binary]>=3.2,<4' 'httpx>=0.28,<1'

      - name: Resolve Railway DEV Clerk and database configuration
        shell: bash
        run: |
          set -euo pipefail
          query='query variables($projectId: String!, $environmentId: String!, $serviceId: String) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }'
          vars="$(jq -cn --arg project "$RAILWAY_PROJECT_ID" --arg environment "$RAILWAY_ENVIRONMENT_ID" --arg service "$RAILWAY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$vars" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "false" ]
          clerk_secret="$(printf '%s' "$response" | jq -r '.data.variables.CLERK_SECRET_KEY // empty')"
          runtime_db="$(printf '%s' "$response" | jq -r '.data.variables.DATABASE_URL // empty')"
          [ -n "$clerk_secret" ]
          [ -n "$runtime_db" ]
          case "$runtime_db" in
            postgresql+psycopg://*) sqlalchemy_url="$runtime_db" ;;
            postgresql+asyncpg://*) sqlalchemy_url="postgresql+psycopg://${runtime_db#postgresql+asyncpg://}" ;;
            postgresql://*) sqlalchemy_url="postgresql+psycopg://${runtime_db#postgresql://}" ;;
            postgres://*) sqlalchemy_url="postgresql+psycopg://${runtime_db#postgres://}" ;;
            *) echo '::error::Runtime DB URL is not PostgreSQL'; exit 1 ;;
          esac
          echo "::add-mask::$clerk_secret"
          echo "::add-mask::$sqlalchemy_url"
          echo "CLERK_SECRET_KEY=$clerk_secret" >> "$GITHUB_ENV"
          echo "DATABASE_URL=$sqlalchemy_url" >> "$GITHUB_ENV"

      - name: Remove exact disposable Clerk and Security identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import httpx
          from sqlalchemy import create_engine, text

          email = os.environ['TEST_EMAIL'].lower()
          user_id = os.environ['SECURITY_USER_ID']
          clerk_id = os.environ['CLERK_USER_ID']
          headers = {'Authorization': f"Bearer {os.environ['CLERK_SECRET_KEY']}"}
          clerk_api = 'https://api.clerk.com/v1'

          current = httpx.get(f'{clerk_api}/users/{clerk_id}', headers=headers, timeout=20.0)
          if current.status_code == 200:
              deleted = httpx.delete(f'{clerk_api}/users/{clerk_id}', headers=headers, timeout=20.0)
              assert deleted.status_code in (200, 204), (deleted.status_code, deleted.text[:300])
          elif current.status_code != 404:
              raise AssertionError(f'Unexpected Clerk lookup status {current.status_code}: {current.text[:300]}')

          engine = create_engine(os.environ['DATABASE_URL'], pool_pre_ping=True)
          with engine.begin() as conn:
              conn.execute(
                  text(
                      'DELETE FROM security.security_events '
                      'WHERE principal_id=CAST(:uid_uuid AS uuid) '
                      'OR entity_id=CAST(:uid_text AS varchar)'
                  ),
                  {'uid_uuid': user_id, 'uid_text': user_id},
              )
              conn.execute(
                  text('DELETE FROM security.platform_user_onboarding_requests WHERE user_id=CAST(:uid AS uuid)'),
                  {'uid': user_id},
              )
              conn.execute(
                  text('DELETE FROM security.external_identities WHERE user_id=CAST(:uid AS uuid)'),
                  {'uid': user_id},
              )
              conn.execute(
                  text('DELETE FROM security.users WHERE user_id=CAST(:uid AS uuid)'),
                  {'uid': user_id},
              )
              conn.execute(
                  text('DELETE FROM security.security_principals WHERE principal_id=CAST(:uid AS uuid)'),
                  {'uid': user_id},
              )

          with engine.connect() as conn:
              counts = conn.execute(
                  text(
                      """
                      SELECT
                        (SELECT count(*) FROM security.users WHERE user_id=CAST(:uid AS uuid) OR lower(primary_email)=:email) AS users_count,
                        (SELECT count(*) FROM security.external_identities WHERE user_id=CAST(:uid AS uuid)) AS identities_count,
                        (SELECT count(*) FROM security.platform_user_onboarding_requests WHERE user_id=CAST(:uid AS uuid) OR lower(email)=:email) AS requests_count,
                        (SELECT count(*) FROM security.security_events WHERE principal_id=CAST(:uid AS uuid) OR entity_id=CAST(:uid_text AS varchar)) AS events_count,
                        (SELECT count(*) FROM security.security_principals WHERE principal_id=CAST(:uid AS uuid)) AS principals_count
                      """
                  ),
                  {'uid': user_id, 'uid_text': user_id, 'email': email},
              ).mappings().one()
          for key, value in counts.items():
              assert int(value) == 0, f'{key}={value}'

          confirm = httpx.get(f'{clerk_api}/users/{clerk_id}', headers=headers, timeout=20.0)
          assert confirm.status_code == 404, f'Clerk still returns {confirm.status_code}'
          print('CLEANUP_VERIFIED=true')
          print(f'CLEANED_EMAIL={email}')
          PY
