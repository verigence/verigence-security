name: Phase 5 Neon Security Administration

on:
  push:
    branches:
      - feature/phase5-*
      - feature/admin-control-plane-*
      - feature/clerk-*
      - feature/global-user-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-neon-security-administration
  cancel-in-progress: true

jobs:
  phase5-neon:
    name: Validate Phase 5 administration on Neon DEV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and test tooling
        run: python -m pip install -e '.[dev]'

      - name: Resolve Neon DEV connections
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-${DEV_DATABASE_URL:-}}"
          if [ -z "$raw" ]; then
            echo "::error::Neither MIGRATION_DATABASE_URL nor DEV_DATABASE_URL is configured."
            exit 1
          fi

          case "$raw" in
          postgresql+psycopg://*)
            psql_url="postgresql://${raw#postgresql+psycopg://}"
            sqlalchemy_url="$raw"
            ;;
          postgresql+asyncpg://*)
            psql_url="postgresql://${raw#postgresql+asyncpg://}"
            sqlalchemy_url="postgresql+psycopg://${raw#postgresql+asyncpg://}"
            ;;
          postgresql://*)
            psql_url="$raw"
            sqlalchemy_url="postgresql+psycopg://${raw#postgresql://}"
            ;;
          postgres://*)
            psql_url="postgresql://${raw#postgres://}"
            sqlalchemy_url="postgresql+psycopg://${raw#postgres://}"
            ;;
          *)
            echo "::error::Configured DEV database secret is not a PostgreSQL URL."
            exit 1
            ;;
          esac

          echo "::add-mask::$psql_url"
          echo "::add-mask::$sqlalchemy_url"
          echo "ADMIN_MIGRATION_DATABASE_URL=$psql_url" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$sqlalchemy_url" >> "$GITHUB_ENV"

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Verify immutable v1.3 migration digest
        shell: bash
        run: |
          set -euo pipefail
          expected="175d10780659c54f402980b08ea209cd34139c9ad28df6c4a758d521c7ca606d"
          actual="$(sha256sum migrations/0001_security_baseline_v1.3.sql | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Security v1.3 baseline migration changed."
            exit 1
          fi

      - name: Apply Admin Control Plane v1.4 migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$ADMIN_MIGRATION_DATABASE_URL" \
            -X \
            -v ON_ERROR_STOP=1 \
            -f migrations/0002_security_admin_control_plane_v1.4.sql

      - name: Apply global USER onboarding v1.4.2 migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$ADMIN_MIGRATION_DATABASE_URL" \
            -X \
            -v ON_ERROR_STOP=1 \
            -f migrations/0003_global_user_onboarding_v1.4.2.sql

      - name: Run current Phase 5 PostgreSQL administration tests
        shell: bash
        run: |
          set -euo pipefail
          tests=()
          for test_file in tests/integration/test_phase5_*.py; do
            case "$test_file" in
              tests/integration/test_phase5_admin_control_plane_schema.py|\
              tests/integration/test_phase5_onboarding_f.py|\
              tests/integration/test_phase5_platform_admin_api.py)
                continue
                ;;
            esac
            tests+=("$test_file")
          done
          pytest -q "${tests[@]}"
