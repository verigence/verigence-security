name: Deploy Audit Core Railway DEV

on:
  push:
    branches:
      - ops/audit-core-railway-inspect-20260816

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      AUDIT_CORE_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
      AUDIT_CORE_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
      AUDIT_CORE_SERVICE_ID: d8fb0a34-9097-40ba-b47c-ac3f82b7a3dd
      AUDIT_CORE_COMMIT_SHA: 3de3dd821f1b1f514a972b00b25ee3d45bc17300
      SECURITY_PROJECT_ID: a6808842-2e90-44f8-9172-63a905b24b5c
      SECURITY_ENVIRONMENT_ID: 09e12bb5-9781-4b01-974b-fde54d01e37c
      SECURITY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1
    steps:
      - name: Verify CI, Security JWKS and configure runtime
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] && [ -n "${MIGRATION_DATABASE_URL:-}" ] || { echo "::error::deployment secret missing"; exit 1; }
          ci="$(curl --fail-with-body --silent --show-error "https://api.github.com/repos/verigence/verigence-audit-core/actions/runs?head_sha=${AUDIT_CORE_COMMIT_SHA}&per_page=10")"
          state="$(printf '%s' "$ci" | jq -r '[.workflow_runs[] | select(.name == "CI")] | first | [.status, (.conclusion // "")] | @tsv')"
          [ "$state" = $'completed\tsuccess' ] || { echo "::error::Audit Core CI not green: $state"; exit 1; }

          domain_query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { domain } customDomains { domain } } }'
          domain_vars="$(jq -cn --arg project "$SECURITY_PROJECT_ID" --arg environment "$SECURITY_ENVIRONMENT_ID" --arg service "$SECURITY_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          domain_body="$(jq -cn --arg query "$domain_query" --argjson variables "$domain_vars" '{query:$query,variables:$variables}')"
          domain_response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Authorization: Bearer $RAILWAY_API_TOKEN" --header 'Content-Type: application/json' --data "$domain_body")"
          security_domain="$(printf '%s' "$domain_response" | jq -r '.data.domains.serviceDomains[0].domain // .data.domains.customDomains[0].domain // empty')"
          [ -n "$security_domain" ] || { echo "::error::Security domain missing"; exit 1; }
          security_url="https://$security_domain"
          jwks_code="$(curl --silent --show-error --output /tmp/jwks --write-out '%{http_code}' "$security_url/.well-known/jwks.json" || true)"
          [ "$jwks_code" = 200 ] || { echo "::error::Security JWKS unavailable"; exit 1; }
          oauth_code="$(curl --silent --show-error --output /tmp/oauth --write-out '%{http_code}' -X POST "$security_url/oauth/token" || true)"
          echo "oauth_code=$oauth_code" >> "$GITHUB_OUTPUT"

          raw="$MIGRATION_DATABASE_URL"
          case "$raw" in postgresql+psycopg://*) database_url="$raw";; postgresql://*) database_url="postgresql+psycopg://${raw#postgresql://}";; postgres://*) database_url="postgresql+psycopg://${raw#postgres://}";; *) exit 1;; esac
          echo "::add-mask::$database_url"
          runtime_vars="$(jq -cn --arg db "$database_url" --arg security "$security_url" '{APP_ENV:"dev",SERVICE_NAME:"verigence-audit-core",DATABASE_URL:$db,SECURITY_BASE_URL:$security,SECURITY_JWKS_URL:($security+"/.well-known/jwks.json"),SECURITY_ISSUER:"verigence-security",SECURITY_AUDIENCE:"verigence-platform"}')"
          input="$(jq -cn --arg project "$AUDIT_CORE_PROJECT_ID" --arg environment "$AUDIT_CORE_ENVIRONMENT_ID" --arg service "$AUDIT_CORE_SERVICE_ID" --argjson variables "$runtime_vars" '{projectId:$project,environmentId:$environment,serviceId:$service,variables:$variables}')"
          query='mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }'
          body="$(jq -cn --arg query "$query" --argjson input "$input" '{query:$query,variables:{input:$input}}')"
          response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Authorization: Bearer $RAILWAY_API_TOKEN" --header 'Content-Type: application/json' --data "$body")"
          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = true ]; then printf '%s\n' "$response" | jq -c '.errors'; exit 1; fi
          echo "CI=PASS SecurityJWKS=PASS SecurityOAuthHTTP=$oauth_code RuntimeVars=CONFIGURED"

      - name: Deploy exact validated commit
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          query='mutation deploy($serviceId: String!, $environmentId: String!, $commitSha: String) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha) }'
          vars="$(jq -cn --arg service "$AUDIT_CORE_SERVICE_ID" --arg environment "$AUDIT_CORE_ENVIRONMENT_ID" --arg sha "$AUDIT_CORE_COMMIT_SHA" '{serviceId:$service,environmentId:$environment,commitSha:$sha}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$vars" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Authorization: Bearer $RAILWAY_API_TOKEN" --header 'Content-Type: application/json' --data "$body")"
          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = true ]; then printf '%s\n' "$response" | jq -c '.errors'; exit 1; fi
          id="$(printf '%s' "$response" | jq -r '.data.serviceInstanceDeployV2 // empty')"
          [ -n "$id" ] || exit 1
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Deployment=$id"

      - name: Wait for deployment
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
        run: |
          set -euo pipefail
          query='query deployment($id: String!) { deployment(id: $id) { id status } }'
          vars="$(jq -cn --arg id "$DEPLOYMENT_ID" '{id:$id}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$vars" '{query:$query,variables:$variables}')"
          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Authorization: Bearer $RAILWAY_API_TOKEN" --header 'Content-Type: application/json' --data "$body")"
            status="$(printf '%s' "$response" | jq -r '.data.deployment.status // empty')"
            echo "Status=$status"
            case "$status" in SUCCESS) exit 0;; FAILED|CRASHED|REMOVED|SKIPPED) exit 1;; *) sleep 5;; esac
          done
          exit 1

      - name: Resolve or create domain and verify health
        id: live
        shell: bash
        run: |
          set -euo pipefail
          api() { curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Authorization: Bearer $RAILWAY_API_TOKEN" --header 'Content-Type: application/json' --data "$1"; }
          query='query domains($environmentId: String!, $serviceId: String!, $projectId: String!) { domains(environmentId: $environmentId, serviceId: $serviceId, projectId: $projectId) { serviceDomains { domain } } }'
          vars="$(jq -cn --arg project "$AUDIT_CORE_PROJECT_ID" --arg environment "$AUDIT_CORE_ENVIRONMENT_ID" --arg service "$AUDIT_CORE_SERVICE_ID" '{projectId:$project,environmentId:$environment,serviceId:$service}')"
          response="$(api "$(jq -cn --arg query "$query" --argjson variables "$vars" '{query:$query,variables:$variables}')")"
          domain="$(printf '%s' "$response" | jq -r '.data.domains.serviceDomains[0].domain // empty')"
          if [ -z "$domain" ]; then
            mutation='mutation serviceDomainCreate($input: ServiceDomainCreateInput!) { serviceDomainCreate(input: $input) { domain } }'
            input="$(jq -cn --arg environment "$AUDIT_CORE_ENVIRONMENT_ID" --arg service "$AUDIT_CORE_SERVICE_ID" '{environmentId:$environment,serviceId:$service}')"
            response="$(api "$(jq -cn --arg query "$mutation" --argjson input "$input" '{query:$query,variables:{input:$input}}')")"
            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = true ]; then printf '%s\n' "$response" | jq -c '.errors'; exit 1; fi
            domain="$(printf '%s' "$response" | jq -r '.data.serviceDomainCreate.domain // empty')"
          fi
          [ -n "$domain" ] || exit 1
          url="https://$domain"
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/health --write-out '%{http_code}' "$url/health" || true)"
            if [ "$code" = 200 ] && jq -e '.status == "ok"' /tmp/health >/dev/null 2>&1; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "PublicURL=$url Health=PASS"
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Deployment evidence
        shell: bash
        run: |
          echo "SOURCE_COMMIT=$AUDIT_CORE_COMMIT_SHA"
          echo "RAILWAY_DEPLOYMENT=${{ steps.deploy.outputs.id }}"
          echo "PUBLIC_URL=${{ steps.live.outputs.url }}"
          echo "HEALTH=PASS"
          echo "NEON=CONFIGURED"
          echo "SECURITY_JWKS=PASS"
          echo "SECURITY_OAUTH_HTTP=${{ steps.prepare.outputs.oauth_code }}"
          echo "DI=NOT_CONFIGURED_PENDING_DI_DEV"
