name: Inspect Audit Core Railpack build failure

on:
  push:
    branches:
      - ops/audit-core-railway-inspect-20260816

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DEPLOYMENT_ID: 2afc12a7-e1d9-46e8-b31f-988536558623
    steps:
      - name: Fetch Railway logs
        shell: bash
        run: |
          set -euo pipefail
          for key in buildLogs deploymentLogs; do
            if [ "$key" = buildLogs ]; then
              query='query buildLogs($deploymentId: String!, $limit: Int) { buildLogs(deploymentId: $deploymentId, limit: $limit) { timestamp message severity } }'
            else
              query='query deploymentLogs($deploymentId: String!, $limit: Int) { deploymentLogs(deploymentId: $deploymentId, limit: $limit) { timestamp message severity } }'
            fi
            variables="$(jq -cn --arg id "$DEPLOYMENT_ID" '{deploymentId:$id,limit:400}')"
            body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
            response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Authorization: Bearer $RAILWAY_API_TOKEN" --header 'Content-Type: application/json' --data "$body")"
            echo "===== $key ====="
            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = true ]; then printf '%s\n' "$response" | jq -c '.errors'; else printf '%s\n' "$response" | jq -r --arg key "$key" '.data[$key][]? | "\(.timestamp) [\(.severity)] \(.message)"'; fi
          done
