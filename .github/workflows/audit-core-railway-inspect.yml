name: Inspect failed Audit Core Railway deployment

on:
  push:
    branches:
      - ops/audit-core-railway-inspect-20260816

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      DEPLOYMENT_ID: 1be27075-dd7e-4193-bf73-e6a1e59b9a96
    steps:
      - name: Fetch Railway build and deployment logs
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo "::error::RAILWAY_API_TOKEN missing"; exit 1; }
          for query_name in buildLogs deploymentLogs; do
            if [ "$query_name" = "buildLogs" ]; then
              query='query buildLogs($deploymentId: String!, $limit: Int) { buildLogs(deploymentId: $deploymentId, limit: $limit) { timestamp message severity } }'
            else
              query='query deploymentLogs($deploymentId: String!, $limit: Int) { deploymentLogs(deploymentId: $deploymentId, limit: $limit) { timestamp message severity } }'
            fi
            variables="$(jq -cn --arg id "$DEPLOYMENT_ID" '{deploymentId:$id,limit:300}')"
            body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
            response="$(curl --fail-with-body --silent --show-error --request POST --url 'https://backboard.railway.com/graphql/v2' --header "Authorization: Bearer $RAILWAY_API_TOKEN" --header 'Content-Type: application/json' --data "$body")"
            echo "===== $query_name ====="
            if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
              printf '%s\n' "$response" | jq -c '.errors'
            else
              printf '%s\n' "$response" | jq -r --arg key "$query_name" '.data[$key][]? | "\(.timestamp) [\(.severity)] \(.message)"'
            fi
          done
