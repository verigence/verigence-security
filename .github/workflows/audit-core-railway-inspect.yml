name: Inspect Audit Core Railway project

on:
  push:
    branches:
      - ops/audit-core-railway-inspect-20260816

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      AUDIT_CORE_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
    steps:
      - name: Inspect project resources
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "::error::RAILWAY_API_TOKEN is not configured."
            exit 1
          fi
          query='query project($id: String!) { project(id: $id) { id name services { edges { node { id name } } } environments { edges { node { id name } } } } }'
          variables="$(jq -cn --arg id "$AUDIT_CORE_PROJECT_ID" '{id:$id}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Authorization: Bearer $RAILWAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"
          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            exit 1
          fi
          printf '%s\n' "$response" | jq -r '.data.project | "PROJECT \(.name) \(.id)", (.environments.edges[].node | "ENV \(.name) \(.id)"), (.services.edges[].node | "SERVICE \(.name) \(.id)")'
