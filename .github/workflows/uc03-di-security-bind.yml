name: UC03 Bind DI Security DEV

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/uc03-di-security-bind.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-dev-operation
  cancel-in-progress: false

env:
  PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
  PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
  DI_API_SERVICE: di-api
  DI_WORKER_SERVICE: di-worker
  DI_CLIENT_ID: verigence-di
  SECURITY_BASE_URL: https://security-dev.up.railway.app
  AUDIT_CORE_BASE_URL: https://verigence-audit-core-production.up.railway.app

jobs:
  bind:
    name: Provision DI ServiceIntegration and Railway variables
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

    steps:
      - name: Check out Security DEV
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Security runtime and Railway CLI
        run: |
          python -m pip install -e .
          npm install --global @railway/cli

      - name: Verify approved shared DEV target
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN is missing.'; exit 1; }
          railway link --project "$PLATFORM_PROJECT_ID" --environment "$PLATFORM_ENVIRONMENT_ID" --json >/tmp/link.json
          railway status --json >/tmp/status.json
          railway service list --json >/tmp/services.json
          [ "$(jq -r '.id // empty' /tmp/status.json)" = "$PLATFORM_PROJECT_ID" ] || {
            echo '::error::Railway token is not linked to the approved DEV project.'
            exit 1
          }
          names="$(jq -r '.[].name' /tmp/services.json)"
          grep -Fxq "$DI_API_SERVICE" <<<"$names" || { echo '::error::di-api service is missing.'; exit 1; }
          grep -Fxq "$DI_WORKER_SERVICE" <<<"$names" || { echo '::error::di-worker service is missing.'; exit 1; }
          echo 'DI_RAILWAY_TARGET=PASS'

      - name: Resolve or generate one dedicated DI client secret
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$DI_API_SERVICE" --environment "$PLATFORM_ENVIRONMENT_ID" --json >/tmp/di-api-vars.json
          railway variable list --service "$DI_WORKER_SERVICE" --environment "$PLATFORM_ENVIRONMENT_ID" --json >/tmp/di-worker-vars.json
          api_secret="$(jq -r '.DI_SECURITY_CLIENT_SECRET // empty' /tmp/di-api-vars.json)"
          worker_secret="$(jq -r '.DI_SECURITY_CLIENT_SECRET // empty' /tmp/di-worker-vars.json)"
          if [ -n "$api_secret" ] && [ -n "$worker_secret" ] && [ "$api_secret" != "$worker_secret" ]; then
            echo '::error::Existing DI API/worker Security client secrets disagree; refusing silent credential drift.'
            exit 1
          fi
          client_secret="${api_secret:-$worker_secret}"
          if [ -z "$client_secret" ]; then
            client_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          echo "::add-mask::$client_secret"
          echo "DI_CLIENT_SECRET=$client_secret" >> "$GITHUB_ENV"
          echo 'DI_CLIENT_SECRET_SOURCE=PASS'

      - name: Resolve Security DEV database
        shell: bash
        run: |
          set -euo pipefail
          raw="${MIGRATION_DATABASE_URL:-${DEV_DATABASE_URL:-}}"
          [ -n "$raw" ] || { echo '::error::Security DEV database URL is missing.'; exit 1; }
          case "$raw" in
            postgresql+psycopg://*) db="$raw" ;;
            postgresql+asyncpg://*) db="postgresql+psycopg://${raw#postgresql+asyncpg://}" ;;
            postgresql://*) db="postgresql+psycopg://${raw#postgresql://}" ;;
            postgres://*) db="postgresql+psycopg://${raw#postgres://}" ;;
            *) echo '::error::Security DEV database URL is not PostgreSQL.'; exit 1 ;;
          esac
          echo "::add-mask::$db"
          echo "DATABASE_URL=$db" >> "$GITHUB_ENV"

      - name: Provision dedicated DI ServiceIntegration credential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          from datetime import UTC, datetime
          from uuid import uuid4

          from argon2 import PasswordHasher
          from sqlalchemy import create_engine, text

          integration_key = os.environ["DI_CLIENT_ID"]
          secret = os.environ["DI_CLIENT_SECRET"]
          now = datetime.now(UTC)
          secret_hash = PasswordHasher().hash(secret)
          engine = create_engine(os.environ["DATABASE_URL"], pool_pre_ping=True)

          with engine.begin() as conn:
              admins = conn.execute(
                  text(
                      """
                      SELECT DISTINCT a.user_id
                      FROM security.user_admin_role_assignments a
                      JOIN security.users u ON u.user_id=a.user_id AND u.status='ACTIVE'
                      JOIN security.security_principals p ON p.principal_id=u.user_id AND p.status='ACTIVE'
                      WHERE a.role_key='SuperAdmin'
                        AND a.scope_type='PLATFORM'
                        AND a.scope_id IS NULL
                        AND a.status='ACTIVE'
                      """
                  )
              ).all()
              if len(admins) != 1:
                  raise SystemExit(f"Expected exactly one ACTIVE SuperAdmin; found {len(admins)}")
              admin_user_id = str(admins[0][0])

              existing = conn.execute(
                  text(
                      """
                      SELECT si.principal_id,p.actor_type,p.status
                      FROM security.service_integrations si
                      JOIN security.security_principals p ON p.principal_id=si.principal_id
                      WHERE si.integration_key=:integration_key
                      FOR UPDATE OF p
                      """
                  ),
                  {"integration_key": integration_key},
              ).mappings().first()

              if existing is None:
                  principal_id = str(uuid4())
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.security_principals
                          (principal_id,actor_type,principal_name,status,created_at_utc,updated_at_utc)
                          VALUES (:principal_id,'SERVICE_INTEGRATION','Verigence DI','ACTIVE',:now,:now)
                          """
                      ),
                      {"principal_id": principal_id, "now": now},
                  )
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.service_integrations
                          (principal_id,integration_key,description,created_at_utc)
                          VALUES (:principal_id,:integration_key,'Document Intelligence Security authorization client',:now)
                          """
                      ),
                      {"principal_id": principal_id, "integration_key": integration_key, "now": now},
                  )
              else:
                  if existing["actor_type"] != "SERVICE_INTEGRATION" or existing["status"] != "ACTIVE":
                      raise SystemExit("Existing verigence-di principal is not an ACTIVE SERVICE_INTEGRATION")
                  principal_id = str(existing["principal_id"])

              credential = conn.execute(
                  text(
                      """
                      SELECT credential_id,principal_id,status
                      FROM security.principal_credentials
                      WHERE client_id=:client_id
                      FOR UPDATE
                      """
                  ),
                  {"client_id": integration_key},
              ).mappings().first()

              if credential is None:
                  credential_id = str(uuid4())
                  conn.execute(
                      text(
                          """
                          INSERT INTO security.principal_credentials
                          (credential_id,principal_id,client_id,secret_hash,status,valid_from_utc,valid_to_utc,
                           created_by_user_id,created_at_utc,last_used_at_utc)
                          VALUES (:credential_id,:principal_id,:client_id,:secret_hash,'ACTIVE',:now,NULL,
                                  :admin_user_id,:now,NULL)
                          """
                      ),
                      {
                          "credential_id": credential_id,
                          "principal_id": principal_id,
                          "client_id": integration_key,
                          "secret_hash": secret_hash,
                          "admin_user_id": admin_user_id,
                          "now": now,
                      },
                  )
              else:
                  if str(credential["principal_id"]) != principal_id:
                      raise SystemExit("verigence-di client_id belongs to a different principal")
                  if credential["status"] == "REVOKED":
                      raise SystemExit("Existing verigence-di credential is REVOKED")
                  credential_id = str(credential["credential_id"])
                  conn.execute(
                      text(
                          """
                          UPDATE security.principal_credentials
                          SET secret_hash=:secret_hash,status='ACTIVE',valid_from_utc=:now,
                              valid_to_utc=NULL,last_used_at_utc=NULL
                          WHERE credential_id=:credential_id
                          """
                      ),
                      {"secret_hash": secret_hash, "now": now, "credential_id": credential_id},
                  )

          print(f"DI_SECURITY_SERVICE_INTEGRATION=PASS principal_id={principal_id}")
          PY

      - name: Verify live Security ServiceIntegration token
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$SECURITY_BASE_URL/health/ready" >/tmp/security-ready.json
          code="$(curl --silent --show-error --output /tmp/service-token.json --write-out '%{http_code}' \
            --user "$DI_CLIENT_ID:$DI_CLIENT_SECRET" \
            --request POST "$SECURITY_BASE_URL/security/v1/service/token" \
            --data-urlencode 'audience=security')"
          [ "$code" = "200" ] || {
            echo "::error::Security service-token issuance for DI failed HTTP $code."
            cat /tmp/service-token.json
            exit 1
          }
          TOKEN_FILE=/tmp/service-token.json python - <<'PY'
          import base64, json, os
          body=json.load(open(os.environ['TOKEN_FILE'], encoding='utf-8'))
          token=body.get('accessToken')
          if not isinstance(token, str) or not token:
              raise SystemExit('Security response did not contain accessToken')
          parts=token.split('.')
          payload=json.loads(base64.urlsafe_b64decode(parts[1] + '=' * (-len(parts[1]) % 4)))
          if payload.get('sub') != os.environ['DI_CLIENT_ID']:
              raise SystemExit('DI Security token subject mismatch')
          aud=payload.get('aud')
          if aud != 'security' and not (isinstance(aud, list) and 'security' in aud):
              raise SystemExit('DI Security token audience mismatch')
          print('DI_SECURITY_SERVICE_TOKEN=PASS')
          PY

      - name: Verify PC document permissions exist in Security catalogue/defaults
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          required={'di.document.upload','di.document.read','di.document.content.read','di.document.fields.read'}
          engine=create_engine(os.environ['DATABASE_URL'], pool_pre_ping=True)
          with engine.connect() as conn:
              active={str(r[0]) for r in conn.execute(text("SELECT permission_key FROM security.permissions WHERE status='ACTIVE' AND permission_key = ANY(:keys)"), {'keys': list(required)}).all()}
              defaults={str(r[0]) for r in conn.execute(text("SELECT permission_key FROM security.platform_role_permission_defaults WHERE role_key='PC' AND status='ACTIVE' AND permission_key = ANY(:keys)"), {'keys': list(required)}).all()}
          if active != required:
              raise SystemExit('Required DI document permissions are not ACTIVE: '+','.join(sorted(required-active)))
          if defaults != required:
              raise SystemExit('PC defaults are missing DI document permissions: '+','.join(sorted(required-defaults)))
          print('DI_PC_DOCUMENT_PERMISSIONS=PASS')
          PY

      - name: Persist DI Security/Audit integration variables without deploying
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$AUDIT_CORE_BASE_URL/health" >/tmp/audit-health.json
          for service in "$DI_API_SERVICE" "$DI_WORKER_SERVICE"; do
            railway variable set \
              --service "$service" \
              --environment "$PLATFORM_ENVIRONMENT_ID" \
              --skip-deploys \
              "DI_SECURITY_BASE_URL=$SECURITY_BASE_URL" \
              "DI_SECURITY_CLIENT_ID=$DI_CLIENT_ID" \
              "DI_AUDIT_CORE_BASE_URL=$AUDIT_CORE_BASE_URL" >/dev/null
            printf '%s' "$DI_CLIENT_SECRET" | railway variable set DI_SECURITY_CLIENT_SECRET \
              --stdin \
              --service "$service" \
              --environment "$PLATFORM_ENVIRONMENT_ID" \
              --skip-deploys >/dev/null
          done
          echo 'DI_INTEGRATION_VARIABLES_WRITTEN=PASS'

      - name: Verify persisted DI integration variable parity
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service "$DI_API_SERVICE" --environment "$PLATFORM_ENVIRONMENT_ID" --json >/tmp/di-api-after.json
          railway variable list --service "$DI_WORKER_SERVICE" --environment "$PLATFORM_ENVIRONMENT_ID" --json >/tmp/di-worker-after.json
          python - <<'PY'
          import json, os
          api=json.load(open('/tmp/di-api-after.json', encoding='utf-8'))
          worker=json.load(open('/tmp/di-worker-after.json', encoding='utf-8'))
          required={
              'DI_SECURITY_BASE_URL': os.environ['SECURITY_BASE_URL'],
              'DI_SECURITY_CLIENT_ID': os.environ['DI_CLIENT_ID'],
              'DI_AUDIT_CORE_BASE_URL': os.environ['AUDIT_CORE_BASE_URL'],
          }
          for name,data in [('di-api',api),('di-worker',worker)]:
              for key,value in required.items():
                  if data.get(key) != value:
                      raise SystemExit(f'{name} persisted {key} mismatch')
              if not data.get('DI_SECURITY_CLIENT_SECRET'):
                  raise SystemExit(f'{name} persisted DI_SECURITY_CLIENT_SECRET is missing')
          if api.get('DI_SECURITY_CLIENT_SECRET') != worker.get('DI_SECURITY_CLIENT_SECRET'):
              raise SystemExit('DI API/worker Security client-secret drift')
          print('DI_INTEGRATION_CONFIG_PARITY=PASS')
          PY
