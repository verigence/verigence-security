name: Security v2 SuperAdmin Reconcile Final

on:
  push:
    branches: [dev]
    paths: [.github/workflows/security-v2-superadmin-reconcile-final.yml]

permissions:
  contents: read
  statuses: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Perform guarded DEV SuperAdmin handover
        shell: bash
        run: |
          set -Eeuo pipefail
          target="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          post() {
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$1" -f context=security-v2-superadmin-final \
              -f description="$2" -f target_url="$target" >/dev/null
          }
          trap 'post failure "Approved SuperAdmin DEV handover failed closed"' ERR
          raw="${MIGRATION_DATABASE_URL:-}"
          [ -n "$raw" ] || exit 1
          echo "::add-mask::$raw"
          SECURITY_RECONCILE_DATABASE_URL="$raw" python - <<'PY'
          import os
          from sqlalchemy import text
          from verigence_security.config import Settings
          from verigence_security.db.session import build_session_factory
          from verigence_security.services.initial_super_admin import (
              InitialSuperAdminProvisioningService,
              PHASE1_SUPER_ADMIN_CLERK_USER_ID,
          )

          factory = build_session_factory(Settings(database_url=os.environ["SECURITY_RECONCILE_DATABASE_URL"]))
          if factory is None:
              raise SystemExit("Security DEV DB unavailable")

          with factory() as session:
              session.execute(text("SELECT pg_advisory_xact_lock(hashtext('security.v2.superadmin.handover'))"))
              approved = session.execute(text("""
                  SELECT user_id FROM security.external_identities
                  WHERE provider='CLERK' AND provider_subject=:subject LIMIT 1
              """), {"subject": PHASE1_SUPER_ADMIN_CLERK_USER_ID}).first()
              approved_id = str(approved[0]) if approved else None

              conflicts = list(session.execute(text("""
                  SELECT p.user_id,p.assignment_source,u.status user_status,sp.status principal_status,
                         EXISTS(SELECT 1 FROM security.external_identities e
                                WHERE e.user_id=p.user_id AND e.provider='CLERK' AND e.status='ACTIVE') clerk_backed
                  FROM security.platform_user_role_assignments p
                  JOIN security.users u ON u.user_id=p.user_id
                  JOIN security.security_principals sp ON sp.principal_id=p.user_id
                  WHERE p.role_key='platform.super_admin' AND p.status='ACTIVE'
                    AND (CAST(:approved AS uuid) IS NULL OR p.user_id<>CAST(:approved AS uuid))
                  FOR UPDATE
              """), {"approved": approved_id}).mappings())
              v2_conflicts = list(session.execute(text("""
                  SELECT user_id FROM security.user_admin_role_assignments
                  WHERE role_key='SuperAdmin' AND status='ACTIVE'
                    AND (CAST(:approved AS uuid) IS NULL OR user_id<>CAST(:approved AS uuid))
                  FOR UPDATE
              """), {"approved": approved_id}).mappings())
              if v2_conflicts:
                  raise SystemExit("Unexpected v2 SuperAdmin conflict")
              if conflicts:
                  if len(conflicts) != 1:
                      raise SystemExit("Expected exactly one legacy conflict")
                  row = conflicts[0]
                  if not (
                      str(row["assignment_source"]) == "BOOTSTRAP"
                      and str(row["user_status"]) == "ACTIVE"
                      and str(row["principal_status"]) == "ACTIVE"
                      and bool(row["clerk_backed"])
                  ):
                      raise SystemExit("Legacy conflict is not the proven Clerk-backed BOOTSTRAP identity")
                  session.execute(text("""
                      DELETE FROM security.platform_user_role_assignments
                      WHERE user_id=:uid AND role_key='platform.super_admin'
                        AND status='ACTIVE' AND assignment_source='BOOTSTRAP'
                  """), {"uid": str(row["user_id"])})
                  session.flush()

              result = InitialSuperAdminProvisioningService(session).provision(
                  clerk_user_id=PHASE1_SUPER_ADMIN_CLERK_USER_ID,
                  display_name="superadmin",
              )

              check = session.execute(text("""
                  SELECT
                    (SELECT count(*) FROM security.platform_user_role_assignments p
                     JOIN security.external_identities e ON e.user_id=p.user_id
                     WHERE p.role_key='platform.super_admin' AND p.status='ACTIVE'
                       AND e.provider='CLERK' AND e.status='ACTIVE' AND e.provider_subject=:subject) legacy_ok,
                    (SELECT count(*) FROM security.user_admin_role_assignments a
                     JOIN security.external_identities e ON e.user_id=a.user_id
                     WHERE a.role_key='SuperAdmin' AND a.scope_type='PLATFORM' AND a.scope_id IS NULL
                       AND a.status='ACTIVE' AND e.provider='CLERK' AND e.status='ACTIVE'
                       AND e.provider_subject=:subject) v2_ok,
                    (SELECT count(*) FROM security.platform_user_role_assignments
                     WHERE role_key='platform.super_admin' AND status='ACTIVE') legacy_total,
                    (SELECT count(*) FROM security.user_admin_role_assignments
                     WHERE role_key='SuperAdmin' AND status='ACTIVE') v2_total
              """), {"subject": PHASE1_SUPER_ADMIN_CLERK_USER_ID}).mappings().one()
              if tuple(int(check[k]) for k in ("legacy_ok","v2_ok","legacy_total","v2_total")) != (1,1,1,1):
                  raise SystemExit("Canonical SuperAdmin post-check failed")
              print(f"SUPERADMIN_HANDOVER=PASS created={result.created}")
          PY
          post success 'One approved Clerk SuperAdmin is active in legacy + v2 authority'
          trap - ERR
