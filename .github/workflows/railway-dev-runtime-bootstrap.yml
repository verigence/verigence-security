name: Railway DEV Runtime Bootstrap

on:
  push:
    branches:
      - feature/railway-dev-runtime-config

permissions:
  contents: read

concurrency:
  group: railway-dev-runtime-bootstrap
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: a6808842-2e90-44f8-9172-63a905b24b5c
  RAILWAY_ENVIRONMENT_ID: 09e12bb5-9781-4b01-974b-fde54d01e37c
  RAILWAY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

    steps:
      - name: Validate Railway project-token scope
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"query":"query { projectToken { projectId environmentId } }"}')"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            exit 1
          fi
          [ "$(printf '%s' "$response" | jq -r '.data.projectToken.projectId')" = "$RAILWAY_PROJECT_ID" ] || exit 1
          [ "$(printf '%s' "$response" | jq -r '.data.projectToken.environmentId')" = "$RAILWAY_ENVIRONMENT_ID" ] || exit 1
          echo "Railway project token matches DEV scope."

      - name: Check current DEV runtime-variable state
        id: variables
        shell: bash
        run: |
          set -euo pipefail
          query='query GetEnvironmentConfig($id: String!, $decryptVariables: Boolean) { environment(id: $id) { config(decryptVariables: $decryptVariables) } }'
          variables="$(jq -cn --arg id "$RAILWAY_ENVIRONMENT_ID" '{id:$id,decryptVariables:false}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            exit 1
          fi

          current_keys="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" '((.data.environment.config.services[$service].variables // {}) | keys)')"
          required='["APP_ENV","DATABASE_URL","DEV_MOCK_AUTH_ENABLED","DEV_MOCK_SIGNING_SECRET","DEV_MOCK_TOKEN_TTL_MINUTES","MOCK_NETWORK_RISK_STATUS","NETWORK_RISK_MODE","SECURITY_KEY_ID","SECURITY_PRIVATE_KEY_PEM","SECURITY_PUBLIC_KEY_PEM","SECURITY_TOKEN_AUDIENCE","SECURITY_TOKEN_ISSUER","TRUSTED_REMOTE_IP_HEADER"]'
          present_required="$(jq -cn --argjson keys "$current_keys" --argjson required "$required" '[ $required[] | select($keys | index(.) != null) ] | length')"
          required_count="$(jq -cn --argjson required "$required" '$required | length')"

          echo "Configured service variable names: $(printf '%s' "$current_keys" | jq -r 'join(", ")')"
          if [ "$present_required" = "$required_count" ]; then
            echo "provision=false" >> "$GITHUB_OUTPUT"
            echo "Required DEV runtime variables are already present; bootstrap will not rotate secrets."
          elif [ "$present_required" = "0" ]; then
            echo "provision=true" >> "$GITHUB_OUTPUT"
            echo "No required DEV runtime variables exist; safe to provision the initial set."
          else
            echo "::error::DEV runtime variables are partially configured. Refusing to overwrite or rotate a partial configuration automatically."
            exit 1
          fi

      - name: Derive and validate Neon pooled runtime URL
        if: steps.variables.outputs.provision == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MIGRATION_DATABASE_URL:-}" ]; then
            echo "::error::MIGRATION_DATABASE_URL is unavailable."
            exit 1
          fi

          pooled_url="$(python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          raw = os.environ["MIGRATION_DATABASE_URL"]
          raw = raw.replace("postgresql+psycopg://", "postgresql://", 1).replace("postgresql+asyncpg://", "postgresql://", 1)
          parts = urlsplit(raw)
          host = parts.hostname or ""
          if not host:
              raise SystemExit("missing Neon hostname")
          if "-pooler" not in host:
              first, sep, rest = host.partition(".")
              pooled_host = f"{first}-pooler{sep}{rest}" if sep else f"{first}-pooler"
              netloc = parts.netloc.replace(host, pooled_host, 1)
          else:
              netloc = parts.netloc
          pooled = urlunsplit((parts.scheme, netloc, parts.path, parts.query, parts.fragment))
          print(pooled.replace("postgresql://", "postgresql+psycopg://", 1))
          PY
          )"
          echo "::add-mask::$pooled_url"
          echo "POOLED_DATABASE_URL=$pooled_url" >> "$GITHUB_ENV"

          psql_url="${pooled_url/postgresql+psycopg:\/\//postgresql:\/\/}"
          echo "::add-mask::$psql_url"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          [ "$(psql "$psql_url" -X -v ON_ERROR_STOP=1 -Atc 'SELECT 1;')" = "1" ]
          echo "Pooled Neon runtime connection validated."

      - name: Generate initial DEV signing material
        if: steps.variables.outputs.provision == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/security-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/security-private.pem -pubout -out /tmp/security-public.pem >/dev/null 2>&1
          mock_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$mock_secret"
          echo "DEV_MOCK_SIGNING_SECRET_VALUE=$mock_secret" >> "$GITHUB_ENV"
          echo "Generated initial DEV-only RSA signing keypair and mock-auth signing secret without printing secret material."

      - name: Provision Railway DEV runtime variables
        if: steps.variables.outputs.provision == 'true'
        shell: bash
        run: |
          set -euo pipefail
          private_key="$(cat /tmp/security-private.pem)"
          public_key="$(cat /tmp/security-public.pem)"
          echo "::add-mask::$private_key"
          echo "::add-mask::$public_key"

          service_variables="$(jq -cn \
            --arg app_env 'dev' \
            --arg database_url "$POOLED_DATABASE_URL" \
            --arg issuer 'verigence-security' \
            --arg audience 'verigence-platform' \
            --arg key_id 'dev-sec-20260813-01' \
            --arg private_key "$private_key" \
            --arg public_key "$public_key" \
            --arg mock_enabled 'true' \
            --arg mock_secret "$DEV_MOCK_SIGNING_SECRET_VALUE" \
            --arg mock_ttl '10' \
            --arg risk_mode 'mock' \
            --arg risk_status 'NOT_DETECTED' \
            --arg remote_header 'X-Real-IP' \
            '{
              APP_ENV:{value:$app_env},
              DATABASE_URL:{value:$database_url},
              SECURITY_TOKEN_ISSUER:{value:$issuer},
              SECURITY_TOKEN_AUDIENCE:{value:$audience},
              SECURITY_KEY_ID:{value:$key_id},
              SECURITY_PRIVATE_KEY_PEM:{value:$private_key},
              SECURITY_PUBLIC_KEY_PEM:{value:$public_key},
              DEV_MOCK_AUTH_ENABLED:{value:$mock_enabled},
              DEV_MOCK_SIGNING_SECRET:{value:$mock_secret},
              DEV_MOCK_TOKEN_TTL_MINUTES:{value:$mock_ttl},
              NETWORK_RISK_MODE:{value:$risk_mode},
              MOCK_NETWORK_RISK_STATUS:{value:$risk_status},
              TRUSTED_REMOTE_IP_HEADER:{value:$remote_header}
            }')"
          patch="$(jq -cn --arg service "$RAILWAY_SERVICE_ID" --argjson vars "$service_variables" '{services:{($service):{variables:$vars}}}')"
          mutation='mutation EnvironmentPatchCommit($environmentId: String!, $patch: EnvironmentConfig!, $commitMessage: String) { environmentPatchCommit(environmentId: $environmentId, patch: $patch, commitMessage: $commitMessage) }'
          variables="$(jq -cn \
            --arg environment "$RAILWAY_ENVIRONMENT_ID" \
            --arg message 'Configure verigence-security DEV database, signing and mock-adapter runtime variables' \
            --argjson patch "$patch" \
            '{environmentId:$environment,patch:$patch,commitMessage:$message}')"
          body="$(jq -cn --arg query "$mutation" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://backboard.railway.com/graphql/v2' \
            --header "Project-Access-Token: $RAILWAY_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$body")"

          if [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = "true" ]; then
            printf '%s\n' "$response" | jq -c '.errors'
            echo "::error::Railway rejected DEV runtime-variable provisioning."
            exit 1
          fi
          echo "Railway accepted initial DEV runtime configuration."

      - name: Verify required Railway variable names
        shell: bash
        run: |
          set -euo pipefail
          query='query GetEnvironmentConfig($id: String!, $decryptVariables: Boolean) { environment(id: $id) { config(decryptVariables: $decryptVariables) } }'
          variables="$(jq -cn --arg id "$RAILWAY_ENVIRONMENT_ID" '{id:$id,decryptVariables:false}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"

          for attempt in $(seq 1 30); do
            response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --url 'https://backboard.railway.com/graphql/v2' \
              --header "Project-Access-Token: $RAILWAY_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$body")"
            keys="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" '((.data.environment.config.services[$service].variables // {}) | keys)')"
            count="$(printf '%s' "$keys" | jq 'length')"
            if [ "$count" -ge 13 ]; then
              echo "Verified Railway DEV application variable names: $(printf '%s' "$keys" | jq -r 'join(", ")')"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Required DEV runtime variable names did not become visible."
          exit 1
