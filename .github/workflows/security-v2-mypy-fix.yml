name: Security v2 Mypy Fix

on:
  push:
    branches:
      - ops/security-v2-ci-diagnose
    paths:
      - .github/workflows/security-v2-mypy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/security-v2-ci-diagnose
      - name: Apply narrow typing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'src/verigence_security/repositories/v2_rbac_repository.py': [
                  ('from typing import Any\n', 'from typing import Any, cast\n'),
                  ('from sqlalchemy import text\n', 'from sqlalchemy import text\nfrom sqlalchemy.engine import CursorResult\n'),
                  ('return bool(result.rowcount)', 'return bool(cast(CursorResult[Any], result).rowcount)'),
              ],
              'src/verigence_security/services/phase1_test_identity.py': [
                  ('            tenant = service.activate_tenant(\n                actor_user_id=actor_user_id,\n                tenant_id=tenant_id,\n                correlation_id=f"phase1-test-tenant-activate-{uuid4()}",\n            )\n            if tenant is None or str(tenant["status"]) != "ACTIVE":\n',
                   '            activated_tenant = service.activate_tenant(\n                actor_user_id=actor_user_id,\n                tenant_id=tenant_id,\n                correlation_id=f"phase1-test-tenant-activate-{uuid4()}",\n            )\n            if activated_tenant is None or str(activated_tenant["status"]) != "ACTIVE":\n'),
              ],
              'src/verigence_security/api/routes/v2_groups.py': [
                  ('memberCount=int(row["member_count"]),', 'memberCount=int(str(row["member_count"])),'),
              ],
              'src/verigence_security/api/routes/platform_modules.py': [
                  ('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nfrom typing import cast\n\n'),
                  ('return list(catalog["permissions"])  # type: ignore[arg-type]', 'return cast(list[dict[str, object]], catalog["permissions"])'),
              ],
              'src/verigence_security/api/routes/authorization.py': [
                  ('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nfrom uuid import UUID\n\n'),
                  ('        userId=decision.user_id,\n        tenantId=decision.tenant_id,\n',
                   '        userId=UUID(decision.user_id) if decision.user_id is not None else None,\n        tenantId=UUID(decision.tenant_id) if decision.tenant_id is not None else None,\n'),
              ],
          }
          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "fix: resolve Security v2 strict typing errors"
          git push origin HEAD:ops/security-v2-ci-diagnose
