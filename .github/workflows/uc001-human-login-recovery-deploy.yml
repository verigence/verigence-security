name: UC-001 Human Login Recovery Deploy

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/uc001-human-login-recovery-deploy.yml
      - src/verigence_security/config.py
      - src/verigence_security/api/routes/access.py
      - src/verigence_security/services/clerk_credentials.py
  workflow_dispatch:

permissions:
  contents: write

env:
  PLATFORM_PROJECT_ID: cf00a1cd-623e-4c72-8836-db95652c63db
  PLATFORM_ENVIRONMENT_ID: 398c3cfb-d7c7-4aaf-b5a4-3b44d3087451
  SECURITY_SERVICE: security
  SECURITY_URL: https://security-dev.up.railway.app
  WEB_URL: https://verigence-web-dev.jbrconsulting-it.workers.dev
  SUPERADMIN_EMAIL: jbrconsulting.it@gmail.com
  SUPERADMIN_CLERK_ID: user_3I7FdD5Pkmydsp23OfjH9hBMxpN
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Validate active human token TTL recovery
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python -m pip install -e . >/dev/null
          python - <<'PY'
          from verigence_security.config import Settings
          value = Settings().platform_admin_token_ttl_minutes
          assert value == 15, f"expected default human token TTL 15, got {value!r}"
          print('HUMAN_TOKEN_TTL_DEFAULT=PASS')
          PY
          echo 'TTL_SOURCE=PASS' >> "$GITHUB_ENV"

      - name: Install Railway CLI and link DEV service
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli >/dev/null
          [ -n "${RAILWAY_API_TOKEN:-}" ] || { echo '::error::RAILWAY_API_TOKEN missing'; exit 1; }
          [ -n "${RAILWAY_TOKEN:-}" ] || { echo '::error::RAILWAY_TOKEN missing'; exit 1; }
          env -u RAILWAY_TOKEN railway link \
            --project "$PLATFORM_PROJECT_ID" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --json >/tmp/railway-link.json
          env -u RAILWAY_TOKEN railway service list --json >/tmp/services.json
          service_id="$(jq -r --arg service "$SECURITY_SERVICE" '[.[] | select(.name==$service)] | first | .id // empty' /tmp/services.json)"
          [ -n "$service_id" ] || { echo '::error::Security Railway service not found'; exit 1; }
          echo "RAILWAY_SERVICE_ID=$service_id" >> "$GITHUB_ENV"

      - name: Snapshot current Railway deployment
        shell: bash
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          response="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' \
            --data "$body" 'https://backboard.railway.com/graphql/v2')"
          [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = false ] || { printf '%s\n' "$response" | jq -c '.errors'; exit 1; }
          previous="$(printf '%s' "$response" | jq -r --arg service "$RAILWAY_SERVICE_ID" '[.data.environment.serviceInstances.edges[].node | select(.serviceId==$service)] | first | .latestDeployment.id // empty')"
          echo "PREVIOUS_DEPLOYMENT_ID=$previous" >> "$GITHUB_ENV"

      - name: Deploy current Security DEV source
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_TOKEN railway up \
            --service "$SECURITY_SERVICE" \
            --environment "$PLATFORM_ENVIRONMENT_ID" \
            --detach
          echo 'SOURCE_UPLOAD=PASS' >> "$GITHUB_ENV"

      - name: Wait for new successful Railway deployment
        shell: bash
        run: |
          set -euo pipefail
          query='query EnvironmentInstances($environmentId: String!, $projectId: String!) { environment(id: $environmentId, projectId: $projectId) { serviceInstances(first: 500) { edges { node { serviceId latestDeployment { id status } } } } } }'
          variables="$(jq -cn --arg project "$PLATFORM_PROJECT_ID" --arg environment "$PLATFORM_ENVIRONMENT_ID" '{projectId:$project,environmentId:$environment}')"
          body="$(jq -cn --arg query "$query" --argjson variables "$variables" '{query:$query,variables:$variables}')"
          new_id=''
          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error -X POST \
              -H "Project-Access-Token: $RAILWAY_TOKEN" -H 'Content-Type: application/json' \
              --data "$body" 'https://backboard.railway.com/graphql/v2')"
            [ "$(printf '%s' "$response" | jq -r 'has("errors")')" = false ] || exit 1
            node="$(printf '%s' "$response" | jq -c --arg service "$RAILWAY_SERVICE_ID" '[.data.environment.serviceInstances.edges[].node | select(.serviceId==$service)] | first // {}')"
            deployment_id="$(printf '%s' "$node" | jq -r '.latestDeployment.id // empty')"
            status="$(printf '%s' "$node" | jq -r '.latestDeployment.status // empty')"
            if [ -z "$deployment_id" ] || [ "$deployment_id" = "${PREVIOUS_DEPLOYMENT_ID:-}" ]; then
              sleep 5
              continue
            fi
            echo "New Security deployment $deployment_id status=$status"
            case "$status" in
              SUCCESS)
                new_id="$deployment_id"
                break
                ;;
              FAILED|CRASHED|REMOVED|SKIPPED)
                echo "::error::New Security deployment ended with $status"
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done
          [ -n "$new_id" ] || { echo '::error::No successful new deployment observed'; exit 1; }
          echo "NEW_DEPLOYMENT_ID=$new_id" >> "$GITHUB_ENV"
          echo 'DEPLOYMENT=PASS' >> "$GITHUB_ENV"

      - name: Verify Security readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' "$SECURITY_URL/health/ready" || true)"
            if [ "$code" = 200 ]; then
              echo 'READINESS=PASS' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Security readiness failed'
          exit 1

      - name: Generate and assign proven temporary SuperAdmin password
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/superadmin-final-password.txt
          import secrets
          import string
          alphabet = string.ascii_letters + string.digits + '!@#%_-'
          while True:
              value = ''.join(secrets.choice(alphabet) for _ in range(22))
              if (any(c.islower() for c in value)
                  and any(c.isupper() for c in value)
                  and any(c.isdigit() for c in value)
                  and any(c in '!@#%_-' for c in value)):
                  print(value)
                  break
          PY
          password="$(cat /tmp/superadmin-final-password.txt)"
          echo "::add-mask::$password"
          echo "TEMP_PASSWORD=$password" >> "$GITHUB_ENV"
          chmod 600 /tmp/superadmin-final-password.txt
          response="$(curl --fail-with-body --silent --show-error -X PATCH \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg password "$password" '{password:$password,sign_out_of_other_sessions:true}')" \
            "https://api.clerk.com/v1/users/$SUPERADMIN_CLERK_ID")"
          [ "$(printf '%s' "$response" | jq -r '.id // empty')" = "$SUPERADMIN_CLERK_ID" ]
          [ "$(printf '%s' "$response" | jq -r '.banned // false')" = false ]
          [ "$(printf '%s' "$response" | jq -r '.locked // false')" = false ]
          verify="$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $CLERK_SECRET_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg password "$password" '{password:$password}')" \
            "https://api.clerk.com/v1/users/$SUPERADMIN_CLERK_ID/verify_password")"
          [ "$(printf '%s' "$verify" | jq -r '.verified // false')" = true ]
          echo 'CLERK_PASSWORD=PASS' >> "$GITHUB_ENV"

      - name: Prove direct Security SuperAdmin login
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg identifier "$SUPERADMIN_EMAIL" --arg password "$TEMP_PASSWORD" '{identifier:$identifier,password:$password}')"
          code="$(curl --silent --show-error -o /tmp/direct.json -w '%{http_code}' \
            -X POST "$SECURITY_URL/security/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          [ "$code" = 200 ] || { echo "::error::Direct Security login HTTP $code"; cat /tmp/direct.json; exit 1; }
          [ "$(jq -r '.actorType // empty' /tmp/direct.json)" = USER ]
          [ "$(jq -r '.isSuperAdmin // false' /tmp/direct.json)" = true ]
          [ -n "$(jq -r '.accessToken // empty' /tmp/direct.json)" ]
          rm -f /tmp/direct.json
          echo 'DIRECT_LOGIN=PASS' >> "$GITHUB_ENV"

      - name: Prove Cloudflare Web proxy SuperAdmin login
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg identifier "$SUPERADMIN_EMAIL" --arg password "$TEMP_PASSWORD" '{identifier:$identifier,password:$password}')"
          code="$(curl --silent --show-error -D /tmp/web.headers -o /tmp/web.json -w '%{http_code}' \
            -X POST "$WEB_URL/security/v1/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$payload")"
          [ "$code" = 200 ] || { echo "::error::Web proxy login HTTP $code"; cat /tmp/web.json; exit 1; }
          grep -qi '^x-verigence-proxy: security' /tmp/web.headers
          [ "$(jq -r '.isSuperAdmin // false' /tmp/web.json)" = true ]
          rm -f /tmp/web.json
          echo 'WEB_LOGIN=PASS' >> "$GITHUB_ENV"

      - name: Upload final proven temporary password
        if: always() && env.CLERK_PASSWORD == 'PASS'
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-final-password-${{ github.run_id }}
          path: /tmp/superadmin-final-password.txt
          retention-days: 1
          if-no-files-found: error

      - name: Record recovery proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/deploy-evidence
          cat > docs/deploy-evidence/UC001_HUMAN_LOGIN_RECOVERY_PROOF.md <<EOF
          # UC-001 Human Login Recovery Proof

          - run_id: $GITHUB_RUN_ID
          - source_sha: ${SOURCE_SHA:-unknown}
          - human_token_ttl_default: ${TTL_SOURCE:-not_reached}
          - source_upload: ${SOURCE_UPLOAD:-not_reached}
          - previous_railway_deployment_id: ${PREVIOUS_DEPLOYMENT_ID:-unknown}
          - new_railway_deployment_id: ${NEW_DEPLOYMENT_ID:-unknown}
          - deployment: ${DEPLOYMENT:-not_reached}
          - readiness: ${READINESS:-not_reached}
          - superadmin_clerk_password: ${CLERK_PASSWORD:-not_reached}
          - direct_security_login: ${DIRECT_LOGIN:-not_reached}
          - cloudflare_proxy_login: ${WEB_LOGIN:-not_reached}
          - password_artifact: superadmin-final-password-$GITHUB_RUN_ID
          - job_status: ${{ job.status }}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deploy-evidence/UC001_HUMAN_LOGIN_RECOVERY_PROOF.md
          git commit -m 'docs(dev): record UC-001 human login recovery proof [skip ci]' || exit 0
          git pull --rebase origin dev
          git push origin HEAD:dev
