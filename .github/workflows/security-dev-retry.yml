name: Normalize Security DEV database URL and retry deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-dev-retry.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  normalize-and-retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SECURITY_RAILWAY_SERVICE_ID: cfc90262-4b33-419d-a874-4592de9e8db1

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm install --global @railway/cli

      - name: Normalize existing Railway database connection for psycopg
        shell: bash
        run: |
          set -euo pipefail
          env -u RAILWAY_API_TOKEN railway run --service "$SECURITY_RAILWAY_SERVICE_ID" --no-local \
            python - <<'PY' > /tmp/normalized-db-url
          import os
          raw = os.environ.get('DATABASE_URL') or os.environ.get('SECURITY_ROLE_DATABASE_URL') or ''
          if not raw:
              raise SystemExit('Security Railway service has no database URL')
          for prefix in ('postgresql+psycopg://', 'postgresql+asyncpg://'):
              if raw.startswith(prefix):
                  raw = 'postgresql://' + raw[len(prefix):]
                  break
          if raw.startswith('postgres://'):
              raw = 'postgresql://' + raw[len('postgres://'):]
          print(raw)
          PY
          db_url=$(cat /tmp/normalized-db-url)
          echo "::add-mask::$db_url"
          printf '%s' "$db_url" | env -u RAILWAY_API_TOKEN railway variable set DATABASE_URL \
            --service "$SECURITY_RAILWAY_SERVICE_ID" --stdin --skip-deploys >/dev/null
          printf '%s' "$db_url" | env -u RAILWAY_API_TOKEN railway variable set SECURITY_ROLE_DATABASE_URL \
            --service "$SECURITY_RAILWAY_SERVICE_ID" --stdin --skip-deploys >/dev/null
          echo "Security DEV database URL normalized without changing the database target"

      - name: Dispatch complete Security DEV deployment verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run security-dev-deploy.yml --ref main
