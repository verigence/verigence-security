name: Security v1.4.8 Neon Validation

on:
  pull_request:
    branches:
      - dev
    paths:
      - "migrations/0009_backend_email_otp_facade_v1.4.8.sql"
      - ".github/workflows/v148-neon-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-v148-neon-validation
  cancel-in-progress: false

jobs:
  validate-v148-migration:
    name: Apply and validate backend-auth migration on Neon DEV
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SECURITY_MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SHARED_DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve configured Neon migration secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SECURITY_MIGRATION_DATABASE_URL:-}" ]; then
            resolved="$SECURITY_MIGRATION_DATABASE_URL"
            source_name="MIGRATION_DATABASE_URL"
          elif [ -n "${SHARED_DEV_DATABASE_URL:-}" ]; then
            resolved="$SHARED_DEV_DATABASE_URL"
            source_name="DEV_DATABASE_URL"
          else
            echo "::error::Neither MIGRATION_DATABASE_URL nor DEV_DATABASE_URL is configured."
            exit 1
          fi
          case "$resolved" in
            postgresql+asyncpg://*) resolved="postgresql://${resolved#postgresql+asyncpg://}" ;;
            postgresql+psycopg://*) resolved="postgresql://${resolved#postgresql+psycopg://}" ;;
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::Configured DEV database secret is not a supported PostgreSQL URL."
              exit 1
              ;;
          esac
          echo "::add-mask::$resolved"
          echo "MIGRATION_DATABASE_URL=$resolved" >> "$GITHUB_ENV"
          echo "Using configured Neon DEV connection from secret: $source_name"

      - name: Verify prerequisite onboarding schema
        shell: bash
        run: |
          set -euo pipefail
          exists="$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM information_schema.tables
            WHERE table_schema='security'
              AND table_name='platform_user_signup_attempts';
          ")"
          if [ "$exists" != "1" ]; then
            echo "::error::platform_user_signup_attempts is missing; refusing partial v1.4.8 migration."
            exit 1
          fi

      - name: Apply additive v1.4.8 migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$MIGRATION_DATABASE_URL" \
            -X \
            -v ON_ERROR_STOP=1 \
            -f migrations/0009_backend_email_otp_facade_v1.4.8.sql

      - name: Validate v1.4.8 schema and secret non-persistence
        shell: bash
        run: |
          set -euo pipefail
          email_id_column="$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM information_schema.columns
            WHERE table_schema='security'
              AND table_name='platform_user_signup_attempts'
              AND column_name='clerk_email_address_id'
              AND data_type='character varying';
          ")"
          if [ "$email_id_column" != "1" ]; then
            echo "::error::clerk_email_address_id was not created correctly."
            exit 1
          fi

          email_id_index="$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM pg_indexes
            WHERE schemaname='security'
              AND tablename='platform_user_signup_attempts'
              AND indexname='uq_platform_user_signup_attempt_clerk_email';
          ")"
          if [ "$email_id_index" != "1" ]; then
            echo "::error::Clerk email-address correlation index is missing."
            exit 1
          fi

          forbidden="$(psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM information_schema.columns
            WHERE table_schema='security'
              AND table_name='platform_user_signup_attempts'
              AND lower(column_name) IN ('password','otp','verification_code','email_otp','totp_code');
          ")"
          if [ "$forbidden" != "0" ]; then
            echo "::error::Credential/OTP persistence column detected."
            exit 1
          fi

          echo "Security v1.4.8 Neon migration validation PASSED."
